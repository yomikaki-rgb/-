<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>読解問題よみあげアプリ</title>
  <style>
    :root{
      --bg:#f7f8fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --accent:#2563eb;
      --accent-soft:#dbeafe;
      --danger:#dc2626;
      --active:#ecfeff;
      --shadow:0 8px 24px rgba(15,23,42,.08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .app{
      max-width:920px;
      margin:0 auto;
      padding:20px 16px 36px;
    }
    .panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
      margin-bottom:16px;
    }
    .topbar{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    h1{
      font-size:22px;
      margin:0;
      letter-spacing:.02em;
    }
    .sub{
      color:var(--muted);
      font-size:13px;
      margin-top:6px;
      word-break:break-all;
    }
    .controls{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    label{
      font-size:14px;
      color:var(--muted);
    }
    select, button{
      font:inherit;
    }
    select{
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      padding:10px 12px;
      min-width:92px;
    }
    button{
      border:none;
      border-radius:14px;
      padding:12px 14px;
      background:#fff;
      cursor:pointer;
      border:1px solid var(--line);
    }
    .stop-btn{
      background:#fff1f2;
      color:var(--danger);
      border-color:#fecdd3;
      font-weight:700;
    }
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }
    @media (max-width: 760px){
      .grid{grid-template-columns:1fr}
    }
    .section-title{
      font-size:18px;
      font-weight:800;
      margin:0 0 12px 0;
    }
    .list{
      display:grid;
      gap:10px;
    }
    .item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px 14px;
      min-height:66px;
      transition:.15s ease;
    }
    .item.active{
      background:var(--active);
      border-color:#67e8f9;
      transform:translateY(-1px);
    }
    .num-wrap{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .circled{
      width:38px;
      height:38px;
      border-radius:999px;
      border:2px solid var(--text);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:18px;
      line-height:1;
      flex:0 0 auto;
      background:#fff;
    }
    .plain-num{
      font-weight:800;
      font-size:24px;
      line-height:1.1;
      letter-spacing:.02em;
      min-width:0;
      word-break:break-word;
    }
    .speak-btn{
      width:52px;
      height:52px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      background:#eff6ff;
      border:1px solid #bfdbfe;
      flex:0 0 auto;
    }
    .speak-btn:active{transform:scale(.98)}
    .meta{
      margin-top:6px;
      color:var(--muted);
      font-size:12px;
    }
    .empty{
      color:var(--muted);
      padding:14px 0 4px;
    }
    .error{
      color:#991b1b;
      background:#fef2f2;
      border:1px solid #fecaca;
      border-radius:16px;
      padding:14px 16px;
      font-weight:700;
      line-height:1.6;
    }
    .footnote{
      font-size:12px;
      color:var(--muted);
      margin-top:10px;
    }
    .loading{
      font-size:15px;
      color:var(--muted);
      padding:8px 0 2px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <div class="topbar">
        <div>
          <h1>読解問題よみあげアプリ</h1>
          <div class="sub" id="csvLabel">CSV: 読み込み前</div>
          <div class="footnote">生徒モード固定 / 起動時にCSVを毎回fetchして上書き</div>
        </div>
        <div class="controls">
          <label for="rateSelect">よみあげ はやさ</label>
          <select id="rateSelect" aria-label="読み上げ速度">
            <option value="0.7">0.7</option>
            <option value="0.8">0.8</option>
            <option value="0.9">0.9</option>
            <option value="1" selected>1.0</option>
            <option value="1.1">1.1</option>
            <option value="1.2">1.2</option>
            <option value="1.3">1.3</option>
            <option value="1.5">1.5</option>
          </select>
          <button type="button" class="stop-btn" id="stopBtn" aria-label="読み上げ停止">■ とめる</button>
        </div>
      </div>
    </div>

    <div id="status" class="panel">
      <div class="loading">CSVをよみこんでいます…</div>
    </div>

    <div class="grid" id="mainGrid" hidden>
      <section class="panel">
        <h2 class="section-title">ほんぶん</h2>
        <div class="list" id="passageList"></div>
        <div class="empty" id="passageEmpty" hidden>本文データはありません。</div>
      </section>

      <section class="panel">
        <h2 class="section-title">もんだい</h2>
        <div class="list" id="questionList"></div>
        <div class="empty" id="questionEmpty" hidden>問題データはありません。</div>
      </section>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'reading_audio_app_student_state';
      const els = {
        csvLabel: document.getElementById('csvLabel'),
        rateSelect: document.getElementById('rateSelect'),
        stopBtn: document.getElementById('stopBtn'),
        status: document.getElementById('status'),
        mainGrid: document.getElementById('mainGrid'),
        passageList: document.getElementById('passageList'),
        questionList: document.getElementById('questionList'),
        passageEmpty: document.getElementById('passageEmpty'),
        questionEmpty: document.getElementById('questionEmpty'),
      };

      let currentActiveKey = null;
      let currentUtterance = null;
      let voices = [];

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const next = text[i + 1];

          if (char === '"') {
            if (inQuotes && next === '"') {
              field += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === ',' && !inQuotes) {
            row.push(field);
            field = '';
          } else if ((char === '\n' || char === '\r') && !inQuotes) {
            if (char === '\r' && next === '\n') i++;
            row.push(field);
            field = '';
            if (row.some(v => String(v).trim() !== '')) rows.push(row);
            row = [];
          } else {
            field += char;
          }
        }

        row.push(field);
        if (row.some(v => String(v).trim() !== '')) rows.push(row);

        return rows.map(r => {
          const item = {
            a: (r[0] ?? '').trim(),
            b: (r[1] ?? '').trim(),
            c: (r[2] ?? '').trim(),
            text: (r[3] ?? '').trim(),
          };
          item.type = normalizeType((r[4] ?? '').trim(), item);
          return item;
        }).filter(r => r.text);
      }

      function normalizeType(type, raw = {}) {
        const t = String(type).trim();
        if (t === '本文' || t.toLowerCase() === 'passage') return '本文';
        if (t === '問題' || t.toLowerCase() === 'question') return '問題';

        const hasA = String(raw.a ?? '').trim() !== '';
        const hasB = String(raw.b ?? '').trim() !== '';
        const hasC = String(raw.c ?? '').trim() !== '';
        const hasText = String(raw.text ?? '').trim() !== '';

        if (hasText && (hasA || hasB || hasC)) return '問題';
        return t;
      }

      function getParams() {
        const url = new URL(window.location.href);
        return {
          mode: url.searchParams.get('mode') || 'student',
          csv: url.searchParams.get('csv') || '',
        };
      }

      function buildQuestionLabel(item) {
        return [item.a, item.b, item.c].filter(Boolean).join('-');
      }

      function buildQuestionSpeechPrefix(item) {
        const parts = [item.a, item.b, item.c].filter(Boolean);
        if (!parts.length) return '問題';
        return '問題' + parts.join('の');
      }

      function buildPassageLabel(item) {
        return item.a || '0';
      }

      function buildKey(kind, item) {
        return `${kind}:${item.a}|${item.b}|${item.c}|${item.text}`;
      }

      function setStatusError(message) {
        els.status.innerHTML = `<div class="error">${message}</div>`;
        els.mainGrid.hidden = true;
      }

      function setStatusOk() {
        els.status.hidden = true;
        els.mainGrid.hidden = false;
      }

      function pickJapaneseVoice() {
        if (!voices.length) voices = window.speechSynthesis.getVoices() || [];
        return voices.find(v => /^ja(-|_)?/i.test(v.lang)) || voices[0] || null;
      }

      function stopSpeech(clearActive = true) {
        window.speechSynthesis.cancel();
        currentUtterance = null;
        if (clearActive) {
          currentActiveKey = null;
          updateActiveState();
        }
      }

      function updateActiveState() {
        document.querySelectorAll('.item').forEach(el => {
          const isActive = el.dataset.key === currentActiveKey;
          el.classList.toggle('active', isActive);
        });
      }

      function speak(text, key) {
        if (!text) return;
        stopSpeech(false);

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = Number(els.rateSelect.value || 1);
        const voice = pickJapaneseVoice();
        if (voice) utterance.voice = voice;

        currentUtterance = utterance;
        currentActiveKey = key;
        updateActiveState();

        utterance.onend = () => {
          if (currentUtterance === utterance) {
            currentUtterance = null;
            currentActiveKey = null;
            updateActiveState();
          }
        };
        utterance.onerror = () => {
          if (currentUtterance === utterance) {
            currentUtterance = null;
            currentActiveKey = null;
            updateActiveState();
          }
        };

        window.speechSynthesis.speak(utterance);
      }

      function createPassageItem(item) {
        const key = buildKey('本文', item);
        const row = document.createElement('div');
        row.className = 'item';
        row.dataset.key = key;

        const left = document.createElement('div');
        left.className = 'num-wrap';

        const circle = document.createElement('span');
        circle.className = 'circled';
        circle.textContent = buildPassageLabel(item);

        left.appendChild(circle);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'speak-btn';
        btn.setAttribute('aria-label', `本文 ${buildPassageLabel(item)} を読み上げ`);
        btn.textContent = '🔊';
        btn.addEventListener('click', () => speak(`本文${buildPassageLabel(item)}。${item.text}`, key));

        row.append(left, btn);
        return row;
      }

      function createQuestionItem(item) {
        const key = buildKey('問題', item);
        const row = document.createElement('div');
        row.className = 'item';
        row.dataset.key = key;

        const left = document.createElement('div');
        left.className = 'num-wrap';

        const label = document.createElement('div');
        label.className = 'plain-num';
        label.textContent = buildQuestionLabel(item);

        left.appendChild(label);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'speak-btn';
        btn.setAttribute('aria-label', `問題 ${buildQuestionLabel(item)} を読み上げ`);
        btn.textContent = '🔊';
        btn.addEventListener('click', () => speak(`${buildQuestionSpeechPrefix(item)}。${item.text}`, key));

        row.append(left, btn);
        return row;
      }

      function render(rows) {
        const passages = rows.filter(r => r.type === '本文');
        const questions = rows.filter(r => r.type === '問題');

        els.passageList.innerHTML = '';
        els.questionList.innerHTML = '';

        passages.forEach(item => els.passageList.appendChild(createPassageItem(item)));
        questions.forEach(item => els.questionList.appendChild(createQuestionItem(item)));

        els.passageEmpty.hidden = passages.length > 0;
        els.questionEmpty.hidden = questions.length > 0;

        setStatusOk();
      }

      async function loadStudentCsv() {
        const { mode, csv } = getParams();
        els.csvLabel.textContent = `CSV: ${csv || '未指定'}`;

        if (!csv) {
          setStatusError('CSVがよみこめませんでした。<br>URLの <strong>csv=</strong> をかくにんしてください。');
          return;
        }

        if (mode !== 'student') {
          // アプリ自体は生徒モード固定で動く
          console.warn('mode is not student, but app enforces student behavior.');
        }

        try {
          const res = await fetch(csv, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          const rows = parseCsv(text);

          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            mode: 'student',
            csv,
            loadedAt: new Date().toISOString(),
            rows
          }));

          render(rows);
        } catch (err) {
          console.error(err);
          setStatusError('CSVがよみこめませんでした。<br>ファイル名や配置、URLの <strong>csv=</strong> をかくにんしてください。');
        }
      }

      els.stopBtn.addEventListener('click', () => stopSpeech(true));
      els.rateSelect.addEventListener('change', () => {
        if (currentUtterance) {
          stopSpeech(true);
        }
      });

      window.speechSynthesis.addEventListener?.('voiceschanged', () => {
        voices = window.speechSynthesis.getVoices() || [];
      });

      window.addEventListener('beforeunload', () => stopSpeech(false));
      loadStudentCsv();
    })();
  </script>
</body>
</html>
