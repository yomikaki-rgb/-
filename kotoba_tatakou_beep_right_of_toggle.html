<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ことばをたたこう！</title>
<style>
  :root{
    --bg:#d9f6ff;
    --main:#179b49;
    --main2:#0d7f38;
    --accent:#0b75d1;
    --danger:#e91e63;
    --text:#222;
    --card:#fff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","UD デジタル 教科書体", "Noto Sans JP", system-ui, sans-serif;
    background:linear-gradient(180deg,#b6eff6 0%,#eafcff 100%);
    color:var(--text);
    min-height:100vh;
  }
  .app{
    max-width:980px;
    margin:0 auto;
    padding:18px 16px 28px;
  }
  header{
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  h1{
    margin:0;
    font-size:clamp(26px,4vw,42px);
    letter-spacing:.04em;
    color:#0a6c32;
    text-shadow:0 2px 0 #fff;
  }
  .pill{
    background:#fff;
    border:3px solid var(--main);
    border-radius:999px;
    padding:8px 14px;
    font-weight:700;
    box-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  .panel{
    background:rgba(255,255,255,.86);
    border:4px solid var(--main);
    border-radius:24px;
    padding:18px;
    box-shadow:0 8px 0 rgba(0,0,0,.13);
  }
  .screen{
    min-height:380px;
    display:grid;
    grid-template-rows:auto 1fr auto;
    gap:16px;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .progress{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    align-items:center;
  }
  .num{
    min-width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:#1fa742;
    color:white;
    font-size:22px;
    font-weight:800;
    border:3px solid #08752c;
    box-shadow:0 3px 0 rgba(0,0,0,.16);
  }
  .num.active{background:#7ef07f;color:#084d20}
  .mainarea{
    display:grid;
    place-items:center;
    text-align:center;
    padding:10px;
  }
  .questionBox{
    width:min(720px,100%);
    display:grid;
    gap:10px;
    justify-items:center;
  }
  .hiddenWord{
    min-height:92px;
    width:100%;
    display:grid;
    place-items:center;
    font-size:clamp(38px,8vw,74px);
    font-weight:800;
    letter-spacing:.08em;
    color:#111;
    background:#fff;
    border:4px dashed #81c784;
    border-radius:22px;
    padding:18px;
  }
  .hintOff{color:#9e9e9e;font-size:clamp(22px,4vw,36px);font-weight:700;}
  .tapDisplay{
    min-height:48px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .dot{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#1e88e5;
    border:3px solid #0d47a1;
    box-shadow:0 4px 0 rgba(0,0,0,.18);
  }
  .tapButton{
    width:min(280px,82vw);
    height:105px;
    border-radius:28px;
    border:5px solid #0d7f38;
    background:#fff;
    font-size:34px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 9px 0 rgba(0,0,0,.22);
    touch-action:manipulation;
  }
  .tapButton:active{transform:translateY(5px);box-shadow:0 4px 0 rgba(0,0,0,.22)}
  .tapButton.bad{
    border-color:#f44336;
    background:#ffebee;
    animation:shake .28s linear 2;
  }
  .tapDisplay.hiddenTaps{
    display:none;
  }
  .message{
    min-height:42px;
    font-size:clamp(22px,4vw,34px);
    font-weight:900;
  }
  .message.ok{color:#0a8f35}
  .message.ng{color:#d81b60}
  .buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
  }
  button{
    font-family:inherit;
  }
  .btn{
    border:0;
    border-radius:999px;
    padding:14px 22px;
    font-size:clamp(19px,3vw,26px);
    font-weight:900;
    color:#fff;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.22);
    touch-action:manipulation;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
  .listen{background:#ff9800}
  .hint{background:#9c27b0}
  .look{background:#673ab7}
  .reset{background:#e91e63}
  .done{background:#0b75d1}
  .next{background:#1fa742}
  .setting{background:#607d8b}
  details{
    margin-top:18px;
  }
  summary{
    cursor:pointer;
    font-size:20px;
    font-weight:800;
    color:#0a6c32;
  }
  .settingsGrid{
    margin-top:12px;
    display:grid;
    gap:14px;
  }
  .checkArea{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
  }
  label.check{
    background:#fff;
    border:2px solid #89c68f;
    border-radius:999px;
    padding:8px 12px;
    font-weight:700;
  }
  textarea{
    width:100%;
    min-height:220px;
    font-family:ui-monospace,Consolas,monospace;
    font-size:15px;
    border:2px solid #8bc34a;
    border-radius:12px;
    padding:12px;
  }
  .small{
    font-size:14px;
    line-height:1.6;
    color:#444;
  }
  .rowBtns{display:flex;gap:10px;flex-wrap:wrap}
  .miniBtn{
    border:0;
    border-radius:12px;
    padding:10px 14px;
    font-weight:800;
    background:#0a8f35;
    color:#fff;
    cursor:pointer;
  }
  .miniBtn.gray{background:#607d8b}
  .results{
    margin-top:14px;
    background:#fff;
    border-radius:16px;
    padding:12px;
    border:2px solid #a5d6a7;
  }
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{border-bottom:1px solid #ddd;padding:7px;text-align:left}

  .moraWrap{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:.18em;
  }
  .moraUnit{
    display:inline-block;
    border-radius:.22em;
    padding:.03em .12em;
    transition:background-color .15s ease, transform .15s ease, color .15s ease;
  }
  .moraUnit.active{
    background:#ffeb3b;
    color:#111;
    transform:scale(1.12);
    box-shadow:0 4px 0 rgba(0,0,0,.16);
  }
  .moraSep{
    color:#777;
    font-weight:800;
  }

  .answerSmall .moraWrap{
    font-size:clamp(28px,5.8vw,50px);
  }


  .moraCircleArea{
    display:none;
    width:100%;
    max-width:760px;
    margin:0 auto;
    padding:12px;
    background:#fffdf7;
    border:4px solid #ffb74d;
    border-radius:24px;
  }

  .moraCircleLayout{
    display:flex;
    align-items:flex-start;
    gap:12px;
  }

  .moraLevelBtns{
    display:flex;
    flex-direction:column;
    gap:10px;
    justify-content:flex-start;
    flex-wrap:nowrap;
    margin-bottom:0;
    flex:0 0 auto;
  }

  .moraCircleMain{
    flex:1 1 auto;
  }
  .moraLevelBtns .activeLevel{
    outline:4px solid #ffcc80;
    background:#0a8f35;
  }

  .slotRow,.paletteRow{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:center;
    align-items:center;
    min-height:90px;
    margin:12px 0;
  }
  .moraSlot{
    width:72px;
    height:72px;
    border:4px dashed #bbb;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fafafa;
  }
  .tapDisplay.bad{
    animation:shake .28s linear 2;
    background:#ffebee;
    border-radius:18px;
  }
  .moraSlot.bad{
    border-color:#f44336;
    animation:shake .28s linear 2;
    background:#ffebee;
  }
  .slotRow.level2Long{
    min-height:78px;
    margin:8px 0;
  }
  .moraLongSlot{
    width:min(540px,94%);
    min-height:72px;
    border:4px dashed #bbb;
    border-radius:18px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:flex-start;
    gap:10px;
    padding:8px 12px;
    background:#fafafa;
  }
  .moraLongSlot.bad{
    border-color:#f44336;
    animation:shake .28s linear 2;
    background:#ffebee;
  }
  .moraPiece.selectedPiece{
    transform:scale(1.12);
    filter:drop-shadow(0 0 6px rgba(255,140,0,.9));
  }

  .moraPiece{
    position:relative;
    cursor:grab;
    touch-action:none;
  }
  .circle-main{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#ef9a57;
    border:6px solid #f57c00;
  }
  .circle-small{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#3d63b8;
  }
  .youon-dot{
    position:absolute;
    width:26px;
    height:26px;
    border-radius:50%;
    background:#ff5b5b;
    border:5px solid #ff2d2d;
    right:-2px;
    bottom:-2px;
  }
  .pieceLabel{
    font-size:14px;
    font-weight:800;
    text-align:center;
    margin-top:4px;
  }
  @keyframes shake{
    0%{transform:translateX(0)}
    25%{transform:translateX(-4px)}
    50%{transform:translateX(4px)}
    75%{transform:translateX(-4px)}
    100%{transform:translateX(0)}
  }


  .tapControlRow{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:10px;
    flex-wrap:nowrap;
  }
  .tapResetSide{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:0;
  }

@media (max-width: 600px){
  .app{
    padding:10px 8px 18px;
  }
  h1{
    font-size:32px;
  }
  .panel{
    padding:12px;
    border-radius:18px;
  }
  .tapButton{
    width:min(240px,88vw);
    height:88px;
    font-size:28px;
    border-radius:22px;
  }
  .buttons{
    gap:8px;
  }
  .btn{
    padding:12px 16px;
    font-size:18px;
  }
  .num{
    min-width:32px;
    height:32px;
    font-size:18px;
  }
  .hiddenWord{
    font-size:clamp(30px,10vw,54px);
    min-height:72px;
    padding:12px;
  }
}

</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ことばをたたこう！</h1>
    <div class="pill" id="countLabel">1 / 10</div>
  </header>

  <section class="panel screen">
    <div class="topbar">
      <div class="progress" id="progress"></div>
      <button class="btn setting" id="shuffleBtn" type="button">まぜる</button>
    </div>

    <main class="mainarea">
      <div class="questionBox">
        <div class="hiddenWord" id="wordView"><span class="hintOff">ことばは まだ みえません</span></div>
        <div class="tapControlRow">
          <button class="tapButton" id="tapBtn" type="button">👏<br>たたく</button>

          <div class="tapResetSide">
            <button class="btn reset" id="resetTapBtn" type="button">やりなおす</button>

            <div style="display:flex;gap:6px;align-items:center;justify-content:center;">
              <button class="btn setting" id="tapCircleToggleBtn" type="button">〇表示</button>
              <button class="btn setting" id="soundModeBtn" type="button">クラップ音</button>
            </div>
          </div>
        </div>
        <div class="tapDisplay" id="tapDisplay"></div>
        <div class="message" id="message"></div>
        <div class="moraCircleArea" id="moraCircleArea">
          <div class="moraCircleLayout">
            <div class="moraLevelBtns">
              <button class="miniBtn" id="moraLevel1Btn" type="button">レベル1：ぴったり</button>
              <button class="miniBtn gray" id="moraLevel2Btn" type="button">レベル2：まぜる</button>
              <button class="miniBtn" style="background:#e91e63;" id="resetCircleBtn" type="button">やりなおす</button>
            </div>

            <div class="moraCircleMain">
              <div class="slotRow" id="slotRow"></div>
              <div class="paletteRow" id="paletteRow"></div>
            </div>
          </div>
        </div>

      </div>
    </main>

    <div class="buttons">
      <button class="btn listen" id="listenBtn" type="button">▶ きく</button>
      <button class="btn hint" id="hintBtn" type="button">ヒント</button>
      <button class="btn look" id="moraCircleBtn" type="button">おとのまる</button>
      <button class="btn look" id="answerBtn" type="button">こたえ</button>
      <button class="btn done" id="doneBtn" type="button">できた</button>
      
    </div>
  </section>

  <details class="panel">
    <summary>単語の設定・種類の選択</summary>
    <div class="settingsGrid">
      <div>
        <strong>出題する種類</strong>
        <div class="checkArea" id="typeChecks"></div>
      </div>
      <div>
        <strong>単語データ</strong>
        <p class="small">種類の見出しを書き、その下に単語を並べます。スペース・改行・全角スペースで区切れます。<br>例：<br>清音<br>すいか　さかな<br>撥音<br>ひんと　にんじん<br>分類は見出しで指定し、モーラ区切りは自動で作ります。</p>
        <textarea id="dataText"></textarea>
        <div class="rowBtns">
          <button class="miniBtn" id="applyDataBtn" type="button">このデータで使う</button>
          <button class="miniBtn gray" id="restoreInitialBtn" type="button">最初のデータにもどす</button>
          <button class="miniBtn gray" id="downloadCsvBtn" type="button">テキストを保存</button>
          <input id="fileInput" type="file" accept=".txt,.csv,text/plain,text/csv" hidden>
          <button class="miniBtn gray" id="loadCsvBtn" type="button">テキストを読み込む</button>
        </div>
      </div>
      <div class="results" id="results"></div>
    </div>
  </details>
</div>

<script>
// ============================================================
// 単語を差し替える場合は、まずここだけ編集しても使えます。
// 形式：word = 表示・読み上げる単語 / mora = /区切り / type = 種類
// ============================================================
const DEFAULT_WORDS = [
  { word:'すいか', mora:'す/い/か', type:'清音' },
  { word:'さかな', mora:'さ/か/な', type:'清音' },
  { word:'しろくま', mora:'し/ろ/く/ま', type:'清音' },

  { word:'ちょっかい', mora:'ちょ/っ/か/い', type:'拗促音' },
  { word:'しょっぱい', mora:'しょ/っ/ぱ/い', type:'拗促音' },
  { word:'ちょっかく', mora:'ちょ/っ/か/く', type:'拗促音' },
  { word:'しゅっぱつ', mora:'しゅ/っ/ぱ/つ', type:'拗促音' },
  { word:'しょっき', mora:'しょ/っ/き', type:'拗促音' }

const TYPE_ORDER = ['清音','撥音','長音','促音','拗音','拗長音','拗促音'];
const INITIAL_TEXT_DATA = wordsToText(DEFAULT_WORDS);

let allWords = loadWordsFromStorage() || DEFAULT_WORDS.slice();
let activeTypes = new Set(loadTypesFromStorage() || TYPE_ORDER);
let deck = [];
let index = 0;
let taps = 0;
let isCorrect = false;
let seen = false;
let hinting = false;
let hintActiveIndex = -1;
let hintTimers = [];
let hintRunId = 0;
let history = [];
let moraCircleMode = false;
let placedPieces = [];
let draggedPieceType = null;
let draggedPieceSourceIndex = null;
let circleLevel = Number(localStorage.getItem('moraCircleLevel') || '1');
let retryTargets = { tap:false, circle:false };
let selectedPaletteType = null;
let selectedPlacedIndex = null;
let useBeepSound = false;
let showTapCircles = localStorage.getItem('moraShowTapCircles') !== 'false';

const els = {
  countLabel: document.getElementById('countLabel'),
  progress: document.getElementById('progress'),
  wordView: document.getElementById('wordView'),
  tapBtn: document.getElementById('tapBtn'),
  tapDisplay: document.getElementById('tapDisplay'),
  message: document.getElementById('message'),
  listenBtn: document.getElementById('listenBtn'),
  hintBtn: document.getElementById('hintBtn'),
  answerBtn: document.getElementById('answerBtn'),
  moraCircleBtn: document.getElementById('moraCircleBtn'),
  moraCircleArea: document.getElementById('moraCircleArea'),
  slotRow: document.getElementById('slotRow'),
  paletteRow: document.getElementById('paletteRow'),
  moraLevel1Btn: document.getElementById('moraLevel1Btn'),
  moraLevel2Btn: document.getElementById('moraLevel2Btn'),
  resetTapBtn: document.getElementById('resetTapBtn'),
  resetCircleBtn: document.getElementById('resetCircleBtn'),
  tapCircleToggleBtn: document.getElementById('tapCircleToggleBtn'),
  soundModeBtn: document.getElementById('soundModeBtn'),
  doneBtn: document.getElementById('doneBtn'),
  shuffleBtn: document.getElementById('shuffleBtn'),
  typeChecks: document.getElementById('typeChecks'),
  dataText: document.getElementById('dataText'),
  applyDataBtn: document.getElementById('applyDataBtn'),
  restoreInitialBtn: document.getElementById('restoreInitialBtn'),
  downloadCsvBtn: document.getElementById('downloadCsvBtn'),
  loadCsvBtn: document.getElementById('loadCsvBtn'),
  fileInput: document.getElementById('fileInput'),
  results: document.getElementById('results')
};

init();

function init(){
  renderTypeChecks();
  els.dataText.value = wordsToText(allWords);
  makeDeck(false);
  bindEvents();
  render();
}

function bindEvents(){
  els.listenBtn.addEventListener('click', () => speak(current().word));
  els.hintBtn.addEventListener('click', playMoraHint);
  els.answerBtn.addEventListener('click', playMoraAnswer);
  els.moraCircleBtn.addEventListener('click', openMoraCircleMode);
  els.moraLevel1Btn.addEventListener('click', () => setMoraCircleLevel(1));
  els.moraLevel2Btn.addEventListener('click', () => setMoraCircleLevel(2));
  els.tapBtn.addEventListener('click', () => {
    taps++;
    isCorrect = false;
    els.tapBtn.classList.remove('bad');
    setMessage('', '');
    renderTaps();
    playTapSound();
  });
  els.resetTapBtn.addEventListener('click', resetTapOnly);
  els.resetCircleBtn.addEventListener('click', resetCircleOnly);
  els.tapCircleToggleBtn.addEventListener('click', toggleTapCircles);
  els.soundModeBtn.addEventListener('click', toggleSoundMode);
  els.doneBtn.addEventListener('click', judge);
  els.shuffleBtn.addEventListener('click', () => makeDeck(true));
  els.applyDataBtn.addEventListener('click', applyDataText);
  els.restoreInitialBtn.addEventListener('click', restoreInitialData);
  els.downloadCsvBtn.addEventListener('click', downloadCsv);
  els.loadCsvBtn.addEventListener('click', () => els.fileInput.click());
  els.fileInput.addEventListener('change', loadCsvFile);
}

function renderTypeChecks(){
  els.typeChecks.innerHTML = '';
  TYPE_ORDER.forEach(type => {
    const label = document.createElement('label');
    label.className = 'check';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = activeTypes.has(type);
    input.addEventListener('change', () => {
      if(input.checked) activeTypes.add(type); else activeTypes.delete(type);
      localStorage.setItem('moraTapTypes', JSON.stringify([...activeTypes]));
      makeDeck(false);
    });
    label.appendChild(input);
    label.append(' ' + type);
    els.typeChecks.appendChild(label);
  });
}

function makeDeck(shuffle){
  deck = allWords.filter(w => activeTypes.has(w.type));
  if(deck.length === 0) deck = allWords.slice();
  if(shuffle) deck = shuffled(deck);
  index = 0;
  history = [];
  resetCurrent(false);
  render();
}

function current(){ return deck[index] || {word:'',mora:'',type:''}; }

function render(){
  renderProgress();
  renderWord();
  renderTaps();
  renderTapCircleToggle();
  renderResults();
}

function renderProgress(){
  els.countLabel.textContent = deck.length ? `${index+1} / ${deck.length}` : '0 / 0';
  els.progress.innerHTML = '';
  deck.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'num' + (i === index ? ' active' : '');
    d.textContent = i + 1;
    els.progress.appendChild(d);
  });
}

function renderWord(){
  els.wordView.classList.toggle('answerSmall', hinting || seen || isCorrect);
  if(hinting){
    renderMoraHighlight(hintActiveIndex);
  }else if(seen || isCorrect){
    renderMoraHighlight(-1);
  }else{
    els.wordView.innerHTML = '<span class="hintOff">ことばは まだ みえません</span>';
  }
}

function renderMoraHighlight(activeIndex){
  const moras = current().mora.split('/').map(v => v.trim()).filter(Boolean);
  const wrap = document.createElement('div');
  wrap.className = 'moraWrap';

  moras.forEach((mora, i) => {
    const span = document.createElement('span');
    span.className = 'moraUnit' + (i === activeIndex ? ' active' : '');
    span.textContent = mora;
    wrap.appendChild(span);

    if(i < moras.length - 1){
      const sep = document.createElement('span');
      sep.className = 'moraSep';
      sep.textContent = '・';
      wrap.appendChild(sep);
    }
  });

  els.wordView.innerHTML = '';
  els.wordView.appendChild(wrap);
}

function renderTaps(){
  els.tapDisplay.innerHTML = '';
  els.tapDisplay.classList.toggle('hiddenTaps', !showTapCircles);
  const moras = current().mora.split('/').map(v => v.trim()).filter(Boolean);
  for(let i=0;i<taps;i++){
    const mora = moras[i] || '';
    const type = mora ? getMoraType(mora) : 'normal';
    els.tapDisplay.appendChild(createPiece(type, {draggable:false}));
  }
}

function renderTapCircleToggle(){
  if(!els.tapCircleToggleBtn) return;
  els.tapCircleToggleBtn.textContent = '〇表示';
}

function toggleTapCircles(){
  showTapCircles = !showTapCircles;
  localStorage.setItem('moraShowTapCircles', String(showTapCircles));
  renderTaps();
  renderTapCircleToggle();
}

function resetCurrent(clearMsg=true){
  clearHintTimers();
  if(els.tapDisplay) els.tapDisplay.classList.remove('bad');
  if(els.moraCircleArea){
    els.moraCircleArea.style.display = 'none';
    moraCircleMode = false;
    placedPieces = [];
  }
  taps = 0;
  els.tapBtn.classList.remove('bad');
  isCorrect = false;
  seen = false;
  if(clearMsg) setMessage('', '');
  renderWord();
  renderTaps();
}

function resetTapChallenge(){
  clearHintTimers();
  taps = 0;
  els.tapBtn.classList.remove('bad');
  isCorrect = false;
  seen = false;
  setMessage('', '');
  renderWord();
  renderTaps();
}

function getCircleAnswerOk(){
  if(!moraCircleMode) return true;

  const moras = current().mora.split('/').filter(Boolean);
  const expected = moras.map(getMoraType);

  if(circleLevel === 2){
    if(placedPieces.length !== expected.length) return false;
    return expected.every((type, idx) => placedPieces[idx] === type);
  }

  return expected.every((type, idx) => placedPieces[idx] === type);
}


function resetTapOnly(){
  clearHintTimers();
  if(els.tapDisplay) els.tapDisplay.classList.remove('bad');
  taps = 0;
  renderTaps();
  retryTargets.tap = false;
  isCorrect = false;
  setMessage('', '');
}

function resetCircleOnly(){
  clearHintTimers();

  if(moraCircleMode){
    placedPieces = [];

    if(circleLevel === 2){
      renderLongSlotPieces();
      const longSlot = els.slotRow.querySelector('.moraLongSlot');
      if(longSlot) longSlot.classList.remove('bad');
    }else{
      Array.from(els.slotRow.children).forEach(slot => {
        slot.innerHTML = '';
        slot.classList.remove('bad');
      });
    }
  }

  clearPieceSelection();
  selectedPaletteType = null;
  selectedPlacedIndex = null;
  retryTargets.circle = false;
  isCorrect = false;
  setMessage('', '');
}


function retryWrongParts(){
  clearHintTimers();
  if(els.tapDisplay) els.tapDisplay.classList.remove('bad');

  taps = 0;
  renderTaps();

  if(moraCircleMode){
    if(circleLevel === 2){
      placedPieces = [];
      if(typeof renderLevel2Pieces === 'function'){
        renderLevel2Pieces();
      }else{
        buildMoraCircleUI();
      }
    }else{
      placedPieces = [];
      Array.from(els.slotRow.children).forEach(slot => {
        slot.innerHTML = '';
        slot.classList.remove('bad');
      });
    }
  }

  retryTargets = { tap:false, circle:false };
  clearPieceSelection();
  selectedPaletteType = null;
  selectedPlacedIndex = null;
  isCorrect = false;
  setMessage('', '');
}

function judge(){
  const correctCount = current().mora.split('/').filter(Boolean).length;
  const tapOk = taps === correctCount;
  const circleOk = getCircleAnswerOk();

  history.push({
    word:current().word,
    mora:current().mora,
    type:current().type,
    taps,
    correctCount,
    ok: tapOk && circleOk
  });

  if(tapOk && circleOk){
    retryTargets = { tap:false, circle:false };
    isCorrect = true;
    seen = true;
    setMessage('せいかい！', 'ok');
    speak('せいかい');
    renderWord();
    renderResults();

    setTimeout(() => {
      next();
    }, 3000);
    return;
  }

  retryTargets = { tap: !tapOk, circle: !circleOk };
  if(!tapOk && els.tapDisplay){
    els.tapDisplay.classList.remove('bad');
    void els.tapDisplay.offsetWidth;
    els.tapDisplay.classList.add('bad');
  }
  if(!circleOk){
    if(circleLevel === 2){
      const longSlot = els.slotRow.querySelector('.moraLongSlot');
      if(longSlot){
        longSlot.classList.remove('bad');
        void longSlot.offsetWidth;
        longSlot.classList.add('bad');
      }
    }else{
      Array.from(els.slotRow.children).forEach(slot => {
        slot.classList.remove('bad');
        void slot.offsetWidth;
        slot.classList.add('bad');
      });
    }
  }
  isCorrect = false;
  setMessage('もういちど', 'ng');
  speak('もういちど');
  renderWord();
  renderResults();
}

function next(){
  if(!isCorrect){
    setMessage('せいかいしたら つぎへ いけます', 'ng');
    speak('もういちど');
    return;
  }
  if(index < deck.length - 1){
    index++;
  }else{
    index = 0;
  }
  resetCurrent(false);
  setMessage('', '');
  render();
}

function setMessage(text, cls){
  els.message.textContent = text;
  els.message.className = 'message ' + (cls || '');
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 1.02;
  u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

function speakWithoutCancel(text, rate=0.82){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = rate;
  u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

const HINT_AFTER_SPEECH_PAUSE_MS = 170;
const HINT_SOKUON_MS = 560;
const HINT_FALLBACK_MS = 900;
const ANSWER_STEP_MS = 700;
const ANSWER_END_PAUSE_MS = 320;
const ANSWER_LONGTONE_AFTER_PAUSE_MS = 430;

function playMoraHint(){
  const moras = current().mora.split('/').map(v => v.trim()).filter(Boolean);
  if(!moras.length) return;

  clearHintTimers();
  const runId = ++hintRunId;

  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  setMessage('ヒントを きいて みてね', 'ok');

  // ヒントでは文字・ハイライトを出さない。
  // 画面は現在の状態のままにして、音声と手拍子だけを出す。
  hinting = false;
  hintActiveIndex = -1;
  renderWord();

  playHintStep(moras, 0, runId);
}

function playHintStep(moras, i, runId){
  if(runId !== hintRunId) return;

  if(i >= moras.length){
    hintTimers.push(setTimeout(() => {
      if(runId !== hintRunId) return;
      setMessage('', '');
    }, 260));
    return;
  }

  const mora = moras[i];

  // 促音は読ませると端末差が大きいので、ヒントでは拍だけ出す。
  if(mora === 'っ' || mora === 'ッ'){
    playTapSound();
    hintTimers.push(setTimeout(() => playHintStep(moras, i + 1, runId), HINT_SOKUON_MS));
    return;
  }

  if(!('speechSynthesis' in window)){
    playTapSound();
    hintTimers.push(setTimeout(() => playHintStep(moras, i + 1, runId), HINT_SOKUON_MS));
    return;
  }

  let started = false;
  let finished = false;

  const u = new SpeechSynthesisUtterance(mora);
  u.lang = 'ja-JP';
  u.rate = 0.92;
  u.pitch = 1.05;

  const clapOnStart = () => {
    if(started || runId !== hintRunId) return;
    started = true;
    playTapSound();
  };

  const goNext = () => {
    if(finished || runId !== hintRunId) return;
    finished = true;
    clapOnStart();
    const nextDelay = (mora === 'ー') ? ANSWER_LONGTONE_AFTER_PAUSE_MS : HINT_AFTER_SPEECH_PAUSE_MS;
    hintTimers.push(setTimeout(() => playHintStep(moras, i + 1, runId), nextDelay));
  };

  u.onstart = clapOnStart;
  u.onend = goNext;
  u.onerror = goNext;
  window.speechSynthesis.speak(u);

  // 古い端末で onstart / onend が返らない場合の保険。
  hintTimers.push(setTimeout(clapOnStart, 180));
  hintTimers.push(setTimeout(goNext, HINT_FALLBACK_MS));
}

function playMoraAnswer(){
  const moras = current().mora.split('/').map(v => v.trim()).filter(Boolean);
  if(!moras.length) return;

  clearHintTimers();
  const runId = ++hintRunId;

  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  setMessage('こたえを みてね', 'ok');
  seen = true;
  hinting = true;
  hintActiveIndex = -1;
  renderWord();

  playAnswerStep(moras, 0, runId);
}

function playAnswerStep(moras, i, runId){
  if(runId !== hintRunId) return;

  if(i >= moras.length){
    hintTimers.push(setTimeout(() => {
      if(runId !== hintRunId) return;
      hinting = false;
      hintActiveIndex = -1;
      renderWord();
      setMessage('', '');
    }, ANSWER_END_PAUSE_MS));
    return;
  }

  const mora = moras[i];

  const showAndClap = () => {
    if(runId !== hintRunId) return;
    hinting = true;
    hintActiveIndex = i;
    renderWord();
    playTapSound();
  };

  // 促音は端末によって読み上げが不安定なので、文字・ハイライト・手拍子だけを出す。
  if(mora === 'っ' || mora === 'ッ'){
    showAndClap();
    hintTimers.push(setTimeout(() => playAnswerStep(moras, i + 1, runId), HINT_SOKUON_MS));
    return;
  }

  if(!('speechSynthesis' in window)){
    showAndClap();
    hintTimers.push(setTimeout(() => playAnswerStep(moras, i + 1, runId), HINT_SOKUON_MS));
    return;
  }

  let started = false;
  let finished = false;

  const u = new SpeechSynthesisUtterance(mora);
  u.lang = 'ja-JP';
  u.rate = 0.92;
  u.pitch = 1.05;

  const startStep = () => {
    if(started || runId !== hintRunId) return;
    started = true;
    showAndClap();
  };

  const goNext = () => {
    if(finished || runId !== hintRunId) return;
    finished = true;
    startStep();
    const nextDelay = (mora === 'ー') ? ANSWER_LONGTONE_AFTER_PAUSE_MS : HINT_AFTER_SPEECH_PAUSE_MS;
    hintTimers.push(setTimeout(() => playAnswerStep(moras, i + 1, runId), nextDelay));
  };

  u.onstart = startStep;
  u.onend = goNext;
  u.onerror = goNext;
  window.speechSynthesis.speak(u);

  // 古い端末で onstart / onend が返らない場合の保険。
  hintTimers.push(setTimeout(startStep, 180));
  hintTimers.push(setTimeout(goNext, HINT_FALLBACK_MS));
}

function clearHintTimers(){
  hintTimers.forEach(id => clearTimeout(id));
  hintTimers = [];
  hintRunId++;
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  hinting = false;
  hintActiveIndex = -1;
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function unlockAudio(){
  if(audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
}

document.addEventListener('touchstart', unlockAudio, {passive:true});
document.addEventListener('click', unlockAudio);


function toggleSoundMode(){
  useBeepSound = !useBeepSound;
  if(els.soundModeBtn){
    els.soundModeBtn.textContent = useBeepSound ? 'Beep音' : 'クラップ音';
  }
}


function playTapSound(){
  try{
    unlockAudio();
    const ac = audioCtx;
    const now = ac.currentTime;

    if(useBeepSound){
      const osc = ac.createOscillator();
      const gain = ac.createGain();

      osc.type = 'sine';
      osc.frequency.value = 880;

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.12, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);

      osc.connect(gain);
      gain.connect(ac.destination);

      osc.start(now);
      osc.stop(now + 0.1);
      return;
    }

    function burst(start, duration, volume){
      const buffer = ac.createBuffer(1, Math.floor(ac.sampleRate * duration), ac.sampleRate);
      const data = buffer.getChannelData(0);

      for(let i = 0; i < data.length; i++){
        const t = i / data.length;
        const attack = Math.min(1, t * 18);
        const decay = Math.pow(1 - t, 3.2);
        data[i] = (Math.random() * 2 - 1) * attack * decay;
      }

      const noise = ac.createBufferSource();
      noise.buffer = buffer;

      const high = ac.createBiquadFilter();
      high.type = 'highpass';
      high.frequency.value = 850;

      const mid = ac.createBiquadFilter();
      mid.type = 'bandpass';
      mid.frequency.value = 2100;
      mid.Q.value = 0.9;

      const gain = ac.createGain();
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

      noise.connect(high);
      high.connect(mid);
      mid.connect(gain);
      gain.connect(ac.destination);

      noise.start(start);
      noise.stop(start + duration);
    }

    // 「パン」と聞こえやすいように、短いノイズを2回重ねる
    burst(now, 0.075, 1.0);
    burst(now + 0.022, 0.065, 0.55);
  }catch(e){}
}


function getMoraType(mora){
  if(mora === 'っ' || mora === 'ッ') return 'sokuon';
  const smallKana = ['ゃ','ゅ','ょ','ャ','ュ','ョ'];
  if([...mora].some(c => smallKana.includes(c))) return 'youon';
  return 'normal';
}

function openMoraCircleMode(){
  moraCircleMode = true;
  els.moraCircleArea.style.display = 'block';
  buildMoraCircleUI();
}

function setMoraCircleLevel(level){
  circleLevel = level;
  localStorage.setItem('moraCircleLevel', String(circleLevel));
  if(moraCircleMode){
    buildMoraCircleUI();
  }
}

function renderMoraLevelButtons(){
  if(!els.moraLevel1Btn || !els.moraLevel2Btn) return;
  els.moraLevel1Btn.classList.toggle('activeLevel', circleLevel === 1);
  els.moraLevel2Btn.classList.toggle('activeLevel', circleLevel === 2);
  els.moraLevel1Btn.classList.toggle('gray', circleLevel !== 1);
  els.moraLevel2Btn.classList.toggle('gray', circleLevel !== 2);
}

function buildMoraCircleUI(){
  renderMoraLevelButtons();
  const moras = current().mora.split('/').filter(Boolean);

  placedPieces = (circleLevel === 2) ? [] : new Array(moras.length).fill(null);

  els.slotRow.innerHTML = '';
  els.slotRow.classList.toggle('level2Long', circleLevel === 2);

  if(circleLevel === 2){
    const longSlot = document.createElement('div');
    longSlot.className = 'moraLongSlot';

    longSlot.addEventListener('dragover', e => e.preventDefault());

    longSlot.addEventListener('drop', e => {
      e.preventDefault();
      const type = e.dataTransfer.getData('text/plain');
      const sourceIndexText = e.dataTransfer.getData('source-index');

      if(sourceIndexText !== ''){
        const from = Number(sourceIndexText);
        if(Number.isInteger(from) && from >= 0 && from < placedPieces.length){
          const target = getLongSlotDropIndex(longSlot, e.clientX);
          const moved = placedPieces.splice(from, 1)[0];
          const insertAt = Math.max(0, Math.min(target, placedPieces.length));
          placedPieces.splice(insertAt, 0, moved);
          renderLongSlotPieces();
          draggedPieceType = null;
          draggedPieceSourceIndex = null;
          return;
        }
      }

      placeNextPiece(type);
    });

    longSlot.addEventListener('click', e => {
      if(selectedPaletteType){
        const target = getLongSlotDropIndex(longSlot, e.clientX);
        placeNextPieceAt(selectedPaletteType, target);
      }
    });

    els.slotRow.appendChild(longSlot);
  }else{
    moras.forEach((_, idx) => {
      const slot = document.createElement('div');
      slot.className = 'moraSlot';
      slot.dataset.index = idx;

      slot.addEventListener('dragover', e => e.preventDefault());

      slot.addEventListener('drop', e => {
        e.preventDefault();
        const type = e.dataTransfer.getData('text/plain');
        placePiece(idx, type);
      });

      slot.addEventListener('click', () => {
        if(selectedPaletteType){
          placePiece(idx, selectedPaletteType);
        }
      });

      els.slotRow.appendChild(slot);
    });
  }

  const palette = moras.map(m => getMoraType(m));

  if(circleLevel === 2){
    palette.push('normal','youon','sokuon');
  }

  els.paletteRow.innerHTML = '';
  els.paletteRow.addEventListener('dragover', e => e.preventDefault());
  els.paletteRow.ondrop = e => {
    e.preventDefault();
    if(draggedPieceSourceIndex !== null){
      clearPlacedPiece(draggedPieceSourceIndex);
    }
    draggedPieceType = null;
    draggedPieceSourceIndex = null;
  };

  shuffled(palette).forEach(type => {
    const piece = createPiece(type);
    els.paletteRow.appendChild(piece);
  });
}


function clearPieceSelection(){
  document.querySelectorAll('.moraPiece.selectedPiece').forEach(el => {
    el.classList.remove('selectedPiece');
  });
}

function selectPiece(type, sourceIndex, element){
  clearPieceSelection();

  selectedPaletteType = type;
  selectedPlacedIndex = sourceIndex;

  if(element){
    element.classList.add('selectedPiece');
  }
}

function createPiece(type, options={}){
  const wrap = document.createElement('div');
  wrap.className = 'moraPiece';
  wrap.dataset.type = type;

  if(type === 'sokuon'){
    const small = document.createElement('div');
    small.className = 'circle-small';
    wrap.appendChild(small);
  }else{
    const main = document.createElement('div');
    main.className = 'circle-main';
    wrap.appendChild(main);

    if(type === 'youon'){
      const dot = document.createElement('div');
      dot.className = 'youon-dot';
      wrap.appendChild(dot);
    }
  }

  if(options.draggable !== false){
    wrap.draggable = false;
    wrap.addEventListener('click', () => {
      if(Number.isInteger(options.sourceIndex)){
        clearPlacedPiece(options.sourceIndex);
        clearPieceSelection();
        selectedPaletteType = null;
        selectedPlacedIndex = null;
        return;
      }

      selectPiece(type, null, wrap);
    });
}

  return wrap;
}

function getLongSlotDropIndex(longSlot, clientX){
  const pieces = Array.from(longSlot.querySelectorAll('.moraPiece'));
  for(let i = 0; i < pieces.length; i++){
    const rect = pieces[i].getBoundingClientRect();
    if(clientX < rect.left + rect.width / 2){
      return i;
    }
  }
  return pieces.length;
}


function placeNextPieceAt(type, targetIndex){
  if(!type) return;

  if(selectedPlacedIndex !== null){
    const moved = placedPieces.splice(selectedPlacedIndex, 1)[0];
    const insertAt = Math.max(0, Math.min(targetIndex, placedPieces.length));
    placedPieces.splice(insertAt, 0, moved);
  }else{
    const insertAt = Math.max(0, Math.min(targetIndex, placedPieces.length));
    placedPieces.splice(insertAt, 0, type);
  }

  renderLongSlotPieces();
  clearPieceSelection();
  selectedPaletteType = null;
  selectedPlacedIndex = null;
}


function placeNextPiece(type){
  if(!type) return;
  placedPieces.push(type);
  renderLongSlotPieces();
}

function renderLongSlotPieces(){
  const longSlot = els.slotRow.querySelector('.moraLongSlot');
  if(!longSlot) return;

  longSlot.innerHTML = '';
  longSlot.classList.remove('bad');
  placedPieces.forEach((type, idx) => {
    if(type){
      longSlot.appendChild(createPiece(type, {sourceIndex:idx}));
    }
  });
}

function placePiece(index, type){
  if(!type) return;

  const sourceIndex = draggedPieceSourceIndex;
  const oldType = placedPieces[index];
  placedPieces[index] = type;

  if(sourceIndex !== null && sourceIndex !== index){
    placedPieces[sourceIndex] = oldType || null;
  }

  rebuildLevel1Slots();
  draggedPieceType = null;
  draggedPieceSourceIndex = null;
}

function rebuildLevel1Slots(){
  if(circleLevel === 2) return;
  Array.from(els.slotRow.children).forEach((slot, idx) => {
    slot.innerHTML = '';
    slot.classList.remove('bad');
    const type = placedPieces[idx];
    if(type){
      slot.appendChild(createPiece(type, {sourceIndex:idx}));
    }
  });
}

function clearPlacedPiece(index){
  if(circleLevel === 2){
    placedPieces.splice(index, 1);
    renderLongSlotPieces();
    return;
  }

  placedPieces[index] = null;
  const slot = els.slotRow.children[index];
  if(slot){
    slot.innerHTML = '';
    slot.classList.remove('bad');
  }
}


function wordsToText(words){
  const grouped = {};
  TYPE_ORDER.forEach(type => grouped[type] = []);
  words.forEach(w => {
    if(!grouped[w.type]) grouped[w.type] = [];
    grouped[w.type].push(w.word);
  });
  return Object.keys(grouped)
    .filter(type => grouped[type].length)
    .map(type => `${type}\n${grouped[type].join('　')}`)
    .join('\n\n');
}

function autoMora(word){
  const chars = Array.from(String(word).trim());
  const smallKana = 'ゃゅょぁぃぅぇぉャュョァィゥェォ';
  const moras = [];
  chars.forEach(ch => {
    if(smallKana.includes(ch) && moras.length){
      moras[moras.length - 1] += ch;
    }else{
      moras.push(ch);
    }
  });
  return moras.join('/');
}

function splitWords(line){
  return line
    .replace(/[、，]/g, ' ')
    .split(/[\s　]+/)
    .map(v => v.trim())
    .filter(Boolean);
}

function parseText(text){
  const lines = text.split(/\r?\n/).map(line => line.trim()).filter(line => line && !line.startsWith('#'));

  // 以前のCSV形式も読み込めるように残しておく。
  if(lines.some(line => line.includes(',') && line.split(',').length >= 3)){
    return lines.map(line => {
        const cols = line.split(',').map(v => v.trim());
        const word = cols[0] || '';
        return { word, mora: cols[1] || autoMora(word), type: cols[2] || '清音' };
      })
      .filter(w => w.word && w.mora);
  }

  const parsed = [];
  let currentType = '';
  lines.forEach(line => {
    const normalized = line.replace(/\s/g, '');
    if(TYPE_ORDER.includes(normalized)){
      currentType = normalized;
      return;
    }
    if(!currentType) return;
    splitWords(line).forEach(word => {
      parsed.push({ word, mora:autoMora(word), type:currentType });
    });
  });
  return parsed;
}

function applyDataText(){
  const parsed = parseText(els.dataText.value);
  if(parsed.length === 0){
    alert('単語データがありません。');
    return;
  }
  allWords = parsed;
  localStorage.setItem('moraTapWords', JSON.stringify(allWords));
  makeDeck(false);
}

function restoreInitialData(){
  allWords = DEFAULT_WORDS.slice();
  els.dataText.value = INITIAL_TEXT_DATA;
  localStorage.setItem('moraTapWords', JSON.stringify(allWords));
  makeDeck(false);
  setMessage('最初のデータにもどしました', 'ok');
}

function downloadCsv(){
  const blob = new Blob(['﻿' + wordsToText(allWords)], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mora_words.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

function loadCsvFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    els.dataText.value = String(reader.result || '');
    applyDataText();
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
}

function renderResults(){
  const recent = history.slice(-8).reverse();
  if(recent.length === 0){
    els.results.innerHTML = '<strong>結果</strong><p class="small">まだ結果はありません。</p>';
    return;
  }
  els.results.innerHTML = '<strong>結果</strong><table><thead><tr><th>ことば</th><th>タップ</th><th>正解</th><th>判定</th></tr></thead><tbody>' +
    recent.map(r => `<tr><td>${escapeHtml(r.word)}</td><td>${r.taps}</td><td>${r.correctCount}</td><td>${r.ok ? '○' : '×'}</td></tr>`).join('') +
    '</tbody></table>';
}

function loadWordsFromStorage(){
  try{
    const data = JSON.parse(localStorage.getItem('moraTapWords'));
    return Array.isArray(data) && data.length ? data : null;
  }catch(e){ return null; }
}

function loadTypesFromStorage(){
  try{
    const data = JSON.parse(localStorage.getItem('moraTapTypes'));
    return Array.isArray(data) && data.length ? data : null;
  }catch(e){ return null; }
}

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
