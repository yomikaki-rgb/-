<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東方茨歌仙クイズ！</title>
    <!-- Google BudouX（分かち書きライブラリ） -->
    <script src="https://unpkg.com/budoux/bundle/budoux-ja.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #17111f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background:
                radial-gradient(circle at 78% 18%, rgba(255, 221, 156, .42) 0 6%, transparent 17%),
                linear-gradient(180deg, #382440 0%, #795064 43%, #d9a68e 72%, #432d46 100%);
        }

        .container {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 680px;
            background: linear-gradient(160deg, rgba(43, 25, 52, 0.95), rgba(74, 37, 53, 0.92));
            border: 4px solid #e896a8;
            box-shadow: 0 0 26px rgba(255, 183, 190, .75), inset 0 0 20px rgba(255, 225, 190, .18);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(8px);
            text-align: center;
            margin: 20px 0;
        }

        .theme-title {
            margin: -5px 0 14px;
            color: #fff2d8;
            font-size: clamp(1.55rem, 6vw, 2.25rem);
            letter-spacing: .08em;
            text-shadow: 0 2px 0 #8e344e, 0 0 15px rgba(255, 213, 180, .7);
        }

        .theme-subtitle {
            display: block;
            margin-top: 2px;
            color: #f3b4bf;
            font-size: .72rem;
            letter-spacing: .22em;
        }

        /* ヘッダー・ナビ */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px dashed #f5c781;
        }

        .badge {
            background: #f5c781;
            color: #402334;
            font-weight: 900;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 1rem;
        }

        .score-display {
            font-size: 1.1rem;
            color: #ffe2a8;
            font-weight: 800;
        }

        .mode-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .nav-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e9a2ad;
            background: rgba(233, 162, 173, 0.1);
            color: #ffd4d9;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            border-radius: 12px;
            cursor: pointer;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #d66a82, #9b476c);
            color: #fff9ed;
            box-shadow: 0 0 12px #e99aaa;
        }

        /* 問題エリア */
        .question-box {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .question-title {
            font-size: 1.3rem;
            line-height: 1.8;
            font-weight: 800;
            color: #ffffff;
            text-align: left;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        budoux-ja {
            display: inline-block;
        }

        .sound-btn {
            background: #ffe600;
            border: none;
            color: #0b0d1b;
            font-size: 0.95rem;
            font-weight: 900;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 3px 0 #b3a200;
        }

        .sound-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* 選択肢 */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-btn {
            flex: 1;
            background: linear-gradient(135deg, #7d3e62, #a94f69);
            border: 3px solid #f0b4b9;
            color: white;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 14px 16px;
            border-radius: 16px;
            cursor: pointer;
            text-align: left;
            line-height: 1.6;
        }

        .option-sound-btn {
            background: #ffe600;
            border: none;
            color: #0b0d1b;
            font-size: 1.1rem;
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 3px 0 #b3a200;
            flex-shrink: 0;
        }

        .option-sound-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .option-btn.correct {
            background: linear-gradient(135deg, #11998e, #38ef7d) !important;
            border-color: #00ff66 !important;
        }

        .option-btn.wrong {
            background: linear-gradient(135deg, #cb2d3e, #ef473a) !important;
            border-color: #ff3366 !important;
            opacity: 0.7;
        }

        /* 解説 */
        .explanation-card {
            display: none;
            background: rgba(255, 230, 0, 0.15);
            border: 2px solid #ffe600;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: left;
        }

        .explanation-title {
            font-size: 1.1rem;
            color: #ffe600;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .explanation-text {
            font-size: 1rem;
            line-height: 1.7;
            color: #f0f0f0;
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #d65b75, #7d3c68);
            border: none;
            color: white;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            padding: 12px;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 0 15px #e58094;
        }

        /* フォーム */
        .form-group {
            text-align: left;
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 800;
            color: #00f0ff;
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #00f0ff;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 0.95rem;
            outline: none;
        }

        /* CSV関連ボタンエリア */
        .csv-box {
            background: rgba(0, 240, 255, 0.08);
            border: 1px dashed #00f0ff;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: left;
        }

        .csv-box-title {
            font-size: 0.9rem;
            font-weight: 800;
            color: #00f0ff;
            margin-bottom: 8px;
        }

        .csv-btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-csv {
            flex: 1;
            padding: 8px;
            font-size: 0.85rem;
            border-radius: 8px;
            border: none;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-weight: 800;
            cursor: pointer;
            background: #00f0ff;
            color: #0b0d1b;
        }

        /* クイズ編集・削除リスト */
        .quiz-manage-list {
            margin-top: 20px;
            text-align: left;
            border-top: 2px dashed #00f0ff;
            padding-top: 15px;
        }

        .quiz-manage-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .quiz-manage-title {
            font-size: 0.9rem;
            font-weight: 800;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            border: none;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-edit { background: #ffe600; color: #0b0d1b; }
        .btn-delete { background: #ff3366; color: white; }

        /* 結果画面 */
        .result-screen {
            display: none;
        }

        .result-title {
            font-size: 1.8rem;
            color: #ffe600;
            margin-bottom: 10px;
        }

        .result-score {
            font-size: 2.5rem;
            font-weight: 900;
            color: #00f0ff;
            margin-bottom: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="container">
        <h1 class="theme-title">東方茨歌仙クイズ<span class="theme-subtitle">仙界の修行に挑戦！</span></h1>
        <!-- ナビゲーション -->
        <div class="mode-nav">
            <button class="nav-btn active" id="nav-play-btn" onclick="switchMode('play')">🎮 クイズであそぶ</button>
            <button class="nav-btn" id="nav-create-btn" onclick="switchMode('create')">✏️ クイズの作成・編集</button>
        </div>

        <!-- 1. クイズプレイ画面 -->
        <div id="play-screen">
            <div class="quiz-header">
                <span class="badge" id="question-number">第 1 問</span>
                <span class="score-display" id="score-display">スコア: 0 点</span>
            </div>

            <div class="question-box">
                <div class="question-title" id="question-text"></div>
                <button class="sound-btn" onclick="readCurrentQuestion()">🔊 もんだいをよむ</button>
            </div>

            <div class="options-grid" id="options-container"></div>

            <div class="explanation-card" id="explanation-card">
                <div class="explanation-title">💡 解説</div>
                <div class="explanation-text" id="explanation-text"></div>
                <button class="sound-btn" onclick="readExplanation()" style="margin-top:10px;">🔊 かいせつをよむ</button>
            </div>

            <button class="action-btn" id="next-btn" style="display:none;">つぎの問題へ 🌸</button>
        </div>

        <!-- 2. クイズ作成・編集画面 -->
        <div id="create-screen" style="display: none;">
            <!-- CSV保存・読み込みエリア -->
            <div class="csv-box">
                <div class="csv-box-title">📁 CSVファイルの出し入れ</div>
                <div class="csv-btn-group">
                    <button class="btn-csv" onclick="exportToCSV()">📥 CSVでダウンロード</button>
                    <button class="btn-csv" onclick="document.getElementById('csv-file-input').click()">📤 CSVから読み込む</button>
                    <input type="file" id="csv-file-input" accept=".csv" style="display:none;" onchange="importFromCSV(event)">
                </div>
            </div>

            <input type="hidden" id="edit-index" value="-1">
            
            <div class="form-group">
                <label>① もんだい文</label>
                <input type="text" id="input-q" class="form-control" placeholder="例：華扇がよく訪れる場所は？">
            </div>

            <div class="form-group">
                <label>② せんたくし（3つ）</label>
                <input type="text" id="input-opt0" class="form-control" placeholder="選択肢 1" style="margin-bottom: 4px;">
                <input type="text" id="input-opt1" class="form-control" placeholder="選択肢 2" style="margin-bottom: 4px;">
                <input type="text" id="input-opt2" class="form-control" placeholder="選択肢 3">
            </div>

            <div class="form-group">
                <label>③ せいかい</label>
                <select id="input-ans" class="form-control">
                    <option value="0">選択肢 1</option>
                    <option value="1">選択肢 2</option>
                    <option value="2">選択肢 3</option>
                </select>
            </div>

            <div class="form-group">
                <label>④ かいせつ</label>
                <textarea id="input-exp" class="form-control" rows="2" placeholder="例：華扇は博麗神社によく顔を出すよ！"></textarea>
            </div>

            <div class="btn-group">
                <button class="action-btn" id="save-btn" onclick="saveCustomQuiz()">保存してあそぶ！ 💾</button>
                <button class="action-btn" id="cancel-edit-btn" style="display:none; background:#777;" onclick="clearForm()">キャンセル</button>
            </div>

            <!-- クイズ管理リスト -->
            <div class="quiz-manage-list">
                <h4 style="color:#00f0ff; margin-bottom:10px;">📋 登録されているクイズ（編集・削除）</h4>
                <div id="quiz-list-container"></div>
            </div>
        </div>

        <!-- 3. 結果画面 -->
        <div class="result-screen" id="result-screen">
            <h1 class="result-title">修行完了！ 🌸</h1>
            <div class="result-score" id="final-score">0 点</div>
            <div id="result-rank" style="margin-bottom:15px; font-size:1.1rem; border: 2px solid #00f0ff; padding:10px; border-radius:12px;"></div>
            <div class="btn-group">
                <button class="action-btn" onclick="restartQuiz()">もう一度挑戦 🔄</button>
                <button class="action-btn" style="background: linear-gradient(135deg, #00f0ff, #0072ff);" onclick="resetToDefault()">初期化 🗑️</button>
            </div>
        </div>
    </div>

    <script>
        // BudouX（分かち書き）
        let parser;
        if (typeof BudouX !== 'undefined') {
            parser = BudouX.loadDefaultJapaneseParser();
        }

        function formatText(text) {
            if (!text) return "";
            if (parser) {
                return parser.translateHTMLString(text);
            }
            return text;
        }

        // 音声読み上げ関数
        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const div = document.createElement('div');
            div.innerHTML = text;
            const plainText = div.textContent || div.innerText || "";

            const uttr = new SpeechSynthesisUtterance(plainText);
            uttr.lang = 'ja-JP';
            uttr.rate = 0.85;
            uttr.pitch = 1.1;
            window.speechSynthesis.speak(uttr);
        }

        function readCurrentQuestion() {
            const currentQuiz = globalQuizData[currentQuestionIndex];
            speak(currentQuiz.question);
        }

        function readExplanation() {
            const currentQuiz = globalQuizData[currentQuestionIndex];
            speak(currentQuiz.explanation);
        }

        // 背景アニメーション
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const petals = Array.from({ length: 54 }, () => ({
            x: Math.random() * canvas.width, y: Math.random() * canvas.height,
            size: Math.random() * 6 + 3,
            color: ['#ffd2d9', '#f5a7b5', '#ffe7cc', '#e788a2'][Math.floor(Math.random() * 4)],
            speed: Math.random() * 0.55 + 0.18, drift: Math.random() * 0.6 - 0.3,
            angle: Math.random() * Math.PI * 2, spin: Math.random() * .035 - .017
        }));

        function drawMountains() {
            const h = canvas.height;
            const w = canvas.width;
            ctx.fillStyle = 'rgba(44, 34, 48, .72)';
            ctx.beginPath(); ctx.moveTo(0, h * .77); ctx.lineTo(w * .18, h * .48);
            ctx.lineTo(w * .34, h * .73); ctx.lineTo(w * .53, h * .39);
            ctx.lineTo(w * .73, h * .72); ctx.lineTo(w * .88, h * .52);
            ctx.lineTo(w, h * .69); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = 'rgba(252, 207, 168, .25)'; ctx.lineWidth = 2; ctx.stroke();
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawMountains();
            petals.forEach(petal => {
                petal.y += petal.speed; petal.x += petal.drift; petal.angle += petal.spin;
                if (petal.y > canvas.height + 12) { petal.y = -12; petal.x = Math.random() * canvas.width; }
                if (petal.x < -12) petal.x = canvas.width + 12;
                if (petal.x > canvas.width + 12) petal.x = -12;
                ctx.save(); ctx.translate(petal.x, petal.y); ctx.rotate(petal.angle);
                ctx.fillStyle = petal.color; ctx.globalAlpha = .78;
                ctx.beginPath(); ctx.ellipse(0, 0, petal.size, petal.size * .48, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            });
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // 初期問題データ
        const defaultQuizData = [
            {
                question: "『東方茨歌仙』の主人公はだれ？",
                options: ["① 博麗霊夢", "② 茨木華扇", "③ 霧雨魔理沙"],
                answer: 1,
                explanation: "正解は「茨木華扇」！『東方茨歌仙』のために生まれた、片腕の仙人だよ。"
            },
            {
                question: "茨木華扇が持っている能力はどれ？",
                options: ["① 動物を導く程度の能力", "② 時間を止める程度の能力", "③ 氷を操る程度の能力"],
                answer: 0,
                explanation: "正解は「動物を導く程度の能力」！華扇は、さまざまな動物たちを操ったり導いたりできるんだ。"
            },
            {
                question: "華扇がよく顔を出して、霊夢にお説教をする場所はどこ？",
                options: ["① 紅魔館", "② 永遠亭", "③ 博麗神社"],
                answer: 2,
                explanation: "正解は「博麗神社」！生真面目な華扇は、だらだらしている霊夢を正しい方向へ導こうとするよ。"
            }
        ];

        let globalQuizData = [];
        let currentQuestionIndex = 0;
        let score = 0;

        function loadQuizData() {
            try {
                const saved = localStorage.getItem('myIbarakasenQuiz_v1');
                if (saved) {
                    globalQuizData = JSON.parse(saved);
                } else {
                    globalQuizData = JSON.parse(JSON.stringify(defaultQuizData));
                }
            } catch (e) {
                if (globalQuizData.length === 0) {
                    globalQuizData = JSON.parse(JSON.stringify(defaultQuizData));
                }
            }
        }

        function saveToStorage() {
            try {
                localStorage.setItem('myIbarakasenQuiz_v1', JSON.stringify(globalQuizData));
            } catch (e) {}
        }

        function switchMode(mode) {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById('play-screen').style.display = mode === 'play' ? 'block' : 'none';
            document.getElementById('create-screen').style.display = mode === 'create' ? 'block' : 'none';
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('nav-play-btn').className = `nav-btn ${mode === 'play' ? 'active' : ''}`;
            document.getElementById('nav-create-btn').className = `nav-btn ${mode === 'create' ? 'active' : ''}`;
            
            if (mode === 'play') {
                restartQuiz();
            } else if (mode === 'create') {
                renderQuizManageList();
            }
        }

        function loadQuestion() {
            if (!globalQuizData || globalQuizData.length === 0) {
                document.getElementById('question-text').textContent = "クイズがありません。「クイズの作成・編集」で作ってね！";
                document.getElementById('options-container').innerHTML = '';
                return;
            }

            const currentQuiz = globalQuizData[currentQuestionIndex];

            document.getElementById('question-number').textContent = `第 ${currentQuestionIndex + 1} / ${globalQuizData.length} 問`;
            document.getElementById('question-text').innerHTML = formatText(currentQuiz.question);
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            document.getElementById('explanation-card').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            currentQuiz.options.forEach((optText, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'option-item';

                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = formatText(optText);
                btn.onclick = () => selectOption(index);

                const soundBtn = document.createElement('button');
                soundBtn.className = 'option-sound-btn';
                soundBtn.innerHTML = '🔊';
                soundBtn.title = 'この選択肢を読み上げる';
                soundBtn.onclick = (e) => {
                    e.stopPropagation();
                    speak(optText);
                };

                itemDiv.appendChild(btn);
                itemDiv.appendChild(soundBtn);
                optionsContainer.appendChild(itemDiv);
            });
        }

        function selectOption(selectedIndex) {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            const currentQuiz = globalQuizData[currentQuestionIndex];
            const optionBtns = document.querySelectorAll('.option-btn');

            optionBtns.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentQuiz.answer) {
                optionBtns[selectedIndex].classList.add('correct');
                score += Math.round(100 / globalQuizData.length);
                document.getElementById('score-display').textContent = `スコア: ${score} 点`;
                speak("正解！ピンポン！");
            } else {
                optionBtns[selectedIndex].classList.add('wrong');
                optionBtns[currentQuiz.answer].classList.add('correct');
                speak("ざんねん！不正解！");
            }

            document.getElementById('explanation-text').innerHTML = formatText(currentQuiz.explanation);
            document.getElementById('explanation-card').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        document.getElementById('next-btn').addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < globalQuizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        });

        function showResults() {
            document.getElementById('play-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-score').textContent = `${score} 点`;
            const rank = score >= 80 ? "🌸 仙人級" : "🐾 見習い仙人";
            document.getElementById('result-rank').innerHTML = formatText(`ランク：${rank}`);
            speak(`修行完了！スコアは ${score} 点です！`);
        }

        function restartQuiz() {
            currentQuestionIndex = 0; score = 0;
            document.getElementById('score-display').textContent = `スコア: 0 点`;
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('play-screen').style.display = 'block';
            loadQuestion();
        }

        // 保存・編集・削除機能
        function saveCustomQuiz() {
            const editIdx = parseInt(document.getElementById('edit-index').value);
            const q = document.getElementById('input-q').value.trim();
            const opt0 = document.getElementById('input-opt0').value.trim();
            const opt1 = document.getElementById('input-opt1').value.trim();
            const opt2 = document.getElementById('input-opt2').value.trim();
            const ans = parseInt(document.getElementById('input-ans').value);
            const exp = document.getElementById('input-exp').value.trim();

            if (!q || !opt0 || !opt1 || !opt2) {
                alert("「問題」と「3つの選択肢」をすべて入力してください！");
                return;
            }

            const quizObj = {
                question: q,
                options: [opt0, opt1, opt2],
                answer: ans,
                explanation: exp || "解説はありません。"
            };

            if (editIdx >= 0) {
                globalQuizData[editIdx] = quizObj;
                alert("クイズを修正しました！");
            } else {
                globalQuizData.push(quizObj);
                alert("新しい茨歌仙クイズを追加したよ！");
            }

            saveToStorage();
            clearForm();
            switchMode('play');
        }

        function editQuiz(index) {
            const quiz = globalQuizData[index];
            document.getElementById('edit-index').value = index;
            document.getElementById('input-q').value = quiz.question;
            document.getElementById('input-opt0').value = quiz.options[0];
            document.getElementById('input-opt1').value = quiz.options[1];
            document.getElementById('input-opt2').value = quiz.options[2];
            document.getElementById('input-ans').value = quiz.answer;
            document.getElementById('input-exp').value = quiz.explanation;

            document.getElementById('save-btn').textContent = "修正して保存 💾";
            document.getElementById('cancel-edit-btn').style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteQuiz(index) {
            if (confirm("このクイズを削除しますか？")) {
                globalQuizData.splice(index, 1);
                saveToStorage();
                renderQuizManageList();
            }
        }

        function clearForm() {
            document.getElementById('edit-index').value = "-1";
            document.getElementById('input-q').value = '';
            document.getElementById('input-opt0').value = '';
            document.getElementById('input-opt1').value = '';
            document.getElementById('input-opt2').value = '';
            document.getElementById('input-exp').value = '';

            document.getElementById('save-btn').textContent = "保存してあそぶ！ 💾";
            document.getElementById('cancel-edit-btn').style.display = "none";
        }

        function renderQuizManageList() {
            const container = document.getElementById('quiz-list-container');
            container.innerHTML = '';

            if (globalQuizData.length === 0) {
                container.innerHTML = '<div style="font-size:0.85rem; color:#aaa;">登録されているクイズはありません。</div>';
                return;
            }

            globalQuizData.forEach((quiz, idx) => {
                const item = document.createElement('div');
                item.className = 'quiz-manage-item';
                item.innerHTML = `
                    <div class="quiz-manage-title">第${idx + 1}問: ${quiz.question}</div>
                    <div>
                        <button class="btn-sm btn-edit" onclick="editQuiz(${idx})">編集</button>
                        <button class="btn-sm btn-delete" onclick="deleteQuiz(${idx})">削除</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function resetToDefault() {
            if (confirm("作成したクイズをすべて削除して最初に戻しますか？")) {
                try {
                    localStorage.removeItem('myIbarakasenQuiz_v1');
                } catch (e) {}
                globalQuizData = JSON.parse(JSON.stringify(defaultQuizData));
                restartQuiz();
            }
        }

        // --- CSVの書き出し（ダウンロード） ---
        function exportToCSV() {
            if (globalQuizData.length === 0) {
                alert("書き出すクイズがありません。");
                return;
            }

            // CSVヘッダー
            let csvContent = "\uFEFF問題文,選択肢1,選択肢2,選択肢3,正解番号(1~3),解説\n";

            globalQuizData.forEach(q => {
                // セル内のカンマやダブルクォーテーションのエスケープ処理
                const escapeCSV = (text) => `"${text.replace(/"/g, '""')}"`;

                const row = [
                    escapeCSV(q.question),
                    escapeCSV(q.options[0]),
                    escapeCSV(q.options[1]),
                    escapeCSV(q.options[2]),
                    q.answer + 1, // 画面表示上は 1~3
                    escapeCSV(q.explanation)
                ].join(",");

                csvContent += row + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "ibarakasen_quiz_data.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- CSVの読み込み（インポート） ---
        function importFromCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r\n|\n/);
                const newQuizzes = [];

                // 2行目（インデックス1）からデータ処理
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    // 簡易CSVパース（ダブルクォーテーション対応）
                    const matches = line.match(/(?:"([^"]*)"|([^,]+))/g);
                    if (matches) {
                        const cols = matches.map(c => c.replace(/^"|"$/g, '').replace(/""/g, '"').trim());
                        if (cols.length >= 5) {
                            const ansNum = parseInt(cols[4]) - 1; // 1~3 を 0~2 に変換
                            newQuizzes.push({
                                question: cols[0],
                                options: [cols[1], cols[2], cols[3]],
                                answer: (ansNum >= 0 && ansNum <= 2) ? ansNum : 0,
                                explanation: cols[5] || "解説はありません。"
                            });
                        }
                    }
                }

                if (newQuizzes.length > 0) {
                    globalQuizData = newQuizzes;
                    saveToStorage();
                    alert(`${newQuizzes.length}件のクイズを読み込みました！`);
                    renderQuizManageList();
                    switchMode('play');
                } else {
                    alert("正しい形式のCSVデータが見つかりませんでした。");
                }

                // 入力リセット
                event.target.value = '';
            };
            reader.readAsText(file, "UTF-8");
        }

        // 起動処理
        loadQuizData();
        loadQuestion();
    </script>
</body>
</html>
