:root{--little:#23bea8;--ring:#ef653f;--middle:#438bc9;--index:#f5b82f;--ink:#262731;--paper:#f5f2eb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,"Yu Gothic",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #087b6d;outline-offset:3px}header{background:white;border-bottom:1px solid #ddd8ce;padding:18px 24px}header>div{max-width:1240px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:22px;margin:0}header small{display:block;color:#6b6b74;font-size:12px;margin-top:3px}main{max-width:1240px;margin:24px auto;padding:0 20px}.courses{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.courses button,.secondary{background:white;border:1px solid #d7d4ca;border-radius:12px;padding:10px 16px;color:var(--ink)}.courses button.selected{background:#e3f7f2;border-color:#087b6d;box-shadow:0 0 0 1px #087b6d}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px}.stats{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:12px}.progress{height:7px;background:#e2ded4;border-radius:9px;overflow:hidden;margin-bottom:16px}.progress div{height:100%;background:var(--little);transition:width .2s}.practice{background:white;border:1px solid #dedad0;border-radius:22px;text-align:center;padding:24px;min-height:270px;box-shadow:0 8px 24px #20202708}.practice.bad{animation:shake .15s;box-shadow:0 0 0 3px #ef653f88}.word{font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:.1em;margin:16px 0 10px;overflow-wrap:anywhere}.romaji{font:700 28px ui-monospace,monospace;letter-spacing:.12em;min-height:42px;overflow-wrap:anywhere}.done{color:#087b6d}.remaining{color:#9899a0}.next{background:var(--active,#23bea8);color:#17232b;border-radius:5px;padding:2px 4px}.status{color:#626370;min-height:24px;margin-top:12px;font-size:14px}.primary{background:#272831;color:white;border:0;border-radius:12px;padding:13px 25px;font-weight:700}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0 4px}.keyboard{background:#202127;border:5px solid #34353c;border-radius:24px;margin-top:18px;overflow:hidden;box-shadow:inset 0 2px #67676b,0 8px 22px #0002}.keyboard svg{display:block;width:100%;height:auto;touch-action:manipulation}.key>rect:first-child{stroke:#ffffff28;stroke-width:2;filter:drop-shadow(0 4px 0 #0007)}.key text{pointer-events:none;fill:#fff;font-weight:700;font-size:22px}.key.index text{fill:#332709}.key.dark text{font-size:15px}.key{cursor:pointer}.key.target>rect:first-child{stroke:#fff;stroke-width:5;filter:drop-shadow(0 0 7px var(--active))}.key.pressed{opacity:.6}.hands{pointer-events:none}.finger{stroke-linecap:round;stroke-linejoin:round}.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:12px;margin:14px 0}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px}.settings{background:#fff;border:1px solid #dedad0;border-radius:20px;padding:20px;height:fit-content}.settings h2{margin:0 0 12px;font-size:17px}.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid #eee;font-size:14px;cursor:pointer}.toggle input{accent-color:#087b6d;width:20px;height:20px}.hint{font-size:12px;color:#61616a;line-height:1.8}.palette{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.palette label{font-size:12px;display:flex;align-items:center;gap:7px}.palette input{width:30px;height:30px;padding:0;border:0;background:transparent;cursor:pointer}details{margin-top:16px}summary{cursor:pointer;font-size:14px;font-weight:700}.custom{background:#fff;border:1px solid #dedad0;border-radius:16px;padding:18px;margin-bottom:18px}.custom textarea{display:block;width:100%;height:95px;border:1px solid #bbb;border-radius:8px;padding:10px;margin:8px 0}.custom <body>
<header><div><div><h1><img class="app-icon" id="appIcon" width="36" height="36" alt=""> いろどりタイピング 宿題版</h1></div><div class="actions"><button class="secondary" id="hwHome">宿題コードへ</button><button class="secondary" id="restart">やり直す</button><button class="secondary" id="openSettings">設定</button></div></div></header>
<main id="homeworkView"><section class="settings hw-student"><h2><label for="hwCode">宿題コード</label></h2><input id="hwCode" type="text" maxlength="12" inputmode="numeric" autocomplete="off" placeholder="数字４ケタ" aria-label="宿題コード"><button class="primary" id="hwLoad">宿題をはじめる</button><p class="hint">先生から伝えられたコードを入力してください。</p></section></main><div class="hw-status" id="hwStatus" role="status" aria-live="polite"></div><main id="practiceView">
<div class="layout"><section>
<div class="hw-status" id="hwSession" hidden></div><div class="stats"><span id="questionCount"></span><span id="scores">正解 0　ミス 0</span></div><div class="progress"><div id="progressBar"></div></div>
<div class="practice" id="practice"><div id="welcome"><h2 id="welcomeTitle"></h2><button class="primary" id="start">れんしゅうをスタート</button><p class="hint">Enter / Space でも開始できます。</p></div>
<div id="exercise" hidden><button class="secondary" id="replay">🔊 もういちど聞く</button><button class="secondary" id="revealQuestion" hidden>ことばを見る</button><button class="secondary" id="hwAnswer">答えを見る</button><button class="secondary" id="hwSkip">この問題をとばす</button><div class="word" id="word" title="タップして入力"></div><div class="romaji" id="romaji" title="タップして入力" tabindex="0" role="button" aria-label="ローマ字入力を開始"></div><div class="status" id="status" aria-live="polite"></div><input id="mobileInput" class="mobile" aria-label="問題のローマ字入力" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
<div id="complete" hidden><div id="finalInput" class="romaji" hidden aria-label="最後に入力した文字"></div><div class="word">🎉 練習完了！</div><div id="result"></div><div class="actions"><button class="primary hw-submit" id="hwSubmit" hidden>先生にていしゅつする</button><button class="secondary" id="hwVerify" hidden>提出を確認</button><button class="primary" id="hwNext" hidden>次のセットをはじめる</button><button class="secondary" id="hwReview" hidden>間違えた問題だけ復習</button><button class="secondary" id="hwRound" hidden>最初からもう一周</button><button class="primary" id="again">もう一度練習</button></div></div></div>
<div class="keyboard" id="keyboard"><svg id="board" viewBox="0 0 1080 430" aria-label="色分けキーボードと指の置き方" role="group"><rect x="1" y="12" width="1078" height="374" rx="25" fill="#202127" stroke="#45464c" stroke-width="3"/><g id="keys"></g><g id="hands" class="hands"></g></svg></div>

</section></div>
</main>
<main id="settingsView" hidden>
<div class="settings-head"><h2>設定</h2><button class="primary" id="closeSettings">練習画面に戻る</button></div>
<div class="settings-grid"><section class="settings registration-panel"><h2>先生用：宿題コードを作る</h2><div class="actions"><button class="secondary" id="hwSelectAll">すべて選ぶ</button><button class="secondary" id="hwClearAll">すべて外す</button></div><div class="row-choices" id="hwGroups"></div><label class="toggle">1セットの問題数<input id="hwDaily" type="number" min="1" max="50" step="1" value="5" style="width:90px"></label><label class="toggle">シャッフル<input id="hwShuffle" type="checkbox" checked></label><button class="primary" id="hwCreate">宿題コードを作る</button><div class="hw-code" id="hwCreatedCode" hidden></div><p id="hwTeacherStatus" role="status"></p><p class="hint">名前の入力はありません。同じコードを使うと進捗も共有されます。児童ごとにコードを作ってください。</p></section>
<section class="settings" id="normalLessonSettings" hidden><h2>練習の種類</h2><label class="toggle">練習<select id="practiceMode"><option value="words">単語</option><option value="kana">一文字</option><option value="home">ホームポジション</option></select></label><label class="toggle" id="questionOrderLabel">出題順<select id="questionOrder"><option value="ordered">順番どおり（あいうえお順）</option><option value="shuffle">シャッフル</option></select></label><label class="toggle" id="homeOrderLabel" hidden>F・Jの出題<select id="homeOrder"><option value="alternate">交互</option><option value="random">ランダム</option></select></label><div id="kanaLimits" hidden><label class="toggle">練習の長さ<select id="kanaLimit"><option value="all">選んだ文字を1周</option><option value="count">個数で決める</option><option value="time">時間で決める</option></select></label><label class="toggle" id="countOption" hidden>練習する個数<input id="kanaCount" type="number" min="1" max="1000" step="1" value="12" style="width:95px">個</label><label class="toggle" id="timeOption" hidden>練習時間<input id="kanaMinutes" type="number" min="0.5" max="60" step="0.5" value="1" style="width:95px">分</label></div><div id="rowSettings"><h3 id="rowTitle">練習する行</h3><div class="actions"><button class="secondary" id="selectAllRows">すべて選ぶ</button><button class="secondary" id="clearRows">すべて外す</button></div><div id="rowChoices" class="row-choices"></div><p id="selectionCount"></p></div></section>
<section class="settings"><h2>表示・音声</h2>
<label class="toggle">最初に読み上げ<input type="checkbox" id="autoSpeak" checked></label>


<label class="toggle">問題（ひらがな・単語）の表示<input type="checkbox" id="showQuestion" checked></label><label class="toggle">ローマ字表示<input type="checkbox" id="showRomaji"></label>
<label class="toggle">キーボード表示<input type="checkbox" id="showKeyboard" checked></label>
<label class="toggle">次のキーを光らせる<input type="checkbox" id="showNextKey" checked></label>
<label class="toggle">手・指の表示<input type="checkbox" id="showHands" checked></label>
<label class="toggle">打鍵音<input type="checkbox" id="keySound" checked></label><label class="toggle">打鍵音の音量<input id="keyVolume" type="range" min="0" max="100" step="5" value="65" aria-label="打鍵音の音量" style="width:100px"></label>
<label class="toggle">間違えたときの音<input type="checkbox" id="errorSound" checked></label>
<label class="toggle">入力完了の音<input type="checkbox" id="sound" checked></label>
<label class="toggle">ローマ字の種類<select id="romanStyle" aria-label="ローマ字の種類"><option value="hepburn">ヘボン式</option><option value="kunrei" selected>訓令式</option></select></label>
<details open><summary>色を変える</summary><div class="palette"><label>小指<input type="color" id="littleColor" value="#23bea8"></label><label>薬指<input type="color" id="ringColor" value="#ef653f"></label><label>中指<input type="color" id="middleColor" value="#438bc9"></label><label>人差し指<input type="color" id="indexColor" value="#f5b82f"></label></div><button class="secondary" id="resetColors">色を初期設定に戻す</button></details>
<details><summary>読み上げの設定</summary><p class="hint">日本語の音声がある端末で利用できます。</p><select id="voice" aria-label="読み上げ音声" style="width:100%"><option value="">日本語の音声を自動選択</option></select><label class="toggle">速さ<input id="rate" type="range" min="0.5" max="1.3" step="0.1" value="0.8" style="width:95px"></label></details>
<span id="speechNote" hidden></span>

<label class="toggle">英字の表示<select id="letterCase"><option value="upper">大文字</option><option value="lower">小文字</option></select></label>
<details id="emphasisSettings"><summary>母音・子音の強調表示</summary><label class="toggle">母音の強調<input type="checkbox" id="highlightVowels" checked></label><label class="toggle">子音の強調<input type="checkbox" id="highlightConsonants" checked></label><div class="actions" id="consonantActions"><button class="secondary" id="selectAllConsonants" type="button" aria-label="子音をすべて選ぶ">すべて選ぶ</button><button class="secondary" id="clearConsonants" type="button" aria-label="子音をすべて外す">すべて外す</button></div><div class="consonant-choices" id="consonantChoices"></div></details>
</section>
<section class="settings registration-panel"><h2>単語を登録</h2><div id="registrationRows"></div><div class="actions registration-actions"><button class="primary" id="applyWords">この単語で練習</button><button class="secondary" id="exportCSV">CSVを書きだす</button><button class="secondary" id="importCSV">CSVを読み込む</button></div><input type="file" id="csvFile" accept=".csv,text/csv" hidden><p id="customError" role="status"></p><p id="csvStatus" role="status"></p></section>
</div></main>
