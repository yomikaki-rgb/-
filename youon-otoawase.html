 "ひょ": "ひょう ひょうし ひょうじょう ひょうほん ひょうしき ひょうたん ひょっこり ひょいと とうひょう だいひょう",
 "ぴゃ": "ろっぴゃく はっぴゃく",
 "ぴゅ": "ぴゅうぴゅう ぴゅっと",
 "ぴょ": "はっぴょう はっぴょうかい ぴょんぴょん ぴょこん ぴょこぴょこ ぴょんと",
 "びゃ": "さんびゃく",
 "びゅ": "びゅうびゅう びゅーん",
 "びょ": "びょういん びょうき びょうしつ びょう びょうしん びょうどう がびょう",
 "みゃ": "みゃく みゃくはく",
 "みゅ": "みゅうつー",
 "みょ": "みょうじ みょうが",
 "りゃ": "しょうりゃく こうりゃく",
 "りゅ": "りゅう りゅうぐうじょう りゅうこう りゅうせい きょうりゅう",
 "りょ": "りょこう りょかん りょうり りょうて りょうあし りょうし りょうがえ きゅうりょう きょうりょく たいりょく"
};
const WORDS = Object.entries(GROUPS).flatMap(([targetSound, words]) => words.split(' ').filter(Boolean).map(word => ({word,targetSound,baseChar:targetSound[0],smallVowel:targetSound[1],position:word.indexOf(targetSound)===0?'start':'inside'})));
const SOUND_ORDER=["きゃ", "きゅ", "きょ", "ぎゃ", "ぎゅ", "ぎょ", "しゃ", "しゅ", "しょ", "じゃ", "じゅ", "じょ", "ちゃ", "ちゅ", "ちょ", "にゃ", "にゅ", "にょ", "ひゃ", "ひゅ", "ひょ", "ぴゃ", "ぴゅ", "ぴょ", "びゃ", "びゅ", "びょ", "みゃ", "みゅ", "みょ", "りゃ", "りゅ", "りょ"];
const soundRank=s=>{const i=SOUND_ORDER.indexOf(s);return i<0?SOUND_ORDER.length:i};
const SMALL = ['ゃ','ゅ','ょ'];
const BIG = ['や','ゆ','よ'];
const app=document.getElementById('app');
let level=3, mode='sound', session=null, speechToken=0, speechTimer=null, questionCount=10, randomOrder=false, randomCountMode='all', wordAndSound=false;
const STORAGE_KEY='youon-otoawase-settings-v1';
const wordKey=w=>w.word+'|'+w.targetSound;
let selected=new Set(WORDS.map(wordKey)), storageMessage='';
function validWord(w){return Boolean(w && typeof w.word==='string' && w.word.length<=40 && /^[ぁ-ゖー]+$/.test(w.word) && SOUND_ORDER.includes(w.targetSound) && w.word.includes(w.targetSound))}
function normalizedWord(word,targetSound){return {word,targetSound,baseChar:targetSound[0],smallVowel:targetSound[1],position:word.indexOf(targetSound)===0?'start':'inside',custom:true}}
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(saved){for(const w of Array.isArray(saved.custom)?saved.custom:[]){if(validWord(w)&&!WORDS.some(x=>wordKey(x)===wordKey(w)))WORDS.push(normalizedWord(w.word,w.targetSound))}selected=new Set(Array.isArray(saved.selected)?saved.selected.filter(k=>WORDS.some(w=>wordKey(w)===k)):WORDS.map(wordKey));if([1,2,3].includes(saved.level))level=saved.level;if(['base','small','sound'].includes(saved.mode))mode=saved.mode;if(Number.isInteger(saved.count)&&saved.count>=1&&saved.count<=100)questionCount=saved.count;randomOrder=saved.randomOrder===true;randomCountMode=['all','fixed'].includes(saved.randomCountMode)?saved.randomCountMode:'fixed';wordAndSound=saved.wordAndSound===true}}
catch{storageMessage='保存した設定を読み込めませんでした。この画面で設定し直せます。'}
function saveSettings(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({custom:WORDS.filter(w=>w.custom),selected:[...selected],level,mode,count:questionCount,randomOrder,randomCountMode,wordAndSound}));storageMessage=''}catch{storageMessage='このブラウザでは保存できません。追加したことばと設定は、この画面を閉じるまで使えます。'}const el=document.getElementById('storageMessage');if(el)el.textContent=storageMessage}
const questionSpeech=w=>wordAndSound?w.word+'。'+w.targetSound+'。':w.word;
const modeName=()=>({base:'まえの もじを えらぶ',small:'ちいさい もじを えらぶ',sound:'おとを えらぶ'}[mode]);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const audioIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4 5 9H2v6h3l6 5V4Z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>';
const audioButton=label=>`<button class="audio" data-action="listen">${audioIcon}${label||'ことばをきく'}</button>`;
function stopSpeech(){speechToken++;clearTimeout(speechTimer);if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function speak(text){
 stopSpeech();const token=speechToken;const status=document.getElementById('voiceStatus');
 if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){status.textContent='このブラウザでは音声を使えません。音声に対応したブラウザで開いてください。';return}
 const utter=new SpeechSynthesisUtterance(text);utter.lang='ja-JP';utter.rate=.82;utter.pitch=1;
 const voices=speechSynthesis.getVoices();const japanese=voices.filter(v=>/^ja(?:-|_)/i.test(v.lang));
 if(japanese.length)utter.voice=japanese.find(v=>v.localService)||japanese[0];
 status.textContent='';
 utter.onstart=()=>{if(token===speechToken){clearTimeout(speechTimer);status.textContent=''}};
 utter.onerror=e=>{if(token===speechToken&&!['canceled','interrupted'].includes(e.error)){clearTimeout(speechTimer);status.textContent='音声を再生できませんでした。「ことばをきく」を押してください。音が出ないときは、端末の音量と日本語音声の設定を確認してください。'}};
 utter.onend=()=>{if(token===speechToken)clearTimeout(speechTimer)};
 speechSynthesis.resume();speechSynthesis.speak(utter);
 speechTimer=setTimeout(()=>{if(token===speechToken)status.textContent='音がきこえないときは「ことばをきく」を押してね。端末の音量も確認してください。'},5000);
}
if('speechSynthesis' in window)speechSynthesis.getVoices();
function home(){stopSpeech();session=null;document.getElementById('voiceStatus').textContent='';app.innerHTML=`
 <section class="hero"><h1>ようおん おとあわせ</h1></section>
 <section class="panel"><h2 class="fieldtitle"><span>1</span>レベルを えらぼう</h2><div class="levels" role="group" aria-label="レベル">${[1,2,3].map(n=>`<button class="pick" data-level="${n}" aria-pressed="${level===n}"><strong>${['','はじめの おと','なか・おわり','ぜんぶ'][n]}</strong><small>${['','ことばの はじめ','ことばの なかや おわり','いろいろな ばしょ'][n]}</small></button>`).join('')}</div>
 <h2 class="fieldtitle"><span>2</span>れんしゅうを えらぼう</h2><div class="modes" role="group" aria-label="出題モード">${['base','small','sound'].map(m=>`<button class="pick" data-mode="${m}" aria-pressed="${mode===m}"><strong>${{base:'まえの もじを えらぶ',small:'ちいさい もじを えらぶ',sound:'おとを えらぶ'}[m]}</strong><small>${{base:'〇ゃく → き',small:'き〇く → や',sound:'〇<span class="small-circle">〇</span>く → きゃ'}[m]}</small></button>`).join('')}</div>
 <section class="settings"><h2 class="fieldtitle"><span>3</span>ことばと 問題数を えらぼう</h2><div class="toolbar"><button class="secondary" data-action="selectAll">すべて選ぶ</button><button class="secondary" data-action="selectNone">すべて外す</button><span id="selectedCount"></span></div><div id="wordList" class="wordlist"></div><label class="wordcheck"><input type="checkbox" id="randomOrder" ${randomOrder?"checked":""}>ランダム出題</label><div id="randomCount" ${randomOrder?'':'hidden'}>
 <fieldset class="voice-choice"><legend>ランダム出題の問題数</legend>
 <label><input type="radio" name="randomCountMode" value="all" ${randomCountMode==='all'?'checked':''}><span>選んだ問題すべて（<span id="randomAllCount"></span>問）を1回ずつ</span></label>
 <label><input type="radio" name="randomCountMode" value="fixed" ${randomCountMode==='fixed'?'checked':''}>問題数を指定する</label>
 </fieldset>
 <div id="fixedCount" ${randomCountMode==='fixed'?'':'hidden'}><div class="toolbar"><label for="questionCount">問題数（1〜100問）</label><input type="number" id="questionCount" min="1" max="100" step="1" value="${questionCount}" required><span>問</span></div>
 <p class="settings-note">選んだ問題を一巡するまで同じ問題は繰り返しません。指定した問題数が多いときは、順番を変えて繰り返します。</p></div></div><fieldset class="voice-choice"><legend>問題の読み上げ</legend><label><input type="radio" name="voiceMode" value="word" ${wordAndSound?'':'checked'}>ことばだけ</label><label><input type="radio" name="voiceMode" value="wordAndSound" ${wordAndSound?'checked':''}>ことば＋文字</label></fieldset></section>
 <details><summary>ことばを 登録する</summary><form id="registerForm" class="register"><label>ことば（ひらがな）<input type="text" id="newWord" maxlength="40" placeholder="例：おきゃくさん" required autocomplete="off"></label><label>練習するおと<select id="newSound" required><option value="">ことばを入力して選択</option></select></label><button class="secondary" type="submit">登録する</button></form><p id="registerMessage" class="form-message" role="status"></p><p class="settings-note">小さい「ゃ・ゅ・ょ」を含む音を選んで登録します。同じ音が複数あることばは、最初の音を出題します。登録したことばは自動で選択されます。登録語・選択・問題数は、このブラウザに保存します（別の端末やブラウザには引き継がれません）。</p></details>
 <p id="storageMessage" class="form-message" role="status">${escapeHTML(storageMessage)}</p><div class="startrow"><button class="primary" data-action="start"></button><p class="helper">はじめると ことばの おとが なります。</p></div></section>
 <details><summary>おうちの方・先生へ</summary><p>ことばは、練習用にひらがなで表示しています。「みゅうつー」は指定された固有名詞です。同じことばでも、練習する音が違えば別の問題です。同じ音が繰り返される場合は、最初の箇所を出題します。</p><p>「まえのもじ」「ちいさいもじ」は独立した問題です。1問につき1回の正解で答えを確認します。小さい文字の選択肢は通常の大きさの「や・ゆ・よ」で表示し、答えは小さい「ゃ・ゅ・ょ」で確認します。</p><p>まちがえたときは「？」を表示して、選択した読み上げ方で再生します。正解するまで何度でも選べます。正答数は、一度もまちがえずに答えた問題の数です。復習では、選択中のことばのうち間違えた音の問題をすべて1回ずつ出題します。ランダム出題では「選んだ問題すべてを1回ずつ」と「問題数を指定する」を選べます。復習にも同じ設定を使います。</p><p>日本語の音声は端末・ブラウザの読み上げを使用します。</p></details>`;renderWordList();window.scrollTo(0,0);}
function renderWordList(){const list=document.getElementById('wordList');const open=new Set([...list.querySelectorAll('details[open]')].map(d=>d.dataset.sound));const pool=poolFor(level);const sounds=[...new Set(pool.map(w=>w.targetSound))].sort((a,b)=>soundRank(a)-soundRank(b)||a.localeCompare(b,'ja'));list.innerHTML=sounds.map(sound=>{const words=pool.filter(w=>w.targetSound===sound);return `<details class="sound-group" data-sound="${escapeHTML(sound)}" ${open.has(sound)?'open':''}><summary>${escapeHTML(sound)}<small>${words.length}件</small></summary><div class="sound-words">${words.map(w=>`<label class="wordcheck"><input type="checkbox" data-word="${escapeHTML(wordKey(w))}" ${selected.has(wordKey(w))?'checked':''}><span>${escapeHTML(w.word)}${w.custom?'<small>登録したことば</small>':''}</span></label>`).join('')}</div></details>`}).join('');updateStart();}
function updateStart(){
 const count=poolFor(level).filter(w=>selected.has(wordKey(w))).length;
 document.getElementById('selectedCount').textContent=count+'問 選択中';
 document.getElementById('randomAllCount').textContent=count;
 document.getElementById('randomCount').hidden=!randomOrder;
 document.getElementById('fixedCount').hidden=randomCountMode!=='fixed';
 const input=document.getElementById('questionCount');
 const useFixedCount=randomOrder && randomCountMode==='fixed';
 input.disabled=!useFixedCount;
 const valid=!useFixedCount || input.checkValidity();
 const total=useFixedCount?input.value:count;
 const button=app.querySelector('[data-action="start"]');
 button.disabled=!count || !valid;
 button.textContent=!count?'ことばを 選んでね':valid?total+'もん はじめる →':'問題数を 1〜100で 指定してね';
}
function poolFor(l){return WORDS.filter(w=>l===3||(l===1?w.position==='start':w.position==='inside')).sort((a,b)=>soundRank(a.targetSound)-soundRank(b.targetSound)||a.targetSound.localeCompare(b.targetSound,'ja'))}
function makeSet(pool){if(!pool.length)return [];if(!randomOrder)return [...pool];if(randomCountMode==='all')return shuffle(pool);const out=[];while(out.length<questionCount){const batch=shuffle(pool);if(batch.length>1&&out.length&&wordKey(batch[0])===wordKey(out[out.length-1]))[batch[0],batch[1]]=[batch[1],batch[0]];out.push(...batch.slice(0,questionCount-out.length))}return out;}
function start(reviewSounds=null){const pool=poolFor(level).filter(w=>selected.has(wordKey(w))&&(!reviewSounds||reviewSounds.includes(w.targetSound)));if(!pool.length)return;
 session={questions:makeSet(pool),index:0,stage:mode,mistakes:0,results:[],reviewSounds,choices:[],phase:'question'};question();}
function current(){return session.questions[session.index]}
function progress(){return `<ol class="progress" aria-label="問題の進み具合">${Array.from({length:session.questions.length},(_,i)=>`<li class="${i===session.index?'current':i<session.results.length?(session.results[i].clean?'done':'reviewed'):''}" ${i===session.index?'aria-current="step"':''} aria-label="${i+1}問目${i<session.results.length?(session.results[i].clean?' 正解':' 復習') : ''}">${i+1}</li>`).join('')}</ol>`}
function shell(content){app.innerHTML=`${progress()}<section class="panel fade"><div class="gamehead"><span class="badge">${['','はじめの おと','なか・おわり','ぜんぶ'][level]} ${session.reviewSounds?'・ふくしゅう':''}</span><span>${modeName()}</span><button class="quiet" data-action="home">ホームへ</button></div>${content}</section>`;window.scrollTo(0,0);}
function question(){session.phase='question';session.stage=mode;session.mistakes=0;setChoices();drawQuestion();speak(questionSpeech(current()))}
function setChoices(){
 const w=current();
 if(session.stage==='small'){
  session.choices=shuffle(BIG);
  return;
 }
 if(session.stage==='sound'){
  session.choices=shuffle(SOUND_ORDER.filter(sound=>sound[0]===w.baseChar));
  return;
 }
 const alternatives=SOUND_ORDER.filter(sound=>sound[1]===w.smallVowel && sound[0]!==w.baseChar).map(sound=>sound[0]);
 session.choices=shuffle([w.baseChar,...shuffle(alternatives).slice(0,3)]);
}
function maskedWord(w,stage){const index=w.word.indexOf(w.targetSound)+(stage==='small'?1:0);const length=stage==='sound'?w.targetSound.length:1;const blank=stage==='sound'?'<span class="blank-char sound-blanks" aria-label="大きい丸と小さい丸">〇<span class="small-circle">〇</span></span>':'<span class="blank-char">〇</span>';return escapeHTML(w.word.slice(0,index))+blank+escapeHTML(w.word.slice(index+length))}
function drawQuestion(){const w=current(),stage=session.stage;
 const title=stage==='sound'?'〇に はいる おとは？':'〇に はいる もじは？';
 let hint=w.position==='start'?'ことばの はじめの おとを えらぼう。':'ことばの なか・おわりの おとを えらぼう。';
 shell(`<div class="question"><h2 id="questionTitle" tabindex="-1">${title}</h2><p class="position">${hint}</p>
 <div class="workarea"><div class="listenarea">${w.image?`<img class="wordimage" src="${escapeHTML(w.image)}" alt="ことばの絵">`:''}<div class="masked-word">${maskedWord(w,stage)}</div>${audioButton()}</div>
 <div class="choices ${mode==='sound'?'sound-choices':''} ${session.choices.length===5?'five':''}" role="group" aria-label="答えの選択肢">${session.choices.map(v=>`<button class="choice" data-answer="${v}" aria-label="${stage==='small'?'小さい':''}${v}">${v}</button>`).join('')}</div></div><p class="notice" id="feedback" role="status"></p></div>`);
 const img=app.querySelector('.wordimage');if(img)img.onerror=()=>img.hidden=true;
}
function answer(value){if(!session||session.phase!=='question')return;const w=current();const correct=session.stage==='base'?w.baseChar:session.stage==='small'?BIG[SMALL.indexOf(w.smallVowel)]:w.targetSound;
 if(value!==correct){session.mistakes++;const feedback=document.getElementById('feedback');feedback.classList.add('retry');feedback.textContent='？';feedback.setAttribute('aria-label','もういちど きいてみよう');speak(questionSpeech(w));return}
 reveal(false);
}
function reveal(assisted){const w=current();session.phase='answer';session.results.push({word:w.word,targetSound:w.targetSound,clean:session.mistakes===0,assisted});
 const index=w.word.indexOf(w.targetSound);const marked=escapeHTML(w.word.slice(0,index))+'<mark>'+escapeHTML(w.targetSound)+'</mark>'+escapeHTML(w.word.slice(index+w.targetSound.length));
 shell(`<div class="answer"><h2 tabindex="-1" id="answerTitle">${assisted?'いっしょに たしかめよう':session.mistakes?'できたね！':'せいかい！'}</h2><div class="formula"><span>${w.baseChar}</span><span>＋</span><span class="little">${w.smallVowel}</span><span class="arrow">→</span><span>${w.targetSound}</span></div><div class="arrow" aria-hidden="true">↓</div><div class="word">${marked}</div>${audioButton('もういちど きく')}<button class="primary" data-action="next">${session.index===session.questions.length-1?'けっかを みる':'たしかめた！ つぎへ →'}</button></div>`);document.getElementById('answerTitle').focus();speak(w.targetSound+'。'+w.word+'。');
}
function result(){stopSpeech();window.scrollTo(0,0);session.phase='result';document.getElementById('voiceStatus').textContent='';const clean=session.results.filter(r=>r.clean).length;const missed=[...new Set(session.results.filter(r=>!r.clean).map(r=>r.targetSound))];
 app.innerHTML=`<section class="result fade">${clean===session.questions.length?'':'<div class="hero"><h1>よく がんばったね！</h1></div>'}<div class="panel"><p>まちがえずに できた もんだい</p><div class="score">${clean}<small> / ${session.questions.length}もん</small></div>${missed.length?'<p>この おとを、もういちど れんしゅうしよう。</p>':' '}<div class="soundchips">${missed.map(s=>`<span class="chip">${s}</span>`).join('')}</div>${missed.length?'<button class="primary" data-action="review">この おとを ふくしゅう</button>':''}<div class="actions"><button class="secondary" data-action="again">もう一度</button><button class="secondary" data-action="home">ホームへ</button></div><p class="helper">「もう一度」は、いまのレベル・モード${session.reviewSounds?'・ふくしゅうする音':''}で${session.questions.length}もん。</p></div></section>`;
}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.level){level=Number(b.dataset.level);app.querySelectorAll('[data-level]').forEach(x=>x.setAttribute('aria-pressed',x===b));saveSettings();if(b.dataset.level)renderWordList();return}
 if(b.dataset.mode){mode=b.dataset.mode;app.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));saveSettings();return}
 if(b.dataset.answer){answer(b.dataset.answer);return}
 switch(b.dataset.action){case'selectAll':poolFor(level).forEach(w=>selected.add(wordKey(w)));saveSettings();renderWordList();break;case'selectNone':poolFor(level).forEach(w=>selected.delete(wordKey(w)));saveSettings();renderWordList();break;case'home':home();break;case'start':start();break;case'listen':if(session)speak(session.phase==='answer'?current().targetSound+'。'+current().word+'。':questionSpeech(current()));break;case'next':if(session?.phase!=='answer')return;session.index++;if(session.index===session.questions.length)result();else question();break;case'review':start([...new Set(session.results.filter(r=>!r.clean).map(r=>r.targetSound))]);break;case'again':start(session.reviewSounds);break}
});
app.addEventListener('change',e=>{if(e.target.name==='randomCountMode'){randomCountMode=e.target.value;saveSettings();updateStart();return}if(e.target.name==='voiceMode'){wordAndSound=e.target.value==='wordAndSound';saveSettings();return}if(e.target.id==='randomOrder'){randomOrder=e.target.checked;saveSettings();updateStart();return}if(e.target.matches('[data-word]')){if(e.target.checked)selected.add(e.target.dataset.word);else selected.delete(e.target.dataset.word);saveSettings();updateStart();}});
app.addEventListener('input',e=>{if(e.target.id==='questionCount'){if(e.target.checkValidity()){questionCount=Number(e.target.value);saveSettings()}updateStart()}if(e.target.id==='newWord'){const word=e.target.value.trim().normalize('NFKC');const sounds=[...new Set(word.match(/[きぎしじちにひびぴみり][ゃゅょ]/g)||[])].filter(s=>SOUND_ORDER.includes(s));document.getElementById('newSound').innerHTML=sounds.length?sounds.map(s=>`<option value="${escapeHTML(s)}">${escapeHTML(s)}</option>`).join(''):'<option value="">小さい「ゃ・ゅ・ょ」を含むことば</option>';}});
app.addEventListener('submit',e=>{if(e.target.id!=='registerForm')return;e.preventDefault();const word=document.getElementById('newWord').value.trim().normalize('NFKC');const targetSound=document.getElementById('newSound').value;const w=normalizedWord(word,targetSound);const message=document.getElementById('registerMessage');if(!validWord(w)){message.textContent='ひらがなのことばと、その中にある「ゃ・ゅ・ょ」を含む音を指定してください。';return}if(WORDS.some(x=>wordKey(x)===wordKey(w))){message.textContent='このことばとおとは、すでに登録されています。';return}WORDS.push(w);selected.add(wordKey(w));saveSettings();renderWordList();message.textContent=word+'（'+targetSound+'）を登録しました。'+(poolFor(level).includes(w)?'': '「'+(w.position==='start'?'はじめの おと':'なか・おわり')+'」または「ぜんぶ」で出題できます。');e.target.reset();document.getElementById('newSound').innerHTML='<option value="">ことばを入力して選択</option>';});
window.addEventListener('pagehide',stopSpeech);
home();
</script></body></html>
