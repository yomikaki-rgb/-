<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ことばをたたこう！</title>
<style>
  :root{
    --bg:#d9f6ff;
    --main:#179b49;
    --main2:#0d7f38;
    --accent:#0b75d1;
    --danger:#e91e63;
    --text:#222;
    --card:#fff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","UD デジタル 教科書体", "Noto Sans JP", system-ui, sans-serif;
    background:linear-gradient(180deg,#b6eff6 0%,#eafcff 100%);
    color:var(--text);
    min-height:100vh;
  }
  .app{
    max-width:980px;
    margin:0 auto;
    padding:18px 16px 28px;
  }
  header{
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  h1{
    margin:0;
    font-size:clamp(26px,4vw,42px);
    letter-spacing:.04em;
    color:#0a6c32;
    text-shadow:0 2px 0 #fff;
  }
  .pill{
    background:#fff;
    border:3px solid var(--main);
    border-radius:999px;
    padding:8px 14px;
    font-weight:700;
    box-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  .panel{
    background:rgba(255,255,255,.86);
    border:4px solid var(--main);
    border-radius:24px;
    padding:18px;
    box-shadow:0 8px 0 rgba(0,0,0,.13);
  }
  .screen{
    min-height:380px;
    display:grid;
    grid-template-rows:auto 1fr auto;
    gap:16px;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .progress{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    align-items:center;
  }
  .num{
    min-width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:#1fa742;
    color:white;
    font-size:22px;
    font-weight:800;
    border:3px solid #08752c;
    box-shadow:0 3px 0 rgba(0,0,0,.16);
  }
  .num.active{background:#7ef07f;color:#084d20}
  .mainarea{
    display:grid;
    place-items:center;
    text-align:center;
    padding:10px;
  }
  .questionBox{
    width:min(720px,100%);
    display:grid;
    gap:22px;
    justify-items:center;
  }
  .hiddenWord{
    min-height:92px;
    width:100%;
    display:grid;
    place-items:center;
    font-size:clamp(38px,8vw,74px);
    font-weight:800;
    letter-spacing:.08em;
    color:#111;
    background:#fff;
    border:4px dashed #81c784;
    border-radius:22px;
    padding:18px;
  }
  .hintOff{color:#9e9e9e;font-size:clamp(22px,4vw,36px);font-weight:700;}
  .tapDisplay{
    min-height:70px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .dot{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#1e88e5;
    border:3px solid #0d47a1;
    box-shadow:0 4px 0 rgba(0,0,0,.18);
  }
  .tapButton{
    width:min(360px,88vw);
    height:150px;
    border-radius:36px;
    border:5px solid #0d7f38;
    background:#fff;
    font-size:42px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 9px 0 rgba(0,0,0,.22);
    touch-action:manipulation;
  }
  .tapButton:active{transform:translateY(5px);box-shadow:0 4px 0 rgba(0,0,0,.22)}
  .message{
    min-height:42px;
    font-size:clamp(22px,4vw,34px);
    font-weight:900;
  }
  .message.ok{color:#0a8f35}
  .message.ng{color:#d81b60}
  .buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
  }
  button{
    font-family:inherit;
  }
  .btn{
    border:0;
    border-radius:999px;
    padding:14px 22px;
    font-size:clamp(19px,3vw,26px);
    font-weight:900;
    color:#fff;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.22);
    touch-action:manipulation;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
  .listen{background:#ff9800}
  .hint{background:#9c27b0}
  .look{background:#673ab7}
  .reset{background:#e91e63}
  .done{background:#0b75d1}
  .next{background:#1fa742}
  .setting{background:#607d8b}
  details{
    margin-top:18px;
  }
  summary{
    cursor:pointer;
    font-size:20px;
    font-weight:800;
    color:#0a6c32;
  }
  .settingsGrid{
    margin-top:12px;
    display:grid;
    gap:14px;
  }
  .checkArea{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
  }
  label.check{
    background:#fff;
    border:2px solid #89c68f;
    border-radius:999px;
    padding:8px 12px;
    font-weight:700;
  }
  textarea{
    width:100%;
    min-height:220px;
    font-family:ui-monospace,Consolas,monospace;
    font-size:15px;
    border:2px solid #8bc34a;
    border-radius:12px;
    padding:12px;
  }
  .small{
    font-size:14px;
    line-height:1.6;
    color:#444;
  }
  .rowBtns{display:flex;gap:10px;flex-wrap:wrap}
  .miniBtn{
    border:0;
    border-radius:12px;
    padding:10px 14px;
    font-weight:800;
    background:#0a8f35;
    color:#fff;
    cursor:pointer;
  }
  .miniBtn.gray{background:#607d8b}
  .results{
    margin-top:14px;
    background:#fff;
    border-radius:16px;
    padding:12px;
    border:2px solid #a5d6a7;
  }
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{border-bottom:1px solid #ddd;padding:7px;text-align:left}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ことばをたたこう！</h1>
    <div class="pill" id="countLabel">1 / 10</div>
  </header>

  <section class="panel screen">
    <div class="topbar">
      <div class="progress" id="progress"></div>
      <button class="btn setting" id="shuffleBtn" type="button">まぜる</button>
    </div>

    <main class="mainarea">
      <div class="questionBox">
        <div class="hiddenWord" id="wordView"><span class="hintOff">ことばは まだ みえません</span></div>
        <button class="tapButton" id="tapBtn" type="button">👏<br>たたく</button>
        <div class="tapDisplay" id="tapDisplay"></div>
        <div class="message" id="message"></div>
      </div>
    </main>

    <div class="buttons">
      <button class="btn listen" id="listenBtn" type="button">▶ きく</button>
      <button class="btn hint" id="hintBtn" type="button">ヒント</button>
      <button class="btn look" id="lookBtn" type="button">見る</button>
      <button class="btn reset" id="resetBtn" type="button">やりなおす</button>
      <button class="btn done" id="doneBtn" type="button">できた</button>
      
    </div>
  </section>

  <details class="panel">
    <summary>単語の設定・種類の選択</summary>
    <div class="settingsGrid">
      <div>
        <strong>出題する種類</strong>
        <div class="checkArea" id="typeChecks"></div>
      </div>
      <div>
        <strong>単語データ</strong>
        <p class="small">種類の見出しを書き、その下に単語を並べます。スペース・改行・全角スペースで区切れます。<br>例：<br>清音<br>すいか　さかな<br>撥音<br>ひんと　にんじん<br>分類は見出しで指定し、モーラ区切りは自動で作ります。</p>
        <textarea id="dataText"></textarea>
        <div class="rowBtns">
          <button class="miniBtn" id="applyDataBtn" type="button">このデータで使う</button>
          <button class="miniBtn gray" id="restoreInitialBtn" type="button">最初のデータにもどす</button>
          <button class="miniBtn gray" id="downloadCsvBtn" type="button">テキストを保存</button>
          <input id="fileInput" type="file" accept=".txt,.csv,text/plain,text/csv" hidden>
          <button class="miniBtn gray" id="loadCsvBtn" type="button">テキストを読み込む</button>
        </div>
      </div>
      <div class="results" id="results"></div>
    </div>
  </details>
</div>

<script>
// ============================================================
// 単語を差し替える場合は、まずここだけ編集しても使えます。
// 形式：word = 表示・読み上げる単語 / mora = /区切り / type = 種類
// ============================================================
const DEFAULT_WORDS = [

  { word:'うどん', mora:'う/ど/ん', type:'撥音' },
  { word:'りんご', mora:'り/ん/ご', type:'撥音' },
  { word:'みかん', mora:'み/か/ん', type:'撥音' },
  { word:'おかあさん', mora:'お/か/あ/さ/ん', type:'長音' },
  { word:'おとうさん', mora:'お/と/う/さ/ん', type:'長音' },

  { word:'せんせい', mora:'せ/ん/せ/い', type:'長音' },
  { word:'そうじき', mora:'そ/う/じ/き', type:'長音' },
  { word:'ゆうやけ', mora:'ゆ/う/や/け', type:'長音' },
  { word:'ろうそく', mora:'ろ/う/そ/く', type:'長音' },
  { word:'くうき', mora:'く/う/き', type:'長音' },
  { word:'こおり', mora:'こ/お/り', type:'長音' },
  { word:'せんせい', mora:'せ/ん/せ/い', type:'長音' },
  { word:'おねえさん', mora:'お/ね/え/さ/ん', type:'長音' },
  { word:'れいぞうこ', mora:'れ/い/ぞ/う/こ', type:'長音' },
  { word:'きって', mora:'き/っ/て', type:'促音' },
  { word:'コロッケ', mora:'コ/ロ/ッ/ケ', type:'促音' },
  { word:'スキップ', mora:'ス/キ/ッ/プ', type:'促音' },
  { word:'ロボット', mora:'ロ/ボ/ッ/ト', type:'促音' },
  { word:'えにっき', mora:'え/に/っ/き', type:'促音' },
  { word:'もっきん', mora:'も/っ/き/ん', type:'促音' },
  { word:'かっぱ', mora:'か/っ/ぱ', type:'促音' },
  { word:'せっけん', mora:'せ/っ/け/ん', type:'促音' },
  { word:'しっぽ', mora:'し/っ/ぽ', type:'促音' },
  { word:'ポケット', mora:'ポ/ケ/ッ/ト', type:'促音' },
  { word:'しっぷ', mora:'し/っ/ぷ', type:'促音' },
  { word:'コップ', mora:'コ/ッ/プ', type:'促音' },
  { word:'はっけん', mora:'は/っ/け/ん', type:'促音' },
  { word:'きっちん', mora:'き/っ/ち/ん', type:'促音' },
  { word:'キャベツ', mora:'キャ/ベ/ツ', type:'拗音' },
  { word:'しゃしん', mora:'しゃ/し/ん', type:'拗音' },
  { word:'パジャマ', mora:'パ/ジャ/マ', type:'拗音' },
  { word:'せんしゃ', mora:'せ/ん/しゃ', type:'拗音' },
  { word:'かいしゃ', mora:'か/い/しゃ', type:'拗音' },
  { word:'ちゃわん', mora:'ちゃ/わ/ん', type:'拗音' },
  { word:'おちゃ', mora:'お/ちゃ', type:'拗音' },
  { word:'じゃぐち', mora:'じゃ/ぐ/ち', type:'拗音' },
  { word:'じゃんけん', mora:'じゃ/ん/け/ん', type:'拗音' },
  { word:'にんじゃ', mora:'に/ん/じゃ', type:'拗音' },
  { word:'しゅくだい', mora:'しゅ/く/だ/い', type:'拗音' },
  { word:'ちょきん', mora:'ちょ/き/ん', type:'拗音' },
  { word:'きょじん', mora:'きょ/じ/ん', type:'拗音' },
  { word:'きかんしゃ', mora:'き/か/ん/しゃ', type:'拗音' },
  { word:'しょうゆ', mora:'しょ/う/ゆ', type:'拗長音' },
  { word:'きょうしつ', mora:'きょ/う/し/つ', type:'拗長音' },
  { word:'はくちょう', mora:'は/く/ちょ/う', type:'拗長音' },
  { word:'ぎゅうにゅう', mora:'ぎゅ/う/にゅ/う', type:'拗長音' },
  { word:'きゅうしょく', mora:'きゅ/う/しょ/く', type:'拗長音' },
  { word:'ちゅうしゃ', mora:'ちゅ/う/しゃ', type:'拗長音' },
  { word:'べんきょう', mora:'べ/ん/きょ/う', type:'拗長音' },
  { word:'うちゅう', mora:'う/ちゅ/う', type:'拗長音' },
  { word:'きゅうり', mora:'きゅ/う/り', type:'拗長音' },
  { word:'リュック', mora:'リュ/ッ/ク', type:'拗促音' },
  { word:'ケチャップ', mora:'ケ/チャ/ッ/プ', type:'拗促音' },
  { word:'キャップ', mora:'キャ/ッ/プ', type:'拗促音' },
  { word:'しゃっくり', mora:'しゃ/っ/く/り', type:'拗促音' },
  { word:'ちょっかい', mora:'ちょ/っ/か/い', type:'拗促音' },
  { word:'しょっぱい', mora:'しょ/っ/ぱ/い', type:'拗促音' },
  { word:'ちょっかく', mora:'ちょ/っ/か/く', type:'拗促音' },
  { word:'しゅっぱつ', mora:'しゅ/っ/ぱ/つ', type:'拗促音' },
  { word:'しょっき', mora:'しょ/っ/き', type:'拗促音' }
];

const TYPE_ORDER = ['清音','撥音','長音','促音','拗音','拗長音','拗促音'];
const INITIAL_TEXT_DATA = wordsToText(DEFAULT_WORDS);

let allWords = loadWordsFromStorage() || DEFAULT_WORDS.slice();
let activeTypes = new Set(loadTypesFromStorage() || TYPE_ORDER);
let deck = [];
let index = 0;
let taps = 0;
let isCorrect = false;
let seen = false;
let history = [];

const els = {
  countLabel: document.getElementById('countLabel'),
  progress: document.getElementById('progress'),
  wordView: document.getElementById('wordView'),
  tapBtn: document.getElementById('tapBtn'),
  tapDisplay: document.getElementById('tapDisplay'),
  message: document.getElementById('message'),
  listenBtn: document.getElementById('listenBtn'),
  hintBtn: document.getElementById('hintBtn'),
  lookBtn: document.getElementById('lookBtn'),
  resetBtn: document.getElementById('resetBtn'),
  doneBtn: document.getElementById('doneBtn'),
  shuffleBtn: document.getElementById('shuffleBtn'),
  typeChecks: document.getElementById('typeChecks'),
  dataText: document.getElementById('dataText'),
  applyDataBtn: document.getElementById('applyDataBtn'),
  restoreInitialBtn: document.getElementById('restoreInitialBtn'),
  downloadCsvBtn: document.getElementById('downloadCsvBtn'),
  loadCsvBtn: document.getElementById('loadCsvBtn'),
  fileInput: document.getElementById('fileInput'),
  results: document.getElementById('results')
};

init();

function init(){
  renderTypeChecks();
  els.dataText.value = wordsToText(allWords);
  makeDeck(false);
  bindEvents();
  render();
}

function bindEvents(){
  els.listenBtn.addEventListener('click', () => speak(current().word));
  els.hintBtn.addEventListener('click', playMoraHint);
  els.lookBtn.addEventListener('click', () => { seen = true; renderWord(); });
  els.tapBtn.addEventListener('click', () => { taps++; isCorrect = false; setMessage('', ''); renderTaps(); playTapSound(); });
  els.resetBtn.addEventListener('click', resetCurrent);
  els.doneBtn.addEventListener('click', judge);
  els.shuffleBtn.addEventListener('click', () => makeDeck(true));
  els.applyDataBtn.addEventListener('click', applyDataText);
  els.restoreInitialBtn.addEventListener('click', restoreInitialData);
  els.downloadCsvBtn.addEventListener('click', downloadCsv);
  els.loadCsvBtn.addEventListener('click', () => els.fileInput.click());
  els.fileInput.addEventListener('change', loadCsvFile);
}

function renderTypeChecks(){
  els.typeChecks.innerHTML = '';
  TYPE_ORDER.forEach(type => {
    const label = document.createElement('label');
    label.className = 'check';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = activeTypes.has(type);
    input.addEventListener('change', () => {
      if(input.checked) activeTypes.add(type); else activeTypes.delete(type);
      localStorage.setItem('moraTapTypes', JSON.stringify([...activeTypes]));
      makeDeck(false);
    });
    label.appendChild(input);
    label.append(' ' + type);
    els.typeChecks.appendChild(label);
  });
}

function makeDeck(shuffle){
  deck = allWords.filter(w => activeTypes.has(w.type));
  if(deck.length === 0) deck = allWords.slice();
  if(shuffle) deck = shuffled(deck);
  index = 0;
  history = [];
  resetCurrent(false);
  render();
}

function current(){ return deck[index] || {word:'',mora:'',type:''}; }

function render(){
  renderProgress();
  renderWord();
  renderTaps();
  renderResults();
}

function renderProgress(){
  els.countLabel.textContent = deck.length ? `${index+1} / ${deck.length}` : '0 / 0';
  els.progress.innerHTML = '';
  deck.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'num' + (i === index ? ' active' : '');
    d.textContent = i + 1;
    els.progress.appendChild(d);
  });
}

function renderWord(){
  if(seen || isCorrect){
    els.wordView.textContent = current().mora.replaceAll('/', '・');
  }else{
    els.wordView.innerHTML = '<span class="hintOff">ことばは まだ みえません</span>';
  }
}

function renderTaps(){
  els.tapDisplay.innerHTML = '';
  for(let i=0;i<taps;i++){
    const dot = document.createElement('div');
    dot.className = 'dot';
    els.tapDisplay.appendChild(dot);
  }
}

function resetCurrent(clearMsg=true){
  taps = 0;
  isCorrect = false;
  seen = false;
  if(clearMsg) setMessage('', '');
  renderWord();
  renderTaps();
}

function judge(){
  const correctCount = current().mora.split('/').filter(Boolean).length;
  const ok = taps === correctCount;
  history.push({word:current().word, mora:current().mora, type:current().type, taps, correctCount, ok});
  if(ok){
    isCorrect = true;
    seen = true;
    setMessage('せいかい！', 'ok');
    speak('せいかい');
    showMora = true;
    renderWord();
    renderResults();

    setTimeout(() => {
      next();
    }, 3000);
    return;
  }else{
    isCorrect = false;
    setMessage('もういちど', 'ng');
    speak('もういちど');
  }
  renderWord();
  renderResults();
}

function next(){
  if(!isCorrect){
    setMessage('せいかいしたら つぎへ いけます', 'ng');
    speak('もういちど');
    return;
  }
  if(index < deck.length - 1){
    index++;
  }else{
    index = 0;
  }
  resetCurrent(false);
  setMessage('', '');
  render();
}

function setMessage(text, cls){
  els.message.textContent = text;
  els.message.className = 'message ' + (cls || '');
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 1.02;
  u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

function speakWithoutCancel(text, rate=0.82){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = rate;
  u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

function speakMoraWithClaps(text, clapCount=1, rate=0.72){
  const clapInterval = 820;

  function playClaps(){
    for(let i = 0; i < clapCount; i++){
      setTimeout(() => playTapSound(), i * clapInterval);
    }
  }

  if(!('speechSynthesis' in window)){
    playClaps();
    return;
  }

  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = rate;
  u.pitch = 1.05;

  // 読み上げが実際に始まった瞬間に1拍目を合わせる。
  // 長音「ー」は単独で読ませず、前の音にくっつけて読ませる。
  u.onstart = () => playClaps();
  window.speechSynthesis.speak(u);
}

function makeHintUnits(moras){
  const units = [];
  moras.forEach(mora => {
    if(mora === 'ー' && units.length){
      units[units.length - 1].text += 'ー';
      units[units.length - 1].clapCount += 1;
    }else{
      units.push({ text:mora, clapCount:1 });
    }
  });
  return units;
}

function playMoraHint(){
  const moras = current().mora.split('/').map(v => v.trim()).filter(Boolean);
  if(!moras.length) return;

  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  setMessage('ヒントを きいてね', 'ok');

  const units = makeHintUnits(moras);
  let delay = 0;
  units.forEach(unit => {
    setTimeout(() => {
      speakMoraWithClaps(unit.text, unit.clapCount, 0.72);
    }, delay);
    delay += unit.clapCount * 820;
  });
}

function playTapSound(){
  try{
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const now = ac.currentTime;

    function burst(start, duration, volume){
      const buffer = ac.createBuffer(1, Math.floor(ac.sampleRate * duration), ac.sampleRate);
      const data = buffer.getChannelData(0);

      for(let i = 0; i < data.length; i++){
        const t = i / data.length;
        const attack = Math.min(1, t * 18);
        const decay = Math.pow(1 - t, 3.2);
        data[i] = (Math.random() * 2 - 1) * attack * decay;
      }

      const noise = ac.createBufferSource();
      noise.buffer = buffer;

      const high = ac.createBiquadFilter();
      high.type = 'highpass';
      high.frequency.value = 850;

      const mid = ac.createBiquadFilter();
      mid.type = 'bandpass';
      mid.frequency.value = 2100;
      mid.Q.value = 0.9;

      const gain = ac.createGain();
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

      noise.connect(high);
      high.connect(mid);
      mid.connect(gain);
      gain.connect(ac.destination);

      noise.start(start);
      noise.stop(start + duration);
    }

    // 「パン」と聞こえやすいように、短いノイズを2回重ねる
    burst(now, 0.075, 1.0);
    burst(now + 0.022, 0.065, 0.55);
  }catch(e){}
}

function wordsToText(words){
  const grouped = {};
  TYPE_ORDER.forEach(type => grouped[type] = []);
  words.forEach(w => {
    if(!grouped[w.type]) grouped[w.type] = [];
    grouped[w.type].push(w.word);
  });
  return Object.keys(grouped)
    .filter(type => grouped[type].length)
    .map(type => `${type}\n${grouped[type].join('　')}`)
    .join('\n\n');
}

function autoMora(word){
  const chars = Array.from(String(word).trim());
  const smallKana = 'ゃゅょぁぃぅぇぉャュョァィゥェォ';
  const moras = [];
  chars.forEach(ch => {
    if(smallKana.includes(ch) && moras.length){
      moras[moras.length - 1] += ch;
    }else{
      moras.push(ch);
    }
  });
  return moras.join('/');
}

function splitWords(line){
  return line
    .replace(/[、，]/g, ' ')
    .split(/[\s　]+/)
    .map(v => v.trim())
    .filter(Boolean);
}

function parseText(text){
  const lines = text.split(/\r?\n/).map(line => line.trim()).filter(line => line && !line.startsWith('#'));

  // 以前のCSV形式も読み込めるように残しておく。
  if(lines.some(line => line.includes(',') && line.split(',').length >= 3)){
    return lines.map(line => {
        const cols = line.split(',').map(v => v.trim());
        const word = cols[0] || '';
        return { word, mora: cols[1] || autoMora(word), type: cols[2] || '清音' };
      })
      .filter(w => w.word && w.mora);
  }

  const parsed = [];
  let currentType = '';
  lines.forEach(line => {
    const normalized = line.replace(/\s/g, '');
    if(TYPE_ORDER.includes(normalized)){
      currentType = normalized;
      return;
    }
    if(!currentType) return;
    splitWords(line).forEach(word => {
      parsed.push({ word, mora:autoMora(word), type:currentType });
    });
  });
  return parsed;
}

function applyDataText(){
  const parsed = parseText(els.dataText.value);
  if(parsed.length === 0){
    alert('単語データがありません。');
    return;
  }
  allWords = parsed;
  localStorage.setItem('moraTapWords', JSON.stringify(allWords));
  makeDeck(false);
}

function restoreInitialData(){
  allWords = DEFAULT_WORDS.slice();
  els.dataText.value = INITIAL_TEXT_DATA;
  localStorage.setItem('moraTapWords', JSON.stringify(allWords));
  makeDeck(false);
  setMessage('最初のデータにもどしました', 'ok');
}

function downloadCsv(){
  const blob = new Blob(['﻿' + wordsToText(allWords)], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mora_words.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

function loadCsvFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    els.dataText.value = String(reader.result || '');
    applyDataText();
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
}

function renderResults(){

    recent.map(r => `<tr><td>${escapeHtml(r.word)}</td><td>${r.taps}</td><td>${r.correctCount}</td><td>${r.ok ? '○' : '×'}</td></tr>`).join('') +
    '</tbody></table>';
}

function loadWordsFromStorage(){
  try{
    const data = JSON.parse(localStorage.getItem('moraTapWords'));
    return Array.isArray(data) && data.length ? data : null;
  }catch(e){ return null; }
}

function loadTypesFromStorage(){
  try{
    const data = JSON.parse(localStorage.getItem('moraTapTypes'));
    return Array.isArray(data) && data.length ? data : null;
  }catch(e){ return null; }
}

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
