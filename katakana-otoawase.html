<body><div class="shell">
<header><div class="brand"><span class="brandmark" aria-hidden="true">ァ</span>カタカナ おとあわせ</div></header>
<main id="app"></main><p id="voiceStatus" class="voice-status" role="status"></p>
</div>
<script>
'use strict';
// 語彙を追加するときは、下の WORDS に同じ形式のオブジェクトを追加できます。
// position: 'start'（語頭） / 'inside'（語中・語尾）。image は省略可。
// この初期データは一覧から各語の対象音位置を計算し、統一した配列にしています。
const GROUPS = {
 'ウェ':'ロープウェイ ウェットティッシュ ウェブ ウェブサイト ウェブカメラ ウェディング',
 'フィ':'フィルム フィルター フィッシュバーガー フィギュア プロフィール フィールド',
 'フォ':'フォーク フォント スマートフォン イヤフォン アイフォン フォルダ フォロー',
 'シェ':'シェイク シェフ シェア シェルター シェパード',
 'フェ':'パフェ カフェ カフェオレ カフェラテ フェンス フェリー フェルト',
 'ディ':'ディズニーランド ボディーソープ メロディー ディスク ディナー',
 'ウォ':'ウォーキング ウォーター ウォーターパーク',
 'ファ':'ファイル ファミリー ファスナー ファミレス ファン ファストフード ソファー',
 'ティ':'アイスティー ティッシュ パーティー ボランティア ミルクティー レモンティー ティーカップ ウェットティッシュ',
 'ウィ':'ウィンナー ハロウィン ウィンク ウィンドウ ウィッグ ウィンカー',
 'ジェ':'ジェットコースター ジェラート ジェル ジェットスキー ジェルペン',
 'チェ':'チェス チェック チェリー チェーン チェンジ チェックリスト'
};
const WORDS = Object.entries(GROUPS).flatMap(([targetSound, words]) => words.split(' ').map(word => ({word,targetSound,baseChar:targetSound[0],smallVowel:targetSound[1],position:word.indexOf(targetSound)===0?'start':'inside'})));
// 例: WORDS.push({word:'ディナー',targetSound:'ディ',baseChar:'デ',smallVowel:'ィ',position:'start'});
const SMALL = ['ァ','ィ','ゥ','ェ','ォ'];
const BIG = ['ア','イ','ウ','エ','オ'];
const BASE_OPTIONS = {ウ:['ウ','フ','シ','チ','テ'],フ:['ウ','フ','シ','チ','テ'],シ:['ウ','フ','シ','チ','テ'],デ:['シ','ジ','テ','デ'],テ:['ウ','フ','シ','チ','テ'],ジ:['シ','ジ','テ','デ'],チ:['ウ','フ','シ','チ','テ']};
const SOUND_OPTIONS = {ウ:['ウィ','ウェ','ウォ'],フ:['ファ','フィ','フェ','フォ'],シ:['シェ','シィ','シォ'],デ:['ディ','デェ','デォ'],テ:['ティ','テェ','テォ'],ジ:['ジェ','ジィ','ジョ'],チ:['チェ','チィ','チョ']};
const app=document.getElementById('app');
let level=1, mode='base', session=null, speechToken=0, speechTimer=null, questionCount=10, randomOrder=false;
const STORAGE_KEY='katakana-atelier-settings-v2';
const wordKey=w=>w.word+'|'+w.targetSound;
let selected=new Set(WORDS.map(wordKey)), storageMessage='';
function validWord(w){return w&&typeof w.word==='string'&&w.word.length<=40&&/^[ァ-ヺー・]+$/.test(w.word)&&typeof w.targetSound==='string'&&/^[ア-ヺ][ァィゥェォ]$/.test(w.targetSound)&&!SMALL.includes(w.targetSound[0])&&w.word.includes(w.targetSound)}
function normalizedWord(word,targetSound){return {word,targetSound,baseChar:targetSound[0],smallVowel:targetSound[1],position:word.indexOf(targetSound)===0?'start':'inside',custom:true}}
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(saved){for(const w of Array.isArray(saved.custom)?saved.custom:[]){if(validWord(w)&&!WORDS.some(x=>wordKey(x)===wordKey(w)))WORDS.push(normalizedWord(w.word,w.targetSound))}selected=new Set(Array.isArray(saved.selected)?saved.selected.filter(k=>WORDS.some(w=>wordKey(w)===k)):WORDS.map(wordKey));if([1,2,3].includes(saved.level))level=saved.level;if(['base','small','sound'].includes(saved.mode))mode=saved.mode;if(Number.isInteger(saved.count)&&saved.count>=1&&saved.count<=100)questionCount=saved.count;randomOrder=saved.randomOrder===true}}
catch{storageMessage='保存した設定を読み込めませんでした。この画面で設定し直せます。'}
function saveSettings(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({custom:WORDS.filter(w=>w.custom),selected:[...selected],level,mode,count:questionCount,randomOrder}));storageMessage=''}catch{storageMessage='このブラウザでは保存できません。追加したことばと設定は、この画面を閉じるまで使えます。'}const el=document.getElementById('storageMessage');if(el)el.textContent=storageMessage}
const modeName=()=>({base:'まえの もじを えらぶ',small:'ちいさい もじを えらぶ',sound:'おとを えらぶ'}[mode]);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const audioIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4 5 9H2v6h3l6 5V4Z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>';
const audioButton=label=>`<button class="audio" data-action="listen">${audioIcon}${label||'ことばをきく'}</button>`;
function stopSpeech(){speechToken++;clearTimeout(speechTimer);if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function speak(text){
 stopSpeech();const token=speechToken;const status=document.getElementById('voiceStatus');
 if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){status.textContent='このブラウザでは音声を使えません。音声に対応したブラウザで開いてください。';return}
 const utter=new SpeechSynthesisUtterance(text);utter.lang='ja-JP';utter.rate=.82;utter.pitch=1;
 const voices=speechSynthesis.getVoices();const japanese=voices.filter(v=>/^ja(?:-|_)/i.test(v.lang));
 if(japanese.length)utter.voice=japanese.find(v=>v.localService)||japanese[0];
 status.textContent='';
 utter.onstart=()=>{if(token===speechToken){clearTimeout(speechTimer);status.textContent=''}};
 utter.onerror=e=>{if(token===speechToken&&!['canceled','interrupted'].includes(e.error)){clearTimeout(speechTimer);status.textContent='音声を再生できませんでした。「ことばをきく」を押してください。音が出ないときは、端末の音量と日本語音声の設定を確認してください。'}};
 utter.onend=()=>{if(token===speechToken)clearTimeout(speechTimer)};
 speechSynthesis.resume();speechSynthesis.speak(utter);
 speechTimer=setTimeout(()=>{if(token===speechToken)status.textContent='音がきこえないときは「ことばをきく」を押してね。端末の音量も確認してください。'},5000);
}
if('speechSynthesis' in window)speechSynthesis.getVoices();
function home(){stopSpeech();session=null;document.getElementById('voiceStatus').textContent='';app.innerHTML=`
 <section class="hero"><h1>カタカナ おとあわせ</h1></section>
 <section class="panel"><h2 class="fieldtitle"><span>1</span>レベルを えらぼう</h2><div class="levels" role="group" aria-label="レベル">${[1,2,3].map(n=>`<button class="pick" data-level="${n}" aria-pressed="${level===n}"><strong>${['','はじめの おと','なか・おわり','ぜんぶ'][n]}</strong><small>${['','ことばの はじめ','ことばの なかや おわり','いろいろな ばしょ'][n]}</small></button>`).join('')}</div>
 <h2 class="fieldtitle"><span>2</span>れんしゅうを えらぼう</h2><div class="modes" role="group" aria-label="出題モード">${['base','small','sound'].map(m=>`<button class="pick" data-mode="${m}" aria-pressed="${mode===m}"><strong>${{base:'まえの もじを えらぶ',small:'ちいさい もじを えらぶ',sound:'おとを えらぶ'}[m]}</strong><small>${{base:'〇ィンナー → ウ',small:'ウ〇ンナー → イ',sound:'カ〇<span class="small-circle">〇</span>ラテ → フェ'}[m]}</small></button>`).join('')}</div>
 <section class="settings"><h2 class="fieldtitle"><span>3</span>ことばと 問題数を えらぼう</h2><div class="toolbar"><button class="secondary" data-action="selectAll">すべて選ぶ</button><button class="secondary" data-action="selectNone">すべて外す</button><span id="selectedCount"></span></div><div id="wordList" class="wordlist"></div><label class="wordcheck"><input type="checkbox" id="randomOrder" ${randomOrder?"checked":""}>ランダム出題</label><div id="randomCount" ${randomOrder?'':'hidden'}><div class="toolbar"><label for="questionCount">問題数（1〜100問）</label><input type="number" id="questionCount" min="1" max="100" step="1" value="${questionCount}" required><span>問</span></div><p class="settings-note">選んだことばを一巡するまで同じ出題は繰り返しません。問題数が多いときは、順番を変えて繰り返します。</p></div></section>
 <details><summary>ことばを 登録する</summary><form id="registerForm" class="register"><label>ことば（カタカナ）<input type="text" id="newWord" maxlength="40" placeholder="例：トゥモロー" required autocomplete="off"></label><label>練習するおと<select id="newSound" required><option value="">ことばを入力して選択</option></select></label><button class="secondary" type="submit">登録する</button></form><p id="registerMessage" class="form-message" role="status"></p><p class="settings-note">小さいァィゥェォを含む音を選んで登録します。同じ音が複数あることばは、最初の音を出題します。登録したことばは自動で選択されます。登録語・選択・問題数は、このブラウザに保存します（別の端末やブラウザには引き継がれません）。</p></details>
 <p id="storageMessage" class="form-message" role="status">${escapeHTML(storageMessage)}</p><div class="startrow"><button class="primary" data-action="start"></button><p class="helper">はじめると ことばの おとが なります。</p></div></section>
 <details><summary>おうちの方・先生へ</summary><p>「まえのもじ」「ちいさいもじ」は独立した問題です。1問につき1回の正解で答えを確認します。小さい文字の選択肢は大きいア・イ・ウ・エ・オで表示し、答えは小さい文字で確認します。</p><p>まちがえたときは「？」を表示して、ことばを読み上げます。正解するまで何度でも選べます。正答数は、一度もまちがえずに答えた問題の数です。復習では、選択中のことばのうち間違えた音の問題をすべて1回ずつ出題します。ランダム出題のときは、指定した問題数で出題します。</p><p>日本語の音声は端末・ブラウザの読み上げを使用します。</p></details>`;renderWordList();}
function renderWordList(){const list=document.getElementById('wordList');const open=new Set([...list.querySelectorAll('details[open]')].map(d=>d.dataset.sound));const pool=poolFor(level);const sounds=[...new Set(pool.map(w=>w.targetSound))];list.innerHTML=sounds.map(sound=>{const words=pool.filter(w=>w.targetSound===sound);return `<details class="sound-group" data-sound="${escapeHTML(sound)}" ${open.has(sound)?'open':''}><summary>${escapeHTML(sound)}<small>${words.length}件</small></summary><div class="sound-words">${words.map(w=>`<label class="wordcheck"><input type="checkbox" data-word="${escapeHTML(wordKey(w))}" ${selected.has(wordKey(w))?'checked':''}><span>${escapeHTML(w.word)}${w.custom?'<small>登録したことば</small>':''}</span></label>`).join('')}</div></details>`}).join('');updateStart();}
function updateStart(){const count=poolFor(level).filter(w=>selected.has(wordKey(w))).length;document.getElementById('selectedCount').textContent=count+'問 選択中';const input=document.getElementById('questionCount');document.getElementById('randomCount').hidden=!randomOrder;input.disabled=!randomOrder;const valid=!randomOrder||input.checkValidity();const b=app.querySelector('[data-action="start"]');b.disabled=!count||!valid;b.textContent=!count?'ことばを 選んでね':valid?(randomOrder?input.value:count)+'もん はじめる →':'問題数を 1〜100で 指定してね';}
function poolFor(l){return WORDS.filter(w=>l===3||(l===1?w.position==='start':w.position==='inside'))}
function makeSet(pool){if(!pool.length)return [];if(!randomOrder)return [...pool];const out=[];while(out.length<questionCount){const batch=shuffle(pool);if(batch.length>1&&out.length&&wordKey(batch[0])===wordKey(out[out.length-1]))[batch[0],batch[1]]=[batch[1],batch[0]];out.push(...batch.slice(0,questionCount-out.length))}return out;}
function start(reviewSounds=null){const pool=poolFor(level).filter(w=>selected.has(wordKey(w))&&(!reviewSounds||reviewSounds.includes(w.targetSound)));if(!pool.length)return;
 session={questions:makeSet(pool),index:0,stage:mode,mistakes:0,results:[],reviewSounds,choices:[],phase:'question'};question();}
function current(){return session.questions[session.index]}
function progress(){return `<ol class="progress" aria-label="問題の進み具合">${Array.from({length:session.questions.length},(_,i)=>`<li class="${i===session.index?'current':i<session.results.length?(session.results[i].clean?'done':'reviewed'):''}" ${i===session.index?'aria-current="step"':''} aria-label="${i+1}問目${i<session.results.length?(session.results[i].clean?' 正解':' 復習') : ''}">${i+1}</li>`).join('')}</ol>`}
function shell(content){app.innerHTML=`${progress()}<section class="panel fade"><div class="gamehead"><span class="badge">${['','はじめの おと','なか・おわり','ぜんぶ'][level]} ${session.reviewSounds?'・ふくしゅう':''}</span><span>${modeName()}</span><button class="quiet" data-action="home">ホームへ</button></div>${content}</section>`}
function question(){session.phase='question';session.stage=mode;session.mistakes=0;setChoices();drawQuestion();speak(current().word)}
function setChoices(){const w=current();session.choices=shuffle(session.stage==='base'?(BASE_OPTIONS[w.baseChar]||[w.baseChar,'フ','ウ','テ'].filter((v,i,a)=>a.indexOf(v)===i)):session.stage==='small'?BIG:[...new Set([w.targetSound,...(SOUND_OPTIONS[w.baseChar]||SMALL.map(v=>w.baseChar+v))])].slice(0,5))}
function maskedWord(w,stage){const index=w.word.indexOf(w.targetSound)+(stage==='small'?1:0);const length=stage==='sound'?w.targetSound.length:1;const blank=stage==='sound'?'<span class="blank-char sound-blanks" aria-label="大きい丸と小さい丸">〇<span class="small-circle">〇</span></span>':'<span class="blank-char">〇</span>';return escapeHTML(w.word.slice(0,index))+blank+escapeHTML(w.word.slice(index+length))}
function drawQuestion(){const w=current(),stage=session.stage;
 const title=stage==='sound'?'〇に はいる おとは？':'〇に はいる もじは？';
 let hint=w.position==='start'?'ことばの はじめの おとを えらぼう。':'ことばの なか・おわりの おとを えらぼう。';
 if(w.word==='ウェットティッシュ')hint=w.targetSound==='ウェ'?'ことばの はじめの おとを えらぼう。':'「ウェット」の あとの おとを えらぼう。';
 shell(`<div class="question"><h2 id="questionTitle" tabindex="-1">${title}</h2><p class="position">${hint}</p>
 <div class="workarea"><div class="listenarea">${w.image?`<img class="wordimage" src="${escapeHTML(w.image)}" alt="ことばの絵">`:''}<div class="masked-word">${maskedWord(w,stage)}</div>${audioButton()}</div>
 <div class="choices ${mode==='sound'?'sound-choices':''} ${session.choices.length===5?'five':''}" role="group" aria-label="答えの選択肢">${session.choices.map(v=>`<button class="choice" data-answer="${v}" aria-label="${stage==='small'?'小さい':''}${v}">${v}</button>`).join('')}</div></div><p class="notice" id="feedback" role="status"></p></div>`);
 const img=app.querySelector('.wordimage');if(img)img.onerror=()=>img.hidden=true;
}
function answer(value,button){if(!session||session.phase!=='question')return;const w=current();const correct=session.stage==='base'?w.baseChar:session.stage==='small'?BIG[SMALL.indexOf(w.smallVowel)]:w.targetSound;
 if(value!==correct){session.mistakes++;const feedback=document.getElementById('feedback');feedback.classList.add('retry');feedback.textContent='？';feedback.setAttribute('aria-label','もういちど きいてみよう');speak(w.word);return}
 reveal(false);
}
function reveal(assisted){const w=current();session.phase='answer';session.results.push({word:w.word,targetSound:w.targetSound,clean:session.mistakes===0,assisted});
 const index=w.word.indexOf(w.targetSound);const marked=escapeHTML(w.word.slice(0,index))+'<mark>'+escapeHTML(w.targetSound)+'</mark>'+escapeHTML(w.word.slice(index+w.targetSound.length));
 shell(`<div class="answer"><h2 tabindex="-1" id="answerTitle">${assisted?'いっしょに たしかめよう':session.mistakes?'できたね！':'せいかい！'}</h2><div class="formula"><span>${w.baseChar}</span><span>＋</span><span class="little">${w.smallVowel}</span><span class="arrow">→</span><span>${w.targetSound}</span></div><div class="arrow" aria-hidden="true">↓</div><div class="word">${marked}</div>${audioButton('もういちど きく')}<button class="primary" data-action="next">${session.index===session.questions.length-1?'けっかを みる':'たしかめた！ つぎへ →'}</button></div>`);document.getElementById('answerTitle').focus();speak(w.targetSound+'。'+w.word+'。');
}
function result(){stopSpeech();session.phase='result';document.getElementById('voiceStatus').textContent='';const clean=session.results.filter(r=>r.clean).length;const missed=[...new Set(session.results.filter(r=>!r.clean).map(r=>r.targetSound))];
 app.innerHTML=`<section class="result fade">${clean===session.questions.length?'':'<div class="hero"><h1>よく がんばったね！</h1></div>'}<div class="panel"><p>まちがえずに できた もんだい</p><div class="score">${clean}<small> / ${session.questions.length}もん</small></div>${missed.length?'<p>この おとを、もういちど れんしゅうしよう。</p>':' '}<div class="soundchips">${missed.map(s=>`<span class="chip">${s}</span>`).join('')}</div>${missed.length?'<button class="primary" data-action="review">この おとを ふくしゅう</button>':''}<div class="actions"><button class="secondary" data-action="again">もう一度</button><button class="secondary" data-action="home">ホームへ</button></div><p class="helper">「もう一度」は、いまのレベル・モード${session.reviewSounds?'・ふくしゅうする音':''}で${session.questions.length}もん。</p></div></section>`;
}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.level){level=Number(b.dataset.level);app.querySelectorAll('[data-level]').forEach(x=>x.setAttribute('aria-pressed',x===b));saveSettings();if(b.dataset.level)renderWordList();return}
 if(b.dataset.mode){mode=b.dataset.mode;app.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));saveSettings();if(b.dataset.level)renderWordList();return}
 if(b.dataset.answer){answer(b.dataset.answer,b);return}
 switch(b.dataset.action){case'selectAll':poolFor(level).forEach(w=>selected.add(wordKey(w)));saveSettings();renderWordList();break;case'selectNone':poolFor(level).forEach(w=>selected.delete(wordKey(w)));saveSettings();renderWordList();break;case'home':home();break;case'start':start();break;case'listen':if(session)speak(session.phase==='answer'?current().targetSound+'。'+current().word+'。':current().word);break;case'next':if(session?.phase!=='answer')return;session.index++;if(session.index===session.questions.length)result();else question();break;case'review':start([...new Set(session.results.filter(r=>!r.clean).map(r=>r.targetSound))]);break;case'again':start(session.reviewSounds);break}
});
app.addEventListener('change',e=>{if(e.target.id==='randomOrder'){randomOrder=e.target.checked;saveSettings();updateStart();return}if(e.target.matches('[data-word]')){if(e.target.checked)selected.add(e.target.dataset.word);else selected.delete(e.target.dataset.word);saveSettings();updateStart();}});
app.addEventListener('input',e=>{if(e.target.id==='questionCount'){if(e.target.checkValidity()){questionCount=Number(e.target.value);saveSettings()}updateStart()}if(e.target.id==='newWord'){const word=e.target.value.trim().normalize('NFKC');const sounds=[...new Set(word.match(/[ア-ヺ][ァィゥェォ]/g)||[])].filter(s=>!SMALL.includes(s[0]));document.getElementById('newSound').innerHTML=sounds.length?sounds.map(s=>`<option value="${escapeHTML(s)}">${escapeHTML(s)}</option>`).join(''):'<option value="">小さいァィゥェォを含むことば</option>';}});
app.addEventListener('submit',e=>{if(e.target.id!=='registerForm')return;e.preventDefault();const word=document.getElementById('newWord').value.trim().normalize('NFKC');const targetSound=document.getElementById('newSound').value;const w=normalizedWord(word,targetSound);const message=document.getElementById('registerMessage');if(!validWord(w)){message.textContent='カタカナのことばと、その中にある小さいァィゥェォの音を指定してください。';return}if(WORDS.some(x=>wordKey(x)===wordKey(w))){message.textContent='このことばとおとは、すでに登録されています。';return}WORDS.push(w);selected.add(wordKey(w));saveSettings();renderWordList();message.textContent=word+'（'+targetSound+'）を登録しました。'+(poolFor(level).includes(w)?'': '「'+(w.position==='start'?'はじめの おと':'なか・おわり')+'」または「ぜんぶ」で出題できます。');e.target.reset();document.getElementById('newSound').innerHTML='<option value="">ことばを入力して選択</option>';});
window.addEventListener('pagehide',stopSpeech);
home();
</script></body></html>
