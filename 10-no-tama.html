<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>10のたまをつくろう！</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;place-items:center;background:linear-gradient(135deg,#def7ff,#fff0c8);font-family:"Yu Gothic",Meiryo,sans-serif;touch-action:none;user-select:none}.game{position:relative;width:320px;height:480px;border:4px solid #fff;border-radius:25px 25px 42px 42px;overflow:hidden;background:#e9faff;box-shadow:0 15px 35px #276b8b44}.hud{position:absolute;z-index:5;inset:0 0 auto;height:132px;padding:6px 9px;background:linear-gradient(#fffdf4,#e5f8ff);border-bottom:3px solid #99dcec;color:#31566b}h1{margin:0 0 4px;text-align:center;font-size:19px;color:#ff7043}.row{display:flex;align-items:center;justify-content:space-between;gap:5px}.box{min-width:76px;padding:3px;border:2px solid #bee7ef;border-radius:9px;background:#fff;text-align:center;font-size:11px;font-weight:bold}.box b{display:block;font-size:17px;color:#ff7043}.bgm{height:35px;border:0;border-radius:9px;background:#909da4;color:#fff;font-weight:bold}.bgm.on{background:#31b875}.speed{display:grid;grid-template-columns:auto 1fr 24px;gap:7px;align-items:center;margin-top:5px;font-size:12px;font-weight:bold}.speed input{width:100%;accent-color:#ff8a42}.speed output{display:grid;place-items:center;height:22px;border-radius:6px;background:#ff8a42;color:#fff}.controls{display:flex;gap:6px;margin-top:4px}.control{height:23px;flex:1;border:0;border-radius:8px;color:#fff;font-size:11px;font-weight:900}.pauseBtn{background:#4b9ed8}.restartBtn{background:#ee7560}canvas{position:absolute;top:132px;left:0;width:312px;height:344px;touch-action:none}.danger{position:absolute;z-index:4;top:163px;left:10px;right:10px;border-top:3px dashed #f44;pointer-events:none}.danger span{position:absolute;right:2px;top:-17px;font-size:9px;font-weight:bold;color:#d22;background:#fff;padding:1px 4px;border-radius:5px}.warning{animation:warn .4s infinite alternate}@keyframes warn{to{box-shadow:0 0 0 7px #f334,0 15px 35px #f448}}.clear{position:absolute;z-index:8;left:50%;top:58%;opacity:0;white-space:nowrap;color:#ff593b;font-size:29px;font-weight:900;text-shadow:0 2px #fff,2px 0 #fff,-2px 0 #fff,0 0 14px #ffeb3b;transform:translate(-50%,-50%)}.clear.show{animation:pop .8s}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}70%{opacity:1;transform:translate(-50%,-65%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(.8)}}.pauseScreen{position:absolute;z-index:9;inset:132px 0 0;display:none;place-items:center;background:#24415280;color:#fff;font-size:25px;font-weight:900;text-shadow:0 2px 5px #000}.pauseScreen.show{display:grid}.over{position:absolute;z-index:10;inset:132px 0 0;display:none;place-items:center;background:#244152b8}.over.show{display:grid}.card{width:270px;padding:25px 12px;border:4px solid #fff;border-radius:23px;background:#fffbe4;text-align:center;color:#ef4d4d;font-size:22px;font-weight:900;line-height:1.55}.retry{margin-top:16px;padding:11px 23px;border:0;border-radius:30px;background:#ff8a42;color:#fff;font-size:17px;font-weight:bold;box-shadow:0 5px #d85b20}@media(max-width:330px),(max-height:490px){.game{transform:scale(.92)}}
</style></head><body>
<main class="game" id="game"><header class="hud"><h1>10のたまをつくろう！</h1><div class="row"><div class="box">スコア<b id="score">0</b></div><div class="box">さいこうきろく<b id="high">0</b></div><button class="bgm" id="bgm">🎵 BGM OFF</button></div><label class="speed">スピード<input id="speed" type="range" min="1" max="10" value="4"><output id="speedOut">4</output></label><div class="controls"><button class="control pauseBtn" id="pauseBtn">⏸ とめる</button><button class="control restartBtn" id="restartBtn">↻ さいしょからやりなおす</button></div></header><div class="danger"><span>きけんライン</span></div><canvas id="cv" width="312" height="344"></canvas><div class="clear" id="clear">10 CLEAR! +10</div><div class="pauseScreen" id="pauseScreen">いちじていし</div><div class="over" id="over"><div class="card">ゲームオーバー<br>またちょうせんしてね！<br><button class="retry" id="retry">もう一度あそぶ</button></div></div></main>
<script>
(()=>{'use strict';
const cv=document.querySelector('#cv'),c=cv.getContext('2d'),game=document.querySelector('#game'),scoreEl=document.querySelector('#score'),highEl=document.querySelector('#high'),speed=document.querySelector('#speed'),speedOut=document.querySelector('#speedOut'),clearEl=document.querySelector('#clear'),over=document.querySelector('#over'),pauseBtn=document.querySelector('#pauseBtn'),pauseScreen=document.querySelector('#pauseScreen');
const W=cv.width,H=cv.height,FLOOR=H-5,DANGER=34,colors=['','#62d9ff','#65e6ad','#a7e35e','#ffe064','#ffbd54','#ff8d5c','#ff6f91','#bd78ef','#747ff2'];
let balls=[],parts=[],score=0,high=+(localStorage.getItem('tenBallHigh')||0),last=performance.now(),spawn=0,warning=0,ended=false,paused=false,drag=null,id=0,audio=null,bgm=false,musicTimer=0,musicStep=0;highEl.textContent=high;
const rad=n=>14+n*1.65;
function ball(n,x,y){return{id:++id,n,x,y,r:rad(n),vy:0,drag:false,born:performance.now()}}
function addBall(){if(ended)return;let n=1+Math.floor(Math.random()*9),r=rad(n),x=r+8+Math.random()*(W-2*r-16);balls.push(ball(n,x,-r-2))}
function constrain(b){b.x=Math.max(7+b.r,Math.min(W-7-b.r,b.x));if(b.y+b.r>FLOOR){b.y=FLOOR-b.r;b.vy=0}}
function collisions(){for(let p=0;p<30;p++){let hit=false;for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j];if(a.drag||b.drag)continue;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),need=a.r+b.r+.4;if(d>=need)continue;hit=true;if(d<.01){dx=.01;dy=1;d=1}let nx=dx/d,ny=dy/d,o=need-d,ma=.5,mb=.5;if(a.y<b.y){ma=.82;mb=.18}else if(b.y<a.y){ma=.18;mb=.82}a.x-=nx*o*ma;a.y-=ny*o*ma;b.x+=nx*o*mb;b.y+=ny*o*mb;a.vy=Math.min(0,a.vy);b.vy=Math.min(0,b.vy);constrain(a);constrain(b)}if(!hit)break}}
function supported(a){if(a.y+a.r>=FLOOR-1)return true;return balls.some(b=>b!==a&&!b.drag&&b.y>a.y&&Math.hypot(b.x-a.x,b.y-a.y)<=a.r+b.r+1.5)}
function physics(dt){for(const b of balls){if(b.drag)continue;b.vy+=700*(.16+(+speed.value)*.12)*dt;b.vy=Math.min(b.vy,280);b.y+=b.vy*dt;constrain(b)}collisions();for(const b of balls)if(!b.drag&&supported(b)&&b.vy>0)b.vy=0;collisions()}
function remove(b){let i=balls.indexOf(b);if(i>=0)balls.splice(i,1)}
function burst(x,y,color,count=15){for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,s=45+Math.random()*100;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-25,t:.7,size:2+Math.random()*4,color})}}
function sound(kind){if(!bgm||!audio)return;let now=audio.currentTime,notes=kind==='clear'?[660,784,1047]:kind==='bad'?[180]:[523,659];notes.forEach((f,i)=>tone(f,now+i*.09,kind==='clear'?.25:.12,.04,kind==='bad'?'square':'triangle'))}
function merge(src){let target=null,best=Infinity;for(const b of balls){if(b===src)continue;let d=Math.hypot(b.x-src.x,b.y-src.y);if(d<=b.r+src.r+5&&d<best){best=d;target=b}}if(!target)return;let total=src.n+target.n;if(total>10){separate(src,target);sound('bad');return}let x=(src.x+target.x)/2,y=(src.y+target.y)/2;remove(src);remove(target);if(total===10){score+=10;scoreEl.textContent=score;if(score>high){high=score;highEl.textContent=high;localStorage.setItem('tenBallHigh',high)}burst(x,y,'#fff238',35);clearEl.classList.remove('show');void clearEl.offsetWidth;clearEl.classList.add('show');sound('clear')}else{let m=ball(total,x,y);constrain(m);balls.push(m);burst(x,y,colors[total]);sound('merge')}}
function separate(a,b){let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d,o=Math.max(8,a.r+b.r+3-d);a.x-=nx*o*.55;a.y-=ny*o*.3;b.x+=nx*o*.55;b.y+=ny*o*.3;constrain(a);constrain(b);collisions()}
function split(b){if(b.n===1){sound('bad');return}let n1=Math.floor(b.n/2),n2=b.n-n1,x=b.x,y=b.y;remove(b);let a=ball(n1,x-rad(n1)*.8,y-8),d=ball(n2,x+rad(n2)*.8,y-12);constrain(a);constrain(d);balls.push(a,d);separate(a,d);burst(x,y,'#fff',12);sound('merge')}
function point(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{if(ended||paused)return;let p=point(e),b=[...balls].reverse().find(q=>Math.hypot(q.x-p.x,q.y-p.y)<=q.r+5);if(!b)return;e.preventDefault();cv.setPointerCapture(e.pointerId);b.drag=true;b.vy=0;remove(b);balls.push(b);drag={id:e.pointerId,b,sx:p.x,sy:p.y,ox:p.x-b.x,oy:p.y-b.y,moved:false}});
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;let p=point(e),b=drag.b;if(Math.hypot(p.x-drag.sx,p.y-drag.sy)>7)drag.moved=true;b.x=Math.max(7+b.r,Math.min(W-7-b.r,p.x-drag.ox));b.y=Math.max(-b.r,Math.min(FLOOR-b.r,p.y-drag.oy))});
function release(e){if(!drag||e.pointerId!==drag.id)return;let d=drag;drag=null;d.b.drag=false;d.b.vy=0;d.moved?merge(d.b):split(d.b);collisions()}cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
function danger(dt){let risky=balls.filter(b=>!b.drag&&b.y-b.r<DANGER+10);if(risky.length){warning+=dt;game.classList.add('warning');if(warning>1.5&&risky.some(b=>supported(b)&&performance.now()-b.born>900)){ended=true;over.classList.add('show')}}else{warning=Math.max(0,warning-dt*2);if(!warning)game.classList.remove('warning')}}
function drawBall(b){c.save();c.translate(b.x,b.y);c.shadowColor='#245c7338';c.shadowBlur=6;c.shadowOffsetY=3;let g=c.createRadialGradient(-b.r*.35,-b.r*.4,2,0,0,b.r);g.addColorStop(0,'#fff');g.addColorStop(.22,colors[b.n]);g.addColorStop(1,colors[b.n]);c.fillStyle=g;c.beginPath();c.arc(0,0,b.r,0,Math.PI*2);c.fill();c.shadowColor='transparent';c.strokeStyle='#fff';c.lineWidth=2;c.stroke();c.font=`900 ${Math.max(20,b.r)}px Arial`;c.textAlign='center';c.textBaseline='middle';c.strokeStyle='#3458';c.lineWidth=3;c.fillStyle='#fff';c.strokeText(b.n,0,1);c.fillText(b.n,0,1);c.restore()}
function draw(){let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#eafaff');g.addColorStop(1,'#c8eef4');c.fillStyle=g;c.fillRect(0,0,W,H);for(const b of balls)drawBall(b);for(const p of parts){c.globalAlpha=Math.max(0,p.t/.7);c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,p.size,0,Math.PI*2);c.fill()}c.globalAlpha=1}
function loop(now){let dt=Math.min(.025,(now-last)/1000);last=now;if(!ended&&!paused){spawn+=dt*1000;if(spawn>3300-(+speed.value)*190){spawn=0;addBall()}physics(dt);danger(dt);for(const p of parts){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=140*dt}parts=parts.filter(p=>p.t>0)}draw();requestAnimationFrame(loop)}
function restart(){balls=[];parts=[];score=0;scoreEl.textContent=0;spawn=warning=0;ended=false;paused=false;drag=null;over.classList.remove('show');pauseScreen.classList.remove('show');pauseBtn.textContent='⏸ とめる';game.classList.remove('warning');addBall()}
speed.oninput=()=>speedOut.value=speed.value;document.querySelector('#retry').onclick=restart;document.querySelector('#restartBtn').onclick=()=>{if(confirm('さいしょからやりなおしますか？'))restart()};pauseBtn.onclick=()=>{if(ended)return;paused=!paused;if(drag){drag.b.drag=false;drag=null}pauseBtn.textContent=paused?'▶ つづける':'⏸ とめる';pauseScreen.classList.toggle('show',paused)};
function tone(f,t,d,v=.025,type='triangle'){let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+.02)}
function music(){if(!bgm)return;let notes=[523,659,784,659,587,698,880,698],now=audio.currentTime+.03;for(let i=0;i<4;i++)tone(notes[(musicStep+i)%notes.length],now+i*.19,.14,.018);musicStep=(musicStep+4)%notes.length;musicTimer=setTimeout(music,725)}
document.querySelector('#bgm').onclick=async e=>{bgm=!bgm;e.currentTarget.textContent=bgm?'🎵 BGM ON':'🎵 BGM OFF';e.currentTarget.classList.toggle('on',bgm);clearTimeout(musicTimer);if(bgm){audio=audio||new(window.AudioContext||window.webkitAudioContext)();await audio.resume();music()}};
addBall();requestAnimationFrame(loop);
})();
</script></main></body></html>
