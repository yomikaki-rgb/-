<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ローマ字タップれんしゅう</title>
  <style>
    :root {
      --bg:#f7f8fc; --card:#fff; --line:#dfe5f0; --text:#1f2a44; --sub:#5f6b85;
      --accent:#4169e1; --ok:#27ae60; --ng:#e74c3c; --warn:#f39c12;
      --shadow:0 8px 22px rgba(46,74,126,.08); --radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"BIZ UDPGothic","UD Digi Kyokasho N-R","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
    button,input,textarea{font:inherit}
    .app{max-width:980px;margin:0 auto;padding:8px}
    .topbar,.toolbar,.action-row,.mode-buttons,.row-buttons,.csv-actions,.candidate-box,.result-actions{display:flex;flex-wrap:wrap;gap:8px}
    .topbar{justify-content:space-between;align-items:center;margin-bottom:8px}
    .title{font-size:18px;font-weight:800}
    .subline{font-size:12px;color:var(--sub)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px;margin-bottom:8px}
    .section-title{font-size:15px;font-weight:800;margin:0 0 8px}
    .btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:8px 11px;font-weight:800;cursor:pointer}
    .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn.secondary{background:#eef3ff;border-color:#cfdafc}
    .btn.success{background:#eaf9f0;border-color:#bfe8ce;color:#18663a}
    .btn.danger{background:#fff1ef;border-color:#f5c6bf;color:#b53c2e}
    .btn.warn{background:#fff8e8;border-color:#f0ddb0;color:#8a6112}
    .btn.active{background:#6e8cff;border-color:#6e8cff;color:#fff}
.print-big-btn{font-size:72px;padding:30px 48px;font-weight:900;background:#ff3b3b !important;border-color:#ff3b3b !important;color:#fff !important}
.back-small-btn{font-size:18px;padding:10px 16px;font-weight:700}
    .btn.small{font-size:12px;padding:7px 9px}
    .word-wrap{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;position:relative}
    .word-side-controls{display:flex;flex-direction:column;gap:8px;align-items:stretch}
    .free-save-under-read{display:none}
    .free-save-under-read.show{display:block}
    .current-word,.current-word-input{width:100%;min-height:64px;border-radius:18px;padding:8px 10px;font-weight:800;font-size:clamp(24px,3.8vw,40px);text-align:center}
    .current-word{display:flex;align-items:center;justify-content:center;background:#f4f7ff;border:2px dashed #cfdbff;letter-spacing:.08em}
    .current-word-input{border:2px dashed #cfdbff;background:#f4f7ff}
    .current-word-input::placeholder{font-size:clamp(16px,2.4vw,24px);color:#8aa0d8;letter-spacing:0}
    .free-done-display{display:none;margin-top:8px;min-height:180px;border:1px solid var(--line);border-radius:18px;background:#fff;padding:12px;overflow:auto}
    .free-done-display.show{display:block}
    .free-done-list{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
    .free-done-chip{display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;border-radius:999px;background:#edf3ff;border:1px solid #d5e2ff;font-weight:800;font-size:22px;line-height:1.2}
    .status-panel{display:grid;grid-template-columns:160px 1fr;gap:8px;margin-top:8px}
    .status-item{background:#f8faff;border:1px solid var(--line);border-radius:14px;padding:8px;min-height:54px}
    .status-label{font-size:12px;color:var(--sub);margin-bottom:4px}
    .status-value{font-size:20px;font-weight:800}
    .input-preview{font-size:clamp(20px,3vw,30px);font-weight:800;text-align:center;min-height:48px;border-radius:14px;padding:8px 10px;background:#fff;border:2px solid #d9e3f8;margin-top:8px;letter-spacing:.08em}
    .confirm-preview{min-height:44px;border-radius:14px;border:2px dashed #d6def4;background:#f9fbff;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px;margin-top:8px;font-weight:800;font-size:22px}
    .feedback{display:none !important;min-height:0;font-weight:800;text-align:center;margin-top:0;font-size:14px}
    .feedback.ok{color:var(--ok)} .feedback.ng{color:var(--ng)} .feedback.info{color:var(--accent)}
    .kbd-layout{display:grid;grid-template-columns:1fr 88px;gap:8px;align-items:start;margin-top:8px}
    .consonant-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-auto-rows:82px;gap:6px;position:relative;padding-bottom:0}
    .consonant-col,.vowel-col{display:grid;gap:6px}
    .consonant-col.positional{display:block;width:100%;height:100%}
    .consonant-title,.vowel-title{margin-top:0!important;margin-bottom:6px!important;min-height:22px;display:flex;align-items:flex-end}
    .vowel-wrap{position:relative;padding-top:0}
    .key{border-radius:16px;border:2px solid #cfd8ed;background:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:6px 4px;font-weight:800;user-select:none}
    .key.selected{background:#edf3ff;border-color:var(--accent);box-shadow:0 0 0 4px rgba(65,105,225,.12)}
    .consonant-col .key{min-height:82px}
    .consonant-col.positional .key{width:100%;height:82px}
    .vowel-col .key{min-height:42px;background:#fff7ea;border-color:#efd8a8}
    .vowel-col{position:relative}
    .vowel-wrap .ok-large{position:absolute;top:-92px;left:0;right:0;z-index:3;min-height:54px;font-size:26px;border-width:3px;padding:8px 6px;box-shadow:0 8px 20px rgba(65,105,225,.16)}
    .key.nn{min-height:82px;width:100%;background:#f3efff;border-color:#d3c6ff;grid-column:1;grid-row:2;z-index:2}
    .main{font-size:28px;line-height:1}
    .sub{font-size:12px;color:var(--sub);margin-top:4px}
    .ok-large{min-height:58px;font-size:24px;border-width:2px;padding:10px 6px}
    .checklist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .check-item{border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:#fbfcff;display:flex;align-items:center;gap:8px}
    .check-item input{width:18px;height:18px}
    .inline-note{background:#f5f8ff;border:1px solid #d8e4ff;border-radius:12px;padding:8px 10px;color:var(--sub);margin-top:8px;font-size:13px}
    .muted{color:var(--sub)}
    textarea,input[type="text"]{width:100%;border:2px solid #d9e3f8;border-radius:14px;padding:10px 12px;background:#fff}
    .saved-list,.miss-list,.candidate-list{display:grid;gap:8px;margin-top:8px;max-height:220px;overflow:auto}
    .list-item{border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:#fff;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
    .list-item strong{font-size:17px}
    .pill{display:inline-block;border-radius:999px;background:#edf3ff;border:1px solid #d5e2ff;padding:4px 8px;font-size:12px;font-weight:700;color:#3350ad}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
    .stat{background:#fafcff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
    .stat .num{font-size:24px;font-weight:800}
    .hidden{display:none!important}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    @media (max-width: 900px){
      .consonant-grid{grid-template-columns:repeat(9,minmax(46px,1fr));grid-auto-rows:74px}
      .consonant-col .key{min-height:74px}.consonant-col.positional .key{height:74px}.main{font-size:24px}
    }
    @media (max-width: 760px){
      .app{padding:6px}.word-wrap{grid-template-columns:1fr}.word-side-controls{width:100%}.status-panel{grid-template-columns:1fr}
      .kbd-layout{grid-template-columns:1fr}.consonant-grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:auto;padding-bottom:0}
      .vowel-wrap{padding-top:0}.vowel-col{grid-template-columns:repeat(5,1fr);position:relative;padding-top:42px}.vowel-wrap .ok-large{position:static;left:auto;right:auto;top:auto}.key.nn{position:static;width:auto}.consonant-col.positional{display:grid}.vowel-col .key,.key.nn,.consonant-col.positional .key{min-height:58px;height:auto}.checklist,.stats{grid-template-columns:1fr 1fr}
    }
    @media (max-width: 520px){.checklist,.stats{grid-template-columns:1fr}.topbar{align-items:flex-start}}
  
    /* hide redundant free-input panel; keep functionality in main word area */
    #freePanel{display:none !important;}
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div>
        <div class="title">ローマ字タップれんしゅう</div>
      </div>
      <div class="toolbar">
        <button class="btn secondary small" id="showHowBtn">つかいかた</button>
        <button class="btn secondary small" id="toggleCaseBtn">大文字表示</button>
        <button class="btn secondary small" id="toggleGuideBtn">カタカナ表示 ON</button>
        <button class="btn secondary small" id="toggleExtendedBtn">GZDBP ON</button>
        <button class="btn secondary small" id="toggleSpeechBtn">音声 ON</button>
                <button class="btn secondary small" id="toggleDisplayModeBtn">漢字＋(かな)</button>
      </div>
    </div>

    <section class="card" id="practiceIntroCard">
      <h2 class="section-title">れんしゅう</h2>
      <div class="inline-note">じゅんびができたら、下のボタンを押してはじめます。</div>
      <div class="action-row" style="margin-top:8px;">
        <button class="btn primary" id="startPracticeBtn">れんしゅうをはじめる</button>
      </div>
    </section>

    <section class="card hidden" id="practiceSessionCard">
      <div class="topbar" style="margin-bottom:0;">
        <div>
          <div class="section-title" style="margin-bottom:4px;">れんしゅうした たんご</div>
          <div class="status-value" id="practicedCountLabel" style="font-size:36px;">0 こ</div>
        </div>
        <div class="toolbar">
          <button class="btn secondary" id="printPracticedBtn" class="btn print-big-btn" style="background:#ff0000 !important;color:#fff !important;border-color:#ff0000 !important;font-size:32px;padding:14px 24px;">いんさつ</button>
<button class="btn secondary back-small-btn" style="font-size:16px;padding:8px 14px;" id="backToStartBtn">はじめにもどる</button>
        </div>
      </div>
    </section>

    <section class="card" id="practiceCard">
      <div class="word-wrap">
        <div>
          <div class="current-word" id="currentWord">あい</div>
          <input type="text" id="currentWordInput" class="current-word-input" placeholder="ここにひらがなを入力" />
          <div class="free-done-display" id="freeDoneDisplay">
            <div class="free-done-list" id="freeDoneDisplayList"></div>
          </div>
        </div>
        <div class="word-side-controls">
          <button class="btn secondary free-save-under-read back-small-btn" id="backToStartFreeBtn" style="font-size:16px;padding:8px 14px;margin-bottom:8px;">はじめにもどる</button>
          <button class="btn secondary" id="speakWordBtn">単語をよむ</button>
          <button class="btn primary free-save-under-read" id="freeSaveWordBtn" style="font-size:28px;padding:12px 20px;">できた！</button>
          <div class="free-save-under-read" id="freeDoneArea">
            <div style="font-size:20px;font-weight:800;text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;">できた <span id="freeDoneCount">0</span> こ</div>
            <button class="btn print-big-btn" id="printFreeDoneBtn" style="background:#ff4d4f !important;color:#fff !important;border-color:#ff4d4f !important;font-size:28px;padding:12px 20px;">いんさつ</button>
          </div>
        </div>
      </div>

      <div class="status-panel">
        <div class="status-item">
          <div class="status-label">進みぐあい</div>
          <div class="status-value" id="progressLabel">1 / 1</div>
        </div>
        <div>
          <div class="input-preview mono" id="inputPreview"></div>
          <div class="confirm-preview mono" id="confirmPreview"></div>
        </div>
      </div>

      <div class="feedback info" id="feedback"></div>

      <div class="action-row" style="margin-top:8px;">
        <button class="btn secondary" id="backspaceBtn">1文字けす</button>
        <button class="btn danger" id="clearInputBtn">ぜんぶけす</button>
        <button class="btn warn" id="showAnswerBtn">こたえを見る</button>
        <button class="btn primary" id="nextWordBtn">つぎへ</button>
      </div>

      <div class="kbd-layout">
        <div>
          <h3 class="section-title consonant-title">子音</h3>
          <div class="consonant-grid" id="consonantGrid"></div>
        </div>
        <div class="vowel-wrap">
          <h3 class="section-title vowel-title">母音</h3>
          <div class="vowel-col">
                        <div id="vowelGrid" class="vowel-col"></div>
          </div>
        </div>
      </div>
      <div class="inline-note">基本表記は し=SI、ち=TI、つ=TU、ふ=HU、ん=NN、きゃ=KYA です。</div>
    </section>

    <section class="card">
      <h2 class="section-title">モード</h2>
      <div class="mode-buttons">
        <button class="btn active" data-mode="practice">単語練習</button>
        <button class="btn" data-mode="free">自由入力</button>
        <button class="btn" data-mode="saved">保存した単語</button>
        
      </div>
    </section>

    <section class="card" id="practiceSettingsCard">
      <h2 class="section-title">練習する行</h2>
      <div class="row-buttons">
                <button class="btn secondary small" id="selectAllRowsBtn">全選択</button>
        <button class="btn secondary small" id="clearAllRowsBtn">全解除</button>
        <button class="btn secondary small" id="shuffleBtn">シャッフル ON</button>
      </div>
      <div class="checklist" id="groupChecklist"></div>
      <div class="inline-note">チェックした行だけを出題します。</div>
    </section>

    <section class="card">
      <h2 class="section-title">CSV</h2>
      <div class="csv-actions">
        <label class="btn secondary small" for="csvInput">CSV読み込み</label>
        <input id="csvInput" type="file" accept=".csv,text/csv" class="hidden" />
        <button class="btn secondary small" id="exportWordsBtn">単語CSV書き出し</button>
        <button class="btn secondary small" id="exportHistoryBtn">履歴CSV書き出し</button>
      </div>
      <div class="inline-note mono">形式: group,word</div>
    </section>

    <section class="card hidden" id="freePanel">
      <h2 class="section-title">自由入力</h2>
      <div class="inline-note">上の大きな枠を直接タップして、ひらがなを自由に入力してください。</div>
      <div class="candidate-box">
        <button class="btn secondary" id="freePracticeBtn">この単語で練習</button>
        <button class="btn danger" id="clearFreeInputBtn">入力を消す</button>
      </div>
    </section>

    <section class="card hidden" id="savedPanel">
      <h2 class="section-title">保存した単語</h2>
      <div class="row-buttons">
        <button class="btn secondary small" id="practiceSavedBtn">保存単語で練習開始</button>
        <label class="btn secondary small" for="savedCsvInput">保存単語のCSV読み込み</label>
        <input id="savedCsvInput" type="file" accept=".csv,text/csv" class="hidden" />
        <button class="btn secondary small" id="exportSavedWordsBtn">保存単語のCSV出力</button>
        <button class="btn danger small" id="clearSavedBtn">保存単語を全削除</button>
      </div>
      <div class="saved-list" id="savedList"></div>
    </section>
</div>

        if(chars[i]==='っ'){
          const pair=(chars[i+1]||'') + (chars[i+2]||'');
          if(SMALL_YOON_ROMAJI[pair]){ out += SMALL_YOON_ROMAJI[pair].charAt(0); continue; }
          const next = ROMAJI_MAP[chars[i+1]] || '';

        const pair=(chars[i]||'') + (chars[i+1]||'');
        if(SMALL_YOON_ROMAJI[pair]){ out += SMALL_YOON_ROMAJI[pair]; i++; continue; }

    function tokenToKana(token){
      const baseMap = {A:'あ',I:'い',U:'う',E:'え',O:'お',KA:'か',KI:'き',KU:'く',KE:'け',KO:'こ',SA:'さ',SI:'し',SU:'す',SE:'せ',SO:'そ',TA:'た',TI:'ち',TU:'つ',TE:'て',TO:'と',NA:'な',NI:'に',NU:'ぬ',NE:'ね',NO:'の',HA:'は',HI:'ひ',HU:'ふ',HE:'へ',HO:'ほ',MA:'ま',MI:'み',MU:'む',ME:'め',MO:'も',YA:'や',YU:'ゆ',YO:'よ',RA:'ら',RI:'り',RU:'る',RE:'れ',RO:'ろ',WA:'わ',WO:'を',GA:'が',GI:'ぎ',GU:'ぐ',GE:'げ',GO:'ご',ZA:'ざ',ZI:'じ',ZU:'ず',ZE:'ぜ',ZO:'ぞ',DA:'だ',DI:'ぢ',DU:'づ',DE:'で',DO:'ど',BA:'ば',BI:'び',BU:'ぶ',BE:'べ',BO:'ぼ',PA:'ぱ',PI:'ぴ',PU:'ぷ',PE:'ぺ',PO:'ぽ',NN:'ん'};
      const base = YOON_TOKENS[token] || baseMap[token];
      if(base) return base;
      const sokuonMatch = /^([A-Z])\1(Y?[AUOIE])$/.exec(token);
      if(sokuonMatch){
        const rest = token.slice(1);
        const kana = YOON_TOKENS[rest] || baseMap[rest];
        return kana ? ('っ' + kana) : '';
      }
      return '';
    }
    function setFeedback(msg, kind='info'){ els.feedback.textContent = ''; els.feedback.className = `feedback ${kind}`; }
    function clearPendingToken(){ state.pendingConsonant=''; state.pendingToken=''; state.pendingKana=''; }

    const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    function getSpeechRate(){ return IS_IOS ? 0.78 : 1.25; }
    function getSpeechGap(){ return IS_IOS ? 350 : 5; }
    function normalizeIosSpeech(text){
      let s = String(text || '');
      if (IS_IOS){
        s = s.replace(/[っッ]/g, '');
      }
      return s;
    }
    function speak(text){
      if (!state.speechEnabled || !('speechSynthesis' in window) || !text) return;
      const speakText = normalizeIosSpeech(text);
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(speakText);
      u.lang='ja-JP';
      u.rate=getSpeechRate();
      speechSynthesis.speak(u);
    }
    function speakSequence(parts){
      if (!state.speechEnabled || !('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const queue=parts.filter(Boolean).map(t=>{
        const speakText = normalizeIosSpeech(t);
        const u=new SpeechSynthesisUtterance(speakText);
        u.lang='ja-JP';
        u.rate=getSpeechRate();
        return u;
      });
      const next=()=>{
        const u=queue.shift();
        if(!u) return;
        u.onend=()=>setTimeout(next,getSpeechGap());
        speechSynthesis.speak(u);
      };
      next();
    }
    function shuffleArray(arr){ const copy=[...arr]; for(let i=copy.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]]; } return copy; }

    function tapConsonant(key, sound){
      const doubledMatch = /^([A-Z])\1$/.exec(state.pendingConsonant || '');
      const doubledBase = doubledMatch ? doubledMatch[1] : '';
      if(key==='Y' && (YOON_BASES.has(state.pendingConsonant) || (doubledBase && YOON_BASES.has(doubledBase)))){
        state.pendingConsonant = state.pendingConsonant + 'Y';
        state.pendingToken='';

        renderPractice();
        speak(sound);

      if(['K','S','T','G','Z','D','B','P','N','R','H'].includes(key) && state.pendingConsonant===key){

        state.pendingKana='っ';

    function tapVowel(key, sound, comboSound){

        token=key;

      state.pendingToken=token;
      state.pendingKana=tokenToKana(token);
      renderPractice();
      if(isSokuon){
        speak(tokenToKana(token));

      location.reload();
    });
    
    document.getElementById('clearFreeInputBtn').addEventListener('click', ()=>{ state.freeDraft=''; state.currentWord=''; state.currentTarget=''; resetInput(false); els.currentWordInput.value=''; renderPractice(); setFeedback('自由入力を消しました。', 'info'); els.currentWordInput.focus(); });
    document.getElementById('practiceSavedBtn').addEventListener('click', ()=>{ if(!state.savedWords.length){ alert('保存した単語がありません。'); return; } state.mode='practice'; renderMode(); buildPracticeList('saved'); });
    document.getElementById('exportSavedWordsBtn').addEventListener('click', ()=>{
      const rows=['group,word'];
      state.savedWords.forEach(word => rows.push(`${csvEsc('保存単語')},${csvEsc(word)}`));
      downloadFile('romaji_saved_words.csv', rows.join('\r\n'), 'text/csv;charset=utf-8', true);
    });
    document.getElementById('clearSavedBtn').addEventListener('click', ()=>{ if(!confirm('保存した単語をすべて削除しますか？')) return; state.savedWords=[]; persistSavedWords(); renderSaved(); });
    function printPracticedWords() {
      if (!state.practicedWords || !state.practicedWords.length) {
        alert('まだ練習した単語がありません。');
        return;
      }
      const today = new Date();
      const dateStr = `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;
      const win = window.open('', '_blank');
      win.document.write(`
        <html><head><title>れんしゅうした単語</title>
        <style>
          body { font-family:"BIZ UDPGothic","UD Digi Kyokasho N-R","Noto Sans JP",sans-serif; padding:20px; }
          h1 { font-size:24px; margin:0 0 8px; }
          .date { font-size:16px; margin-bottom:12px; }
          ul { font-size:20px; line-height:1.8; }
        </style>
        </head><body>
          <h1>れんしゅうした単語</h1>
          <div class="date">日付：${dateStr}</div>
          <ul>${state.practicedWords.map(w => `<li>${w.display || w.text}</li>`).join('')}</ul>
        </body></html>
      `);
      win.document.close();
      win.print();
    }
    function printFreeDoneWords() {
      if (!state.freeDoneWords || !state.freeDoneWords.length) {
        alert('まだできた単語がありません。');
        return;
      }
      const today = new Date();
      const dateStr = `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;
      const win = window.open('', '_blank');
      win.document.write(`
        <html><head><title>できた単語</title>
        <style>
          body { font-family:"BIZ UDPGothic","UD Digi Kyokasho N-R","Noto Sans JP",sans-serif; padding:20px; }
          h1 { font-size:24px; margin:0 0 8px; }
          .date { font-size:16px; margin-bottom:12px; }
          ul { font-size:20px; line-height:1.8; }
        </style>
        </head><body>
          <h1>できた単語</h1>
          <div class="date">日付：${dateStr}</div>
          <ul>${state.freeDoneWords.map(w => `<li>${w}</li>`).join('')}</ul>
        </body></html>
      `);
      win.document.close();
      win.print();
    }
    function downloadFile(name,text,type='text/plain;charset=utf-8',withBom=false){ const parts = withBom ? ['\uFEFF', text] : [text]; const blob=new Blob(parts,{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url); }
    function csvEsc(v){ const s=String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }
    function parseCSVLine(line){ const result=[]; let cur=''; let inQuotes=false; for(let i=0;i<line.length;i++){ const ch=line[i]; if(ch==='"'){ if(inQuotes && line[i+1]==='"'){ cur+='"'; i++; } else inQuotes=!inQuotes; } else if(ch===',' && !inQuotes){ result.push(cur); cur=''; } else cur+=ch; } result.push(cur); return result; }
    document.getElementById('exportWordsBtn').addEventListener('click', ()=>{
      const rows=['group,word,source'];
      Object.entries(state.allWords).forEach(([group, words])=>words.forEach(word=>rows.push(`${csvEsc(group)},${csvEsc(getWordKana(word))},default`)));
      state.savedWords.forEach(word=>rows.push(`${csvEsc('保存単語')},${csvEsc(word)},free_saved`));
      downloadFile('romaji_words.csv', rows.join('\r\n'), 'text/csv;charset=utf-8', true);
    });
    document.getElementById('exportHistoryBtn').addEventListener('click', ()=>{ const rows=['date,group,word,target,input,result']; state.history.forEach(h=>rows.push(`${csvEsc(h.date)},${csvEsc(h.group)},${csvEsc(h.word)},${csvEsc(h.target)},${csvEsc(h.input)},${csvEsc(h.result)}`)); downloadFile('romaji_history.csv', rows.join('\r\n'), 'text/csv;charset=utf-8', true); });
    els.csvInput.addEventListener('change', async e=>{
      const file=e.target.files?.[0];
      if(!file) return;
      const text=await file.text();
      const normalized = text.replace(/^\uFEFF/, '');
      const lines=normalized.split(/\r?\n/).filter(Boolean);
      if(!lines.length) return;
      const start=lines[0].toLowerCase().includes('group') ? 1 : 0;
      let added=0;
      let savedAdded=0;
      for(let i=start;i<lines.length;i++){
        const cols=parseCSVLine(lines[i]);
        if(cols.length<2) continue;
        const group=(cols[0] || '').trim() || '読み込み';
        const word=sanitizeHiragana((cols[1] || '').trim());
        const source=(cols[2] || '').trim().toLowerCase();
        if(!word || !toRomaji(word)) continue;
        const isSavedWord = source === 'free_saved' || source === 'user' || group === '保存単語';
        if(isSavedWord){
          if(!state.savedWords.includes(word)){
            state.savedWords.push(word);
            savedAdded++;
          }
          continue;
        }
        if(!state.allWords[group]) state.allWords[group]=[];
        state.allWords[group].push(word);
        added++;
      }
      if(savedAdded) persistSavedWords();
      if(added || savedAdded){
        alert(`${added + savedAdded}語を読み込みました。`);
        renderGroups();
        renderSaved();
        document.getElementById('backToStartBtn').addEventListener('click', ()=>{ state.freeDoneWords = []; try { persistFreeDoneWords(); } catch(e) {} location.reload(); });
    buildPracticeList('groups');
      } else {
        alert('読み込める単語がありませんでした。');
      }
      e.target.value='';
    });

    els.savedCsvInput.addEventListener('change', async e=>{
      const file=e.target.files?.[0];
      if(!file) return;
      const text=await file.text();
      const normalized = text.replace(/^\uFEFF/, '');
      const lines=normalized.split(/\r?\n/).filter(Boolean);
      if(!lines.length) return;
      const header = (lines[0] || '').toLowerCase();
      const start = (header.includes('group') || header.includes('word')) ? 1 : 0;
      let savedAdded=0;
      for(let i=start;i<lines.length;i++){
        const cols=parseCSVLine(lines[i]);
        let word='';
        if(cols.length >= 2){
          word = sanitizeHiragana((cols[1] || '').trim());
        } else if(cols.length === 1){
          word = sanitizeHiragana((cols[0] || '').trim());
        }
        if(!word || !toRomaji(word)) continue;
        if(!state.savedWords.includes(word)){
          state.savedWords.push(word);
          savedAdded++;
        }
      }
      if(savedAdded){
        persistSavedWords();
        renderSaved();
        alert(`${savedAdded}語を保存単語に読み込みました。`);
      } else {
        alert('読み込める保存単語がありませんでした。');
      }
      e.target.value='';
    });

    els.toggleCaseBtn.textContent = state.letterCase === 'upper' ? '大文字表示' : '小文字表示';
    els.toggleDisplayModeBtn.textContent = state.displayMode === 'kanji_kana' ? '漢字＋(かな)' : 'ひらがな';
    renderPracticedCount();
    els.toggleGuideBtn.textContent = `カタカナ表示 ${state.showConsonantGuide ? 'ON' : 'OFF'}`;
    els.toggleExtendedBtn.textContent = `GZDBP ${state.showExtendedConsonants ? 'ON' : 'OFF'}`;
    document.getElementById('startPracticeBtn').addEventListener('click', ()=>{ state.mode='practice'; state.practiceStarted = true; state.practicedWords = []; renderMode(); renderPracticedCount(); });
    document.getElementById('printPracticedBtn').addEventListener('click', printPracticedWords);
    document.getElementById('backToStartBtn').addEventListener('click', ()=>{ state.freeDoneWords = []; try { persistFreeDoneWords(); } catch(e) {} location.reload(); });
    renderMode(); renderGroups(); renderSaved(); renderKeyboard(); buildPracticeList('groups');
  </script>
</body>
</html>
