<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>語義推測 問題アプリ</title>
  <style>
    :root {
      --bg:#ffffff; --fg:#111; --muted:#666; --line:#e6e6e6; --card:#fafafa; --accent:#3B2C5A;
    }
    html, body { height: 100%; 
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family:
        "UDデジタル教科書体N",
        "UDデジタル教科書体NK",
        "UDデジタル教科書体NP",
        "UDデジタル教科書体N-R",
        "UDデジタル教科書体NK-R",
        "UD デジタル 教科書体 N",
        "UD デジタル 教科書体 NK",
        "UD デジタル 教科書体 NP",
        "UD デジタル 教科書体 N-R",
        "UD デジタル 教科書体 NK-R",
        "BIZ UDゴシック",
        "Noto Sans JP",
        system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      line-height: 1.6;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 18px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    h1 { font-size: 18px; margin: 0; }
    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--fg);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .pill {
      display:inline-flex; gap:8px; align-items:center;
      border: 1px solid var(--line);
      background: #fff;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
    }
    input[type="text"], select {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      min-width: 220px;
      background: #fff;
    }
    .muted { color: var(--muted); font-size: 13px; }
    .divider { height:1px; background: var(--line); margin: 14px 0; }
    .grid { display:grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 880px) {
      .grid.two { grid-template-columns: 1fr 1fr; }
    }
    .card {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
    }
    .list { max-height: 52vh; overflow:auto; background:#fff; border:1px solid var(--line); border-radius: 14px; }
    .item {
      display:flex; gap:10px; align-items:flex-start;
      padding: 10px 12px; border-bottom:1px solid var(--line);
    }
    .item:last-child { border-bottom:none; }
    .item .meta { font-size: 12px; color: var(--muted); }
    .badge { font-size: 12px; border:1px solid var(--line); padding: 2px 8px; border-radius: 999px; background:#fff; }
    .target { font-weight: 800; text-decoration: underline; text-decoration-thickness: 2px; }
    .qtitle { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
    .qno { font-size: 13px; color: var(--muted); }
    .sentence { font-size: 18px; padding: 10px 0 6px 0; display:flex; gap:10px; align-items:flex-start; }
    .seqNo{ font-size: inherit; font-weight: 700; line-height: 1.6; }
    .opts { display:grid; grid-template-columns: 1fr; gap: 8px; margin-top: 6px; }
    .opt {
      display:flex; gap:10px; align-items:flex-start;
      background:#fff; border:1px solid var(--line); border-radius: 12px;
      padding: 10px 12px;
    }
    .opt input { transform: translateY(3px); }
    .opt label { flex: 1; cursor:pointer; }
    .answerBox{display:none;}
    .answerBox.show { display:block; }
        
    .modalBackdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      display:none;
      align-items:center; justify-content:center;
      padding: 18px;
      z-index: 50;
    }
    .modalBackdrop.show { display:flex; }
    .modal {
      width: min(520px, 100%);
      background:#fff;
      border:1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,.2);
    }
    .modal h2 { margin: 0 0 10px 0; font-size: 16px; }
    .field { display:flex; justify-content:space-between; gap:10px; align-items:center; padding: 10px 0; }
    .field + .field { border-top:1px solid var(--line); }
    .seg { display:inline-flex; border:1px solid var(--line); border-radius: 999px; overflow:hidden; }
    .seg button{
      border:none; background:#fff; padding: 8px 10px; cursor:pointer; font-size: 13px;
    }
    .seg button.active { background: var(--accent); color:#fff; }
    .notice { background:#fff; border:1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
    .selItem{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid var(--line);}
    .selItem:first-child{border-top:none;}
    .selMeta{color:var(--muted); font-size:12px;}
    .miniBtn{border:1px solid var(--line); background:#fff; border-radius:10px; padding:6px 8px; font-size:12px; cursor:pointer;}
    .pageBreak{ height:0; }

    .pageBreak{ break-before: page; page-break-before: always; }
      body { background:#fff; font-size: 13px; line-height: 1.34; }
      .wrap { max-width: none; padding: 0; }
      .grid { gap: 6px; }
      .card { break-inside: avoid; padding: 8px; }
      .qtitle { margin-bottom: 2px; }
      .qtitle strong { font-size: 14px; }
      .qno { font-size: 12px; }
      .sentence { font-size: 17px; padding: 4px 0 3px 0; }
      .opts { gap: 5px; margin-top: 4px; }
      .opt { padding: 5px 7px; }
      .opt label { font-size: 14px; line-height: 1.28; }
      ruby rt { font-size: 0.50em; }
      /* keep 5 questions on 1 page */
      }
    ruby rt { font-size: 0.60em; }
      /* keep 5 questions on 1 page */
      }
    ruby rt { font-size: 0.55em; }
    }
    ruby rt { font-size: 0.55em; color: var(--muted); }
  
.answerBox{display:none;}


#btnPrint{display:none !important;}

/* === ANSWER BOX (FINAL) === */
.answerBox{display:none;}
.answerBox.show{display:block !important;}

  .qtitle { margin-bottom: 2px !important; }

  .sentence {
    font-size: 20px !important;
    padding: 4px 0 3px 0 !important;
  }

  .opts { gap: 6px !important; margin-top: 5px !important; }

  .opt label { font-size: 16px !important; line-height: 1.25 !important; }

  .answerBox { display:none !important; }

/* === PRINT FINAL CLEAN (5 questions per page) === */
@page { size: A4 portrait; margin: 6mm; }

@media print {
  .noPrint { display:none !important; }

  html, body { height:auto !important; margin:0 !important; }

  body{
    background:#fff !important;
    font-size:16px !important;
    line-height:1.30 !important;
  }

  .wrap{ max-width:none !important; padding:0 !important; margin:0 !important; }

  /* Force page break exactly where JS inserts it (every 5 cards) */
  .pageBreak{
    break-before: page !important;
    page-break-before: always !important;
    display:block !important;
    height:0 !important;
    margin:0 !important;
    padding:0 !important;
  }

  .grid{ gap:4px !important; }

  .card{
    break-inside:avoid;
    page-break-inside:avoid;
    padding:6px !important;
    margin:0 0 6px 0 !important;
  }

  .qtitle{ margin-bottom:1px !important; }
  .qtitle strong{ font-size:16px !important; }
  .qno{ font-size:12px !important; }

  .sentence{
    font-size:19px !important;
    padding:3px 0 2px 0 !important;
  }

  .opts{ gap:4px !important; margin-top:3px !important; }
  .opt{ padding:5px 7px !important; }
  .opt label{
    font-size:15px !important;
    line-height:1.22 !important;
  }

  ruby rt{ font-size:0.55em !important; }

  /* Answer UI never affects print layout */
  .answerBox{ display:none !important; }
}


/* === SCREEN LAYOUT CENTERED === */
@media screen {
  body {
    background: #f5f5f7;
  }
  .wrap {
    max-width: 900px !important;
    margin: 0 auto !important;
    padding: 24px !important;
    background: #ffffff;
  }
}

<body>
  <div class="wrap">
    <header class="noPrint">
      <div>
        <h1>語義推測 問題アプリ</h1>
        <div class="muted">線が引かれている言葉の意味をえらんでください</div>
      </div>
      <div class="row">
        <button class="btn" id="btnSettings">設定</button>
        <button class="btn" id="btnGoHome" style="display:none;">トップへ</button>
      </div>
    </header>

    <div class="divider noPrint"></div>

    <section id="home" class="noPrint">
      <div class="grid two">
        <div class="card">
          <div class="row" style="justify-content:space-between;">
            <div class="pill">
              <strong>選び方</strong>
              <span class="muted" id="modeHint">連続（開始から指定数）</span>
            </div>
            <div class="seg" aria-label="mode">
              <button id="modeSeq" class="active" type="button">連続</button>
              <button id="modePick" type="button">ピックアップ</button>
            </div>
          </div>

          <div style="height:10px;"></div>

          <div id="seqControls">
            <div class="row">
              <label class="muted" for="seqStart">開始</label>
              <select id="seqStart"></select>
              <label class="muted" for="seqCount" style="margin-left:6px;">数</label>
              <select id="seqCount" style="min-width:90px;"></select>
              <span class="badge" id="selectedCountBadge">0</span>
            </div>
            <div class="muted" style="margin-top:6px;">開始からID順に指定数を自動選択します。</div>
          </div>

          <div id="pickControls" style="display:none;">
            <div class="row" style="justify-content:space-between;">
              <div class="muted">一覧から選んでください。</div>
              <span class="badge" id="selectedCountBadge2">0</span>
            </div>
          </div>

          <div style="height:12px;"></div>

          <div class="row">
            <input id="search" type="text" placeholder="検索：漢字／熟語／問題番号（例：G1-001）" />
            <button class="btn" id="btnReset">選択をリセット</button>
          </div>

          <div style="height:12px;"></div>

          <div class="row">
            <button class="btn primary" id="btnStart" disabled>問題をはじめる</button>
            
          </div>

          <div style="height:12px;"></div>
          <div class="notice" id="selectedBox">
            <div class="row" style="justify-content:space-between; align-items:baseline;">
              <strong>選択中の問題</strong>
              <span class="badge" id="selectedCountBadge3">0</span>
            </div>
            <div id="selectedList" class="muted" style="margin-top:8px;"></div>
          </div>

          <div style="height:10px;"></div>
          <div class="row noPrint" style="align-items:center; gap:10px;">
            <label class="muted" style="display:flex; align-items:center; gap:6px; user-select:none;">
              <input type="checkbox" id="teacherModeToggle" />
              先生モード（セットJSON書き出し）
            </label>
          </div>

          <div style="height:10px;"></div>

          <div class="notice noPrint" id="teacherPanel" style="display:none;">
            <div class="row" style="justify-content:space-between; align-items:baseline;">
              <strong>セットJSONを書き出す</strong>
              <span class="badge" id="teacherSelectedCount">0</span>
            </div>

            <div style="height:10px;"></div>

            <div class="row" style="gap:10px; flex-wrap:wrap;">
              <div style="flex:1; min-width:220px;">
                <div class="muted" style="font-size:12px;">タイトル（任意）</div>
                <input id="setTitle" type="text" placeholder="例：生徒001 3月課題" />
              </div>
              <div style="width:240px; min-width:200px;">
                <div class="muted" style="font-size:12px;">ファイル名</div>
                <input id="setFileName" type="text" value="student-001.json" />
              </div>
            </div>

            <div style="height:10px;"></div>

            <div class="row" style="gap:10px; flex-wrap:wrap;">
              <button class="btn primary" id="btnExportSet" disabled>JSONを書き出す（ダウンロード）</button>
              <div class="muted" style="font-size:12px;">※「選択中の問題」をそのままIDsとして保存します。</div>
            </div>
          </div>

</div>

        <div class="card">
          <div class="row" style="justify-content:space-between; align-items:baseline;">
            <div>
              <strong>問題一覧</strong>
              <div class="muted">検索に一致した問題が表示されます。</div>
            </div>
            <span class="badge" id="listCount">0件</span>
          </div>
          <div style="height:10px;"></div>
          <div class="list" id="list"></div>
        </div>
      </div>
    </section>

    <section id="quiz" style="display:none;">
      <div class="row noPrint" style="justify-content:space-between; margin: 10px 0;">
        <div class="pill">
          <strong>選択中</strong>
          <span id="quizSetLabel" class="muted"></span>
        </div>
        <div class="row">
          <button class="btn" id="btnStopSpeech" disabled>読み上げ停止</button>
          <button class="btn" id="btnPrint2">A4で印刷</button>
        </div>
      </div>

      <div id="quizCards" class="grid"></div>
    </section>
  </div>

  <div class="modalBackdrop" id="settingsBackdrop" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <h2 id="settingsTitle">設定</h2>
        <button class="btn" id="btnCloseSettings">閉じる</button>
      </div>

      <div class="field">
        <div>
          <strong>答えの表示</strong>
          <div class="muted">有：問題画面で「答えを見る」を表示</div>
        </div>
        <div class="seg" aria-label="answer setting">
          <button type="button" id="ansOn">有</button>
          <button type="button" id="ansOff">無</button>
        </div>
      </div>

      <div class="field">
        <div>
          <strong>ルビ</strong>
          <div class="muted">有：漢字部分だけに、ひらがな例文（列D）の読みでルビを付けます</div>
        </div>
        <div class="seg" aria-label="ruby setting">
          <button type="button" id="rubyOn">有</button>
          <button type="button" id="rubyOff">無</button>
        </div>
      </div>

      <div class="field">
        <div>
          <strong>読み上げ速度</strong>
          <div class="muted">端末によって差があります</div>
        </div>
        <select id="rate">
          <option value="0.9">0.9</option>
          <option value="1.0" selected>1.0</option>
          <option value="1.1">1.1</option>
          <option value="1.2">1.2</option>
        </select>
      </div>

      <div class="muted" style="margin-top:10px;">
        ※設定はこの端末に保存されます。
      </div>
    </div>

// ===== Subset (student-specific) support =====
// If URL has:
//   ?ids=G1-001,G1-005,...  -> use only those IDs
//   ?set=student-001       -> fetch ./sets/student-001.json and use its ids
// Options:
//   &autostart=0  -> do not auto-start quiz (stay on home)
//   &home=1       -> alias of autostart=0
let ACTIVE_QUESTIONS = QUESTIONS;
let ACTIVE_SET_LABEL = "";

function parseIdsParam(raw) {
  if (!raw) return [];
  return raw.split(/[,\s]+/).map(s => (s ?? "").toString().trim()).filter(Boolean);
}

async function applyUrlSetIfAny() {
  const sp = new URLSearchParams(location.search);
  const idsParam = sp.get("ids");
  const setName = sp.get("set");

  let ids = [];
  let label = "";

  const isStudent = !!setName;

  if (setName) {
    try {
      const res = await fetch(`sets/${encodeURIComponent(setName)}.json`, { cache: "no-store" });
      if (res.ok) {
        const obj = await res.json();
        if (Array.isArray(obj.ids)) ids = obj.ids.map(x => (x ?? "").toString().trim()).filter(Boolean);
        if (typeof obj.title === "string") label = obj.title.trim();
        // NOTE: student set uses all questions by default, so we intentionally ignore obj.maxSelect here.
      }
    } catch {}
  }

  if (!ids.length && idsParam) {
    ids = parseIdsParam(idsParam);
    label = "指定セット";
  }

  if (!ids.length) return { applied: false, ids: [], isStudent: false };

  // Filter (keep order as given in ids)
  const byId = new Map(QUESTIONS.map(q => [(q[COL.id] ?? "").toString(), q]));
  const picked = [];
  ids.forEach(id => { if (byId.has(id)) picked.push(byId.get(id)); });
  // If some IDs were invalid, silently ignore them.
  if (!picked.length) return { applied: false, ids: [], isStudent: false };

  ACTIVE_QUESTIONS = picked;
  ACTIVE_SET_LABEL = label || setName || "";

  if (isStudent) {
    // Student set: lock to sequential mode + auto-select ALL questions.
    state.mode = "seq";
    state.selectedIds = new Set(); // will be filled by renderSeqDropdown() (first ID + maxSelect)
    state.maxSelect = picked.length;
    return { applied: true, ids: picked.map(q => (q[COL.id] ?? "").toString()), isStudent: true };
  }

  // Non-student subset (ids=...): keep old behavior (pick)
  state.mode = "pick";
  state.selectedIds = new Set(picked.map(q => (q[COL.id] ?? "").toString()));
  if (!Number.isFinite(state.maxSelect) || state.maxSelect < 1) state.maxSelect = picked.length;
  if (state.maxSelect > picked.length) state.maxSelect = picked.length;

  return { applied: true, ids: [...state.selectedIds], isStudent: false };
}

  c2k: "選択肢2_ひらがな",
  c3: "選択肢3",
  c3k: "選択肢3_ひらがな",
  ans: "正解",
};

const $ = (sel) => document.querySelector(sel);


const state = {
  mode: "seq", // seq | pick
  selectedIds: new Set(),
  maxSelect: 5,
  settings: {
    showAnswer: true,
    ruby: false,
    rate: 1.0,
  },
};

function loadSettings() {
  try {
    const raw = localStorage.getItem("gogi_settings_v1");
    if (!raw) return;
    const obj = JSON.parse(raw);
    if (typeof obj.showAnswer === "boolean") state.settings.showAnswer = obj.showAnswer;
    if (typeof obj.ruby === "boolean") state.settings.ruby = obj.ruby;
    if (typeof obj.rate === "number") state.settings.rate = obj.rate;
    if (typeof obj.maxSelect === "number" && obj.maxSelect >= 1) state.maxSelect = Math.floor(obj.maxSelect);
  } catch {}
}

function saveSettings() {
  const payload = { ...state.settings, maxSelect: state.maxSelect };
  localStorage.setItem("gogi_settings_v1", JSON.stringify(payload));
}

function normalize(str) {
  return (str ?? "").toString().trim().toLowerCase();
}

function isKanji(ch) {
  if (!ch) return false;
  const code = ch.codePointAt(0);
  return (code >= 0x4E00 && code <= 0x9FFF) || (code >= 0x3400 && code <= 0x4DBF);
}

function isKana(ch) {
  if (!ch) return false;
  const code = ch.codePointAt(0);
  return (code >= 0x3040 && code <= 0x309F) || (code >= 0x30A0 && code <= 0x30FF);
}

function toHiragana(ch) {
  if (!ch) return ch;
  const code = ch.codePointAt(0);
  if (code >= 0x30A1 && code <= 0x30F6) return String.fromCodePoint(code - 0x60);
  return ch;
}

function isIgnorable(ch) {
  return /[\s　、。．・，,.!?！？「」『』（）()\[\]【】…—ー]/.test(ch);
}

function escapeHTML(s) {
  return (s ?? "").toString()
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeRegExp(s) {
  return (s ?? "").toString().replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

/**
 * Ruby generation (heuristic):
 * - mixed: kanji+kana sentence (列C)
 * - kana: full hiragana reading sentence (列D)
 * - attaches ruby only to kanji blocks, using kana substring aligned to next anchor character.
 */
function buildRubyHTML(mixed, kana) {
  // Ruby exceptions for ambiguous anchors (e.g., "安心した" where the next anchor "し" appears inside the reading).
  const RUBY_EXCEPT = {
    "安心": "あんしん",
    "指定": "してい",
    "集合": "しゅうごう",
    "祝福": "しゅくふく",
    "毎日": "まいにち",
    "進歩": "しんぽ",
    "脳": "のう",
    "野菜": "やさい",
    "使用": "しよう",
    "次々": "つぎつぎ",
    "庭": "にわ",
    "植物": "しょくぶつ",

    "上手": "じょうず",
    "建物": "たてもの",
    "上": "うえ",
    "練習": "れんしゅう",
    "次": "つぎ",
    "次々": "つぎつぎ",
    "毎朝": "まいあさ",
    "入学式": "にゅうがくしき",
    "行": "おこな",
    "電流": "でんりゅう",
    "米": "こめ"
  };

  const FULL_RUBY_EXCEPT = {
    "庭に植物がある":
      `<ruby>庭<rt>にわ</rt></ruby>に<ruby>植物<rt>しょくぶつ</rt></ruby>がある`,
    "次々に発生している":
      `<ruby>次々<rt>つぎつぎ</rt></ruby>に<ruby>発生<rt>はっせい</rt></ruby>している`,
    "この機械を使用する":
      `この<ruby>機械<rt>きかい</rt></ruby>を<ruby>使用<rt>しよう</rt></ruby>する`,

    "もっと上手になりたいという向上心を持っている。": `もっと<ruby>上手<rt>じょうず</rt></ruby>になりたいという<ruby>向上心<rt>こうじょうしん</rt></ruby>を<ruby>持<rt>も</rt></ruby>っている。`,
    "先生が「ここに集まりなさい」と場所を指定した。": `<ruby>先生<rt>せんせい</rt></ruby>が「ここに<ruby>集<rt>あつ</rt></ruby>まりなさい」と<ruby>場所<rt>ばしょ</rt></ruby>を<ruby>指定<rt>してい</rt></ruby>した。`,
    "時間になってみんなが集合した。": `<ruby>時間<rt>じかん</rt></ruby>になってみんなが<ruby>集合<rt>しゅうごう</rt></ruby>した。`,
    "みんなでふたりの結婚を祝福した。": `みんなでふたりの<ruby>結婚<rt>けっこん</rt></ruby>を<ruby>祝福<rt>しゅくふく</rt></ruby>した。`,
    "毎日練習して少しずつ進歩している。": `<ruby>毎日<rt>まいにち</rt></ruby><ruby>練習<rt>れんしゅう</rt></ruby>して<ruby>少<rt>すこ</rt></ruby>しずつ<ruby>進歩<rt>しんぽ</rt></ruby>している。`,
    "今年に入って、鉄道事故が次々に発生している。": `<ruby>今年<rt>ことし</rt></ruby>に<ruby>入<rt>はい</rt></ruby>って、<ruby>鉄道事故<rt>てつどうじこ</rt></ruby>が<ruby>次々<rt>つぎつぎ</rt></ruby>に<ruby>発生<rt>はっせい</rt></ruby>している。`,
    "毎朝、同じ時間に学校へ登校している。": `<ruby>毎朝<rt>まいあさ</rt></ruby>、<ruby>同<rt>おな</rt></ruby>じ<ruby>時間<rt>じかん</rt></ruby>に<ruby>学校<rt>がっこう</rt></ruby>へ<ruby>登校<rt>とうこう</rt></ruby>している。`,
    "春に入学式が行われた。": `<ruby>春<rt>はる</rt></ruby>に<ruby>入学式<rt>にゅうがくしき</rt></ruby>が<ruby>行<rt>おこな</rt></ruby>われた。`,
    "病院で脳波をはかって調べた。": `<ruby>病院<rt>びょういん</rt></ruby>で<ruby>脳波<rt>のうは</rt></ruby>をはかって<ruby>調<rt>しら</rt></ruby>べた。`,
    "脳の電流": `<ruby>脳<rt>のう</rt></ruby>の<ruby>電流<rt>でんりゅう</rt></ruby>`,
    "野菜や米を作る仕事": `<ruby>野菜<rt>やさい</rt></ruby>や<ruby>米<rt>こめ</rt></ruby>を<ruby>作<rt>つく</rt></ruby>る<ruby>仕事<rt>しごと</rt></ruby>`,
    "建物の中": `<ruby>建物<rt>たてもの</rt></ruby>の<ruby>中<rt>なか</rt></ruby>`,
    "建物のいちばん上の外": `<ruby>建物<rt>たてもの</rt></ruby>のいちばん<ruby>上<rt>うえ</rt></ruby>の<ruby>外<rt>そと</rt></ruby>`,
    "建物の上": `<ruby>建物<rt>たてもの</rt></ruby>の<ruby>上<rt>うえ</rt></ruby>`,
    "ピアノがうまくなりたくて、毎日同じ曲を何度もひいて練習をしている。": `ピアノがうまくなりたくて、<ruby>毎日<rt>まいにち</rt></ruby><ruby>同<rt>おな</rt></ruby>じ<ruby>曲<rt>きょく</rt></ruby>を<ruby>何度<rt>なんど</rt></ruby>もひいて<ruby>練習<rt>れんしゅう</rt></ruby>をしている。`
  };

  mixed = (mixed ?? "").toString();
  kana = (kana ?? "").toString();
  if (FULL_RUBY_EXCEPT[mixed]) return FULL_RUBY_EXCEPT[mixed];

  let i = 0;
  let j = 0;
  let out = "";

  function skipKanaIgnorables() {
    while (j < kana.length && isIgnorable(kana[j])) j++;
  }
  function flushMixedIgnorables() {
    while (i < mixed.length && isIgnorable(mixed[i])) {
      out += escapeHTML(mixed[i]);
      i++;
    }
  }

  while (i < mixed.length) {
    flushMixedIgnorables();
    skipKanaIgnorables();
    if (i >= mixed.length) break;

    const ch = mixed[i];

    if (!isKanji(ch)) {
      out += escapeHTML(ch);
      if (j < kana.length) {
        const h = toHiragana(ch);
        // If this char is kana, advance j to the next matching kana to keep alignment.
        if (isKana(ch)) {
          // skip ignorables
          while (j < kana.length && isIgnorable(kana[j])) j++;
          const idx = kana.indexOf(h, j);
          if (idx >= 0) j = idx + 1;
        } else {
          if (kana[j] === ch || kana[j] === h) j++;
        }
      }
      i++;
      continue;
    }

    // kanji block
    const kStart = i;
    while (i < mixed.length && isKanji(mixed[i])) i++;
    const kanjiBlock = mixed.slice(kStart, i);

    // next anchor: next non-kanji, non-ignorable char in mixed
    let a = i;
    while (a < mixed.length && (isKanji(mixed[a]) || isIgnorable(mixed[a]))) a++;
    const nextAnchor = a < mixed.length ? mixed[a] : null;

    // Exception: if this kanji block has a fixed reading, consume it directly.
    if (RUBY_EXCEPT[kanjiBlock]) {
      let jj = j;
      while (jj < kana.length && isIgnorable(kana[jj])) jj++;
      j = jj;
      const fixed = RUBY_EXCEPT[kanjiBlock];
      if (kana.slice(j, j + fixed.length) === fixed) {
        j += fixed.length;
        out += `<ruby>${escapeHTML(kanjiBlock)}<rt>${escapeHTML(fixed)}</rt></ruby>`;
        continue;
      }
    }

    let reading = "";
    if (nextAnchor) {
      let j2 = j;
      while (j2 < kana.length && isIgnorable(kana[j2])) j2++;
      const stop = kana.indexOf(toHiragana(nextAnchor), j2);
      if (stop >= 0) {
        reading = kana.slice(j, stop);
        j = stop;
      } else {
        reading = kana.slice(j);
        j = kana.length;
      }
    } else {
      reading = kana.slice(j);
      j = kana.length;
    }

    reading = reading.replace(/[\s　]/g, "");
    out += `<ruby>${escapeHTML(kanjiBlock)}<rt>${escapeHTML(reading)}</rt></ruby>`;
  }

  return out;
}

function highlightTargetInRubyHTML(rubyHtml, target) {
  target = (target ?? "").toString();
  if (!target) return rubyHtml;

  const re = new RegExp(`<ruby>${escapeRegExp(escapeHTML(target))}<rt>(.*?)<\/rt><\/ruby>`, "g");
  const replaced = rubyHtml.replace(re, (m, rt) => `<ruby><span class="target">${escapeHTML(target)}</span><rt>${rt}</rt></ruby>`);
  if (replaced !== rubyHtml) return replaced;

  // Try to match a target that spans multiple ruby blocks (e.g., 春分の日 = <ruby>春分</ruby>の<ruby>日</ruby>)
  try {
    const tokens = [];
    let buf = "";
    let mode = null; // "kanji" | "other"
    for (const ch of target) {
      const isK = isKanji(ch);
      const m2 = isK ? "kanji" : "other";
      if (mode === null) {
        mode = m2;
        buf = ch;
      } else if (mode === m2) {
        buf += ch;
      } else {
        tokens.push({ mode, text: buf });
        mode = m2;
        buf = ch;
      }
    }
    if (buf) tokens.push({ mode, text: buf });

    if (tokens.length > 1) {
      const parts = tokens.map(t => {
        if (t.mode === "kanji") {
          return `<ruby>${escapeRegExp(escapeHTML(t.text))}<rt>.*?<\\/rt><\\/ruby>`;
        }
        return escapeRegExp(escapeHTML(t.text));
      });
      const seqRe = new RegExp(parts.join(""), "g");
      const wrapped = rubyHtml.replace(seqRe, m => `<span class="target">${m}</span>`);
      if (wrapped !== rubyHtml) return wrapped;
    }
  } catch (e) {
    // ignore
  }

  // fallback (plain text)
  return rubyHtml.replaceAll(escapeHTML(target), `<span class="target">${escapeHTML(target)}</span>`);
}

function formatChoice(text, kana) {
  const t = (text ?? "").toString();
  const k = (kana ?? "").toString();
  if (!state.settings.ruby) return escapeHTML(t);
  return buildRubyHTML(t, k);
}

function formatSentence(q) {
  const mixed = (q[COL.sentence] ?? "").toString();
  const kana = (q[COL.sentenceKana] ?? "").toString();
  const target = (q[COL.word] ?? "").toString();

  if (state.settings.ruby) {
    const rubyHtml = buildRubyHTML(mixed, kana);
    return highlightTargetInRubyHTML(rubyHtml, target);
  }

  // no ruby
  if (!target) return escapeHTML(mixed);
  const idx = mixed.indexOf(target);
  if (idx < 0) return escapeHTML(mixed);
  const before = escapeHTML(mixed.slice(0, idx));
  const mid = escapeHTML(mixed.slice(idx, idx + target.length));
  const after = escapeHTML(mixed.slice(idx + target.length));
  return `${before}<span class="target">${mid}</span>${after}`;
}

function getAllIdsSorted() {
  const parse = (id) => {
    const m = (id ?? "").toString().match(/^(.*?)-(\d+)/);
    if (!m) return { prefix: (id ?? "").toString(), num: 0 };
    return { prefix: m[1], num: parseInt(m[2], 10) };
  };
  return [...new Set(ACTIVE_QUESTIONS.map(q => q[COL.id]))].sort((a,b)=>{
    const pa = parse(a), pb = parse(b);
    if (pa.prefix !== pb.prefix) return pa.prefix.localeCompare(pb.prefix, "ja");
    return pa.num - pb.num;
  });
}

function filterQuestions(query) {
  const q = normalize(query);
  if (!q) return ACTIVE_QUESTIONS;
  return ACTIVE_QUESTIONS.filter(row => {
    const id = normalize(row[COL.id]);
    const word = normalize(row[COL.word]);
    const sent = normalize(row[COL.sentence]);
    return id.includes(q) || word.includes(q) || sent.includes(q);
  });
}

function updateSelectedUI() {
  const c = state.selectedIds.size;
  const max = state.maxSelect;
  $("#selectedCountBadge").textContent = `${c}/${max}`;
  $("#selectedCountBadge2").textContent = `${c}/${max}`;
  $("#btnStart").disabled = c === 0;
  const bp = document.getElementById("btnPrint");
  if (bp) bp.disabled = c === 0;
  const b3 = document.getElementById("selectedCountBadge3");
  if (b3) b3.textContent = `${c}/${max}`;
  updateSelectedList();
  updateTeacherPanel();
}

function updateSelectedList() {
  const box = document.getElementById("selectedList");
  if (!box) return;
  const picked = getSelectedQuestions();
  if (!picked.length) {
    box.innerHTML = '<span class="muted">（未選択）</span>';
    return;
  }
  box.innerHTML = picked.map(q => {
    const id = escapeHTML(q[COL.id] ?? "");
    const word = escapeHTML(q[COL.word] ?? "");
    const removable = (state.mode === "pick") ? `<button class="miniBtn" data-rm="${id}">外す</button>` : "";
    return `<div class="selItem"><div><div><strong>${word}</strong> <span class="selMeta">（${id}）</span></div></div>${removable}</div>`;
  }).join("");
  if (state.mode === "pick") {
    box.querySelectorAll("[data-rm]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-rm");
        state.selectedIds.delete(id);
        updateSelectedUI();
        renderList();
      });
    });
  }
}


function normalizeJsonFileName(name) {
  const n = (name || "").trim();
  if (!n) return "set.json";
  return n.toLowerCase().endsWith(".json") ? n : (n + ".json");
}

function buildSetJsonFromSelection() {
  const title = ((document.getElementById("setTitle") ? document.getElementById("setTitle").value : "") || "").trim();
  const ids = Array.from(state.selectedIds).map(x => x.toString());
  ids.sort((a,b) => a.localeCompare(b, "ja"));
  const payload = { version: 1, title: title || "", ids };
  return payload;
}

function downloadJson(filename, obj) {
  const data = JSON.stringify(obj, null, 2);
  const blob = new Blob([data], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function updateTeacherPanel() {
  const toggle = document.getElementById("teacherModeToggle");
  const panel = document.getElementById("teacherPanel");
  if (!toggle || !panel) return;

  panel.style.display = toggle.checked ? "" : "none";

  const countEl = document.getElementById("teacherSelectedCount");
  if (countEl) countEl.textContent = `${state.selectedIds.size}`;

  const btn = document.getElementById("btnExportSet");
  if (btn) btn.disabled = !toggle.checked || state.selectedIds.size === 0;
}



function renderSeqDropdown() {
  const ids = getAllIdsSorted();
  const sel = $("#seqStart");
  sel.innerHTML = ids.map(id => `<option value="${escapeHTML(id)}">${escapeHTML(id)}</option>`).join("");

  const cnt = $("#seqCount");
  const maxOpt = Math.max(1, Math.min(ids.length, 500));
  cnt.innerHTML = Array.from({length: maxOpt}, (_, i) => {
    const v = i + 1;
    return `<option value="${v}">${v}問</option>`;
  }).join("");
  cnt.value = String(Math.min(state.maxSelect, maxOpt));
  state.maxSelect = Number(cnt.value) || 5;
  cnt.addEventListener("change", () => {
    state.maxSelect = Number(cnt.value) || 5;
    saveSettings();
    // Re-apply selection rules
    if (state.mode === "seq") {
      selectSeqStart(sel.value);
    } else {
      // Trim selection if over the new max
      if (state.selectedIds.size > state.maxSelect) {
        const keep = new Set(Array.from(state.selectedIds).slice(0, state.maxSelect));
        state.selectedIds = keep;
      }
      updateSelectedUI();
      renderList();
    }
    $("#modeHint").textContent = state.mode === "seq" ? `連続（開始から${state.maxSelect}問）` : `自由に最大${state.maxSelect}問ピックアップ`;
  });

  sel.addEventListener("change", () => selectSeqStart(sel.value));
  if (ids.length) {
    sel.value = ids[0];
    selectSeqStart(ids[0]);
  }
}

function setMode(mode) {
  state.mode = mode;
  $("#modeSeq").classList.toggle("active", mode === "seq");
  $("#modePick").classList.toggle("active", mode === "pick");
  $("#seqControls").style.display = mode === "seq" ? "" : "none";
  $("#pickControls").style.display = mode === "pick" ? "" : "none";
  $("#modeHint").textContent = mode === "seq" ? `連続（開始から${state.maxSelect}問）` : `自由に最大${state.maxSelect}問ピックアップ`;

  state.selectedIds.clear();
  updateSelectedUI();
  renderList();
}

function selectSeqStart(startId) {
  const ids = getAllIdsSorted();
  const startIdx = ids.indexOf(startId);
  state.selectedIds.clear();
  for (let k=0; k<state.maxSelect; k++) {
    const id = ids[startIdx + k];
    if (id) state.selectedIds.add(id);
  }
  updateSelectedUI();
  renderList();
}

function renderList() {
  const list = $("#list");
  const q = $("#search").value;
  const rows = filterQuestions(q);
  $("#listCount").textContent = `${rows.length}件`;

  list.innerHTML = rows.map(row => {
    const id = escapeHTML(row[COL.id] ?? "");
    const rawId = (row[COL.id] ?? "").toString();
    const word = escapeHTML(row[COL.word] ?? "");
    const sent = escapeHTML(((row[COL.sentence] ?? "").toString().slice(0, 28)));

    const checked = state.selectedIds.has(rawId) ? "checked" : "";
    const disabled = (state.mode === "pick" && !checked && state.selectedIds.size >= state.maxSelect) ? "disabled" : "";
    const cb = state.mode === "pick"
      ? `<input type="checkbox" data-id="${id}" ${checked} ${disabled} aria-label="select">`
      : `<input type="checkbox" disabled ${checked} aria-label="selected">`;

    return `
      <div class="item">
        ${cb}
        <div style="flex:1;">
          <div class="row" style="justify-content:space-between;">
            <div><strong>${word}</strong> <span class="meta">（${id}）</span></div>
          </div>
          <div class="meta">${sent}…</div>
        </div>
      </div>
    `;
  }).join("");

  if (state.mode === "pick") {
    list.querySelectorAll('input[type="checkbox"][data-id]').forEach(cb => {
      cb.addEventListener("change", (e) => {
        const id = e.target.getAttribute("data-id");
        if (e.target.checked) state.selectedIds.add(id);
        else state.selectedIds.delete(id);
        updateSelectedUI();
        renderList();
      });
    });
  }
}

function resetSelection() {
  state.selectedIds.clear();
  if (state.mode === "seq") {
    selectSeqStart($("#seqStart").value);
  } else {
    updateSelectedUI();
    renderList();
  }
}

function getSelectedQuestions() {
  const ids = [...state.selectedIds];
  const order = new Map(getAllIdsSorted().map((id, idx) => [id, idx]));
  ids.sort((a,b)=> (order.get(a) ?? 1e9) - (order.get(b) ?? 1e9));

  const set = new Set(ids);
  const picked = ACTIVE_QUESTIONS.filter(q => set.has((q[COL.id] ?? "").toString()));
  picked.sort((a,b)=> (order.get(a[COL.id]) ?? 1e9) - (order.get(b[COL.id]) ?? 1e9));
  return picked;
}

function renderOption(idx, num, text, kana) {
  const name = `q_${idx}`;
  const id = `opt_${idx}_${num}`;
  const labelHtml = formatChoice(text ?? "", kana ?? "");
  return `
    <div class="opt">
      <input id="${id}" type="radio" name="${name}" value="${num}" />
      <label for="${id}">${labelHtml}</label>
    </div>
  `;
}

function renderQuestionCard(q, idx, total) {
  const qid = (q[COL.id] ?? "").toString();
  const word = (q[COL.word] ?? "").toString();
  const sentenceHTML = formatSentence(q);

  const a = (q[COL.ans] ?? "").toString().trim();
  const correctText = a === "1" ? q[COL.c1] : a === "2" ? q[COL.c2] : q[COL.c3];

  const showAnsBtn = state.settings.showAnswer
      ? `<button class="btn" type="button" data-action="showAnswer" data-box="ans_${idx}">答えを見る</button>`
      : "";

  return `
    <div class="card">
      <div class="qtitle">
        <div></div>
        <div class="qno">${escapeHTML(qid)}（${idx+1}/${total}）</div>
      </div>
      <div class="sentence" lang="ja"><span class="seqNo">${idx+1}.</span><div style="flex:1;">${sentenceHTML}</div></div>

      <div class="opts">
        ${renderOption(idx, 1, q[COL.c1], q[COL.c1k])}
        ${renderOption(idx, 2, q[COL.c2], q[COL.c2k])}
        ${renderOption(idx, 3, q[COL.c3], q[COL.c3k])}
      </div>

      <div class="row noPrint" style="margin-top:10px; justify-content:space-between;">
        <button class="btn primary" type="button" data-action="speak" data-id="${escapeHTML(qid)}">読み上げ</button>
        ${showAnsBtn}
      </div>

      <div class="answerBox" id="ans_${idx}">
        <div class="muted">正解</div>
        <div><strong>${escapeHTML(a)}</strong>：${escapeHTML(correctText ?? "")}</div>
      </div>
    </div>
  `;
}

let SPEAK_TOKEN = 0;

function setStopButton(enabled) {
  const b = $("#btnStopSpeech");
  if (!b) return;
  b.disabled = !enabled;
}

function stopSpeech() {
  SPEAK_TOKEN++;
  try { window.speechSynthesis.cancel(); } catch {}
  setStopButton(false);
}

function speakParts(parts) {
  if (!("speechSynthesis" in window)) {
    alert("この端末では読み上げが利用できません。");
    return;
  }

  // Cancel any previous speech and start a new token.
  stopSpeech();
  const myToken = ++SPEAK_TOKEN;
  setStopButton(true);

  const rate = Number(state.settings.rate) || 1.0;
  let idx = 0;

  const speakNext = () => {
    if (myToken !== SPEAK_TOKEN) return; // canceled or superseded
    if (idx >= parts.length) {
      setStopButton(false);
      return;
    }
    const u = new SpeechSynthesisUtterance(parts[idx]);
    u.lang = "ja-JP";
    u.rate = rate;
    u.onend = () => { idx++; speakNext(); };
    u.onerror = () => { idx++; speakNext(); };
    window.speechSynthesis.speak(u);
  };

  speakNext();
}

function speakQuestion(q) {
  const parts = [];
  parts.push((q[COL.sentenceKana] ?? "").toString());
  parts.push("いち");
  parts.push((q[COL.c1k] ?? "").toString());
  parts.push("に");
  parts.push((q[COL.c2k] ?? "").toString());
  parts.push("さん");
  parts.push((q[COL.c3k] ?? "").toString());
  speakParts(parts.filter(x => (x ?? "").toString().trim().length));
}

function renderQuiz() {
  $("#home").style.display = "none";
  $("#quiz").style.display = "";
  $("#btnGoHome").style.display = "";

  const picked = getSelectedQuestions();
  $("#quizSetLabel").textContent = picked.map(q => q[COL.id]).join(" / ");

  const container = $("#quizCards");
  const perPage = 5;
  const total = picked.length;
  container.innerHTML = picked.map((q, idx) => {
    const card = renderQuestionCard(q, idx, total);
    return (idx > 0 && idx % perPage === 0) ? `<div class="pageBreak"></div>${card}` : card;
  }).join("");

  // Bind "答えを見る" (direct)
  container.querySelectorAll("[data-action='showAnswer']").forEach(btn => {
    btn.addEventListener("click", () => {
      const boxId = btn.getAttribute("data-box");
      const box = document.getElementById(boxId);
      if (box) box.classList.toggle("show");
    });
  });

  // Speak button (delegation)
  container.onclick = (e) => {
    let t = e.target;
    if (!t) return;
    if (t.nodeType === 3) t = t.parentElement;
    if (!t || !t.closest) return;

    const speakBtn = t.closest("[data-action='speak']");
    if (speakBtn) {
      const id = speakBtn.getAttribute("data-id");
      const q = picked.find(x => (x[COL.id] ?? "") === id);
      if (q) speakQuestion(q);
      return;
    }
  };
}

function openSettings() {
  $("#settingsBackdrop").classList.add("show");
  syncSettingsUI();
}
function closeSettings() {
  $("#settingsBackdrop").classList.remove("show");
}
function syncSettingsUI() {
  $("#ansOn").classList.toggle("active", state.settings.showAnswer);
  $("#ansOff").classList.toggle("active", !state.settings.showAnswer);
  $("#rubyOn").classList.toggle("active", state.settings.ruby);
  $("#rubyOff").classList.toggle("active", !state.settings.ruby);
  $("#rate").value = String(state.settings.rate ?? 1.0);
}

async function init() {
  const hadStoredSettings = !!localStorage.getItem("gogi_settings_v1");
  loadSettings();
  const subsetInfo = await applyUrlSetIfAny();

  // Student initial defaults (only on first run on this device)
  if (subsetInfo && subsetInfo.isStudent && !hadStoredSettings) {
    state.settings.showAnswer = true;
    state.settings.ruby = true;
    state.settings.rate = 1.0;
    // Also start with "all questions" for student set
    if (Number.isFinite(state.maxSelect) && state.maxSelect >= 1) {
      // keep
    }
    saveSettings();
  }

  syncSettingsUI();

  $("#btnSettings").addEventListener("click", openSettings);
  $("#btnCloseSettings").addEventListener("click", closeSettings);
  $("#settingsBackdrop").addEventListener("click", (e) => {
    if (e.target === $("#settingsBackdrop")) closeSettings();
  });

  $("#ansOn").addEventListener("click", () => {
    state.settings.showAnswer = true; saveSettings(); syncSettingsUI();
  });
  $("#ansOff").addEventListener("click", () => {
    state.settings.showAnswer = false; saveSettings(); syncSettingsUI();
  });
  $("#rubyOn").addEventListener("click", () => {
    state.settings.ruby = true; saveSettings(); syncSettingsUI();
  });
  $("#rubyOff").addEventListener("click", () => {
    state.settings.ruby = false; saveSettings(); syncSettingsUI();
  });
  $("#rate").addEventListener("change", () => {
    state.settings.rate = Number($("#rate").value) || 1.0; saveSettings();
  });

  $("#btnStopSpeech").addEventListener("click", stopSpeech);

  const isStudent = !!(subsetInfo && subsetInfo.isStudent);

  // Lock mode UI for student set (A)
  if (isStudent) {
    // Hide mode switch (連続/ピックアップ) and disable reset/teacher features
    const seg = document.querySelector("[aria-label='mode']");
    if (seg) seg.style.display = "none";
    const btnReset = document.getElementById("btnReset");
    if (btnReset) btnReset.style.display = "none";
    const tgl = document.getElementById("teacherModeToggle");
    if (tgl) {
      const lb = tgl.closest("label");
      if (lb) lb.style.display = "none";
      tgl.checked = false;
    }
    const panel = document.getElementById("teacherPanel");
    if (panel) panel.style.display = "none";
  } else {
    $("#modeSeq").addEventListener("click", () => setMode("seq"));
    $("#modePick").addEventListener("click", () => setMode("pick"));
    $("#btnReset").addEventListener("click", resetSelection);
  }

  $("#search").addEventListener("input", renderList);

  $("#btnStart").addEventListener("click", renderQuiz);
  const bp = document.getElementById("btnPrint");
  if (bp) bp.addEventListener("click", () => window.print());
  const bp2 = document.getElementById("btnPrint2");
  if (bp2) bp2.addEventListener("click", () => window.print());

  $("#btnGoHome").addEventListener("click", () => {
    stopSpeech();
    $("#quiz").style.display = "none";
    $("#home").style.display = "";
    $("#btnGoHome").style.display = "none";
    renderList();
  });

  // Teacher mode (export selected IDs as JSON set)
  const tgl = document.getElementById("teacherModeToggle");
  if (tgl) {
    tgl.addEventListener("change", () => {
      updateTeacherPanel();
    });
  }
  const exportBtn = document.getElementById("btnExportSet");
  if (exportBtn) {
    exportBtn.addEventListener("click", () => {
      const fn = normalizeJsonFileName((document.getElementById("setFileName") ? document.getElementById("setFileName").value : "") || "");
      const obj = buildSetJsonFromSelection();
      downloadJson(fn, obj);
    });
  }
  // Keep export UI in sync
  const st = document.getElementById("setTitle");
  const sf = document.getElementById("setFileName");
  if (st) st.addEventListener("input", () => updateTeacherPanel());
  if (sf) sf.addEventListener("input", () => updateTeacherPanel());

  renderSeqDropdown();

  // For student set: force "all questions" to be selected immediately
  if (isStudent) {
    // ensure hint reflects the locked sequential count
    $("#modeHint").textContent = `連続（開始から${state.maxSelect}問）`;
  }

  renderList();
  updateSelectedList();
  updateTeacherPanel();

  // Auto-start when subset URL is used (child opens URL and can start immediately)
  const sp = new URLSearchParams(location.search);
  const autoStart = !(sp.get("autostart") === "0" || sp.get("home") === "1");
  if (subsetInfo && subsetInfo.applied && autoStart) {
    // Ensure selection UI reflects filtered set
    updateSelectedUI();
    renderQuiz();
  }
}




init();
</script>
