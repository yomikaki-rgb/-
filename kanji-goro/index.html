<style>
  :root{color-scheme:light;--ink:#282943;--muted:#5f6074;--purple:#4f378b;--lavender:#eee8fb;--paper:#faf8f5;--line:#dfdae5;--gold:#915204}
  :root{
    --school-font:"UD Digi Kyokasho N","UD デジタル 教科書体 N",
      "UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R",
      "UD Digi Kyokasho NP","UD デジタル 教科書体 NP",
      "UD Digi Kyokasho NP-R","UD デジタル 教科書体 NP-R",
      "UD Digi Kyokasho NK","UD デジタル 教科書体 NK",
      "UD Digi Kyokasho NK-R","UD デジタル 教科書体 NK-R",
      "UD Digi Kyokasho N-B","UD デジタル 教科書体 N-B",
      "UD Digi Kyokasho NP-B","UD デジタル 教科書体 NP-B",
      "UD Digi Kyokasho NK-B","UD デジタル 教科書体 NK-B",
      "BIZ UDGothic","Meiryo",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--school-font)}
  button,input,select{font:inherit}
  button,select{cursor:pointer}
  button{color:inherit;background:white;border:1px solid var(--line);border-radius:10px;padding:.55rem .9rem;font-weight:700}
  button:hover:enabled{border-color:var(--purple);background:#f7f2ff}
  button:disabled{opacity:.55;cursor:default}
  :focus-visible{outline:3px solid #7557ba;outline-offset:3px}
  [hidden]{display:none!important}
  .wrap{width:min(1050px,calc(100% - 32px));margin-inline:auto}
  header{background:#efe8fb;border-bottom:1px solid #e1d7f1;padding:30px 0 25px}
  .kicker{font-size:.8rem;letter-spacing:.09em;font-weight:800;color:var(--purple)}
  h1,h2,p{margin:0}
  h1{font-size:clamp(1.65rem,4vw,2.65rem);line-height:1.3;margin:8px 0}
  h2{font-size:1.35rem;line-height:1.4}
  .muted,small{color:var(--muted)}
  .controls{display:flex;align-items:center;justify-content:space-between;gap:8px 18px;flex-wrap:wrap;padding:16px 0}
  .controls nav{padding:0}
  .grade-picker{display:flex;align-items:center;gap:.45rem;font-weight:700}
  nav{display:flex;gap:8px;padding:20px 0 16px;flex-wrap:wrap}
  nav button{padding:.55rem .9rem}
  nav [aria-pressed="true"],.primary{background:var(--purple);color:white;border-color:var(--purple)}
  nav [aria-pressed="true"]:hover,.primary:hover:enabled{background:#422c79;color:white}
  main{padding-bottom:30px}
  .panel,.empty,.tile,.quiz{background:white;border:1px solid var(--line);border-radius:16px}
  .panel{padding:17px 19px;margin-bottom:15px}
  .label{font-weight:800;display:block;margin-bottom:4px}
  input[type="search"],input[type="text"],select{color:var(--ink);background:white;border:1px solid #a7a0b5;border-radius:9px;padding:.6rem .8rem;min-width:0}
  select{max-width:100%}
  input[type="search"]{width:100%;max-width:540px}
  .row{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
  .spread{justify-content:space-between}
  .results{margin:11px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(265px,100%),1fr));gap:12px}
  .tile{display:grid;grid-template-columns:1fr auto;align-items:start;gap:6px;padding:10px}
  .tile .open{border:0;padding:.4rem .55rem;min-width:0;text-align:left;display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:12px}
  .glyph{font:700 2.25rem/1.15 var(--school-font);text-align:center;color:#43316d;background:#f2edf9;border-radius:10px;padding:7px 0}
  .readings{display:grid;gap:1px;font-size:.88rem;overflow-wrap:anywhere}
  .tile-glyph{display:grid;gap:3px;text-align:center}
  .serial{font-size:.72rem;white-space:nowrap;color:var(--muted)}
  .readings b{color:var(--purple);margin-right:.45em}
  .star{font-size:.85rem;white-space:nowrap}
  .star[aria-pressed="true"]{background:#fff2d5;color:#714103;border-color:#e7c57b}
  .empty{padding:24px;text-align:center}
  dialog{color:var(--ink);width:min(880px,calc(100% - 24px));max-height:calc(100% - 24px);border:1px solid var(--line);border-radius:16px;padding:0}
  dialog::backdrop{background:#20172d88}
  .dialog-head{position:sticky;top:0;z-index:1;background:white;padding:12px 16px;border-bottom:1px solid var(--line)}
  .dialog-body{padding:15px 16px 20px}
  .art{display:block;width:100%;height:auto;border-radius:8px;border:1px solid #e8dfc2}
  .original{width:min(100%,600px);display:block;margin:auto}
  .actions{margin-top:12px}
  .quiz{padding:20px;text-align:center;max-width:760px;margin:auto}
  .question-reading{margin-top:12px;font-size:1.12rem}
  .card-choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(285px,100%),1fr));gap:12px;border:0;padding:0;margin:12px 0}
  .card-choice label{min-width:0;display:block;border:2px solid var(--line);border-radius:10px;padding:9px;cursor:pointer}
  .card-choice label:has(input:checked){border-color:var(--purple);background:var(--lavender)}
  .card-choice input{accent-color:var(--purple)}
  .card-choice .art{margin-top:7px}
  #dialog:has(#set-card-preview),#card-zoom{width:min(1400px,calc(100% - 24px))}
  .card-option{min-width:0}
  .card-option button{margin-top:6px}
  #card-zoom[open]{display:flex;flex-direction:column}
  #card-zoom .dialog-head{flex-shrink:0}
  #card-zoom-body{min-height:0;overflow:auto}
  .sets-grid{display:grid;gap:10px}
  .sets-grid .panel{margin-bottom:0;overflow-wrap:anywhere}
  .set-editor-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;margin-top:16px}
  .set-editor-grid h3{margin:0 0 6px;font-size:1rem}
  @media(max-width:650px){.set-editor-grid{grid-template-columns:1fr}}
  .set-picker{max-height:16rem;overflow:auto;padding:4px}
  .set-picker label{min-width:3.7rem}
  .set-order{max-height:15rem;overflow:auto;margin:6px 0;padding:0;list-style:none}
  .set-order li{margin-bottom:4px}
  .set-order button{padding:.15rem .5rem}
  .set-order button[aria-pressed="true"]{border-color:var(--purple);background:var(--lavender)}
  #set-status:empty{display:none}
  #speech-status:empty{display:none}
  .answer{margin:12px 0}
  .answer p{margin-bottom:8px}
  .center{justify-content:center}
  .pick{display:inline-flex;align-items:center;gap:5px;padding:.28rem .6rem;border:1px solid var(--line);border-radius:8px}
  .pick input{accent-color:var(--purple)}
  .print-picks{max-height:12rem;overflow:auto;padding:4px}
  .preview-title{margin:18px 0 8px}
  #preview{display:grid;gap:14px}
  .preview-page{width:min(610px,100%);margin:auto;container-type:inline-size}
  #preview .sheet{aspect-ratio:210/297;padding:5.71cqw;background:white;outline:1px solid var(--line);border-radius:4px}
  .print-heading{border-bottom:1px solid #777;font-weight:700}
  .sheet-cards{display:grid}
  .print-card{position:relative}
  .print-card .serial{position:absolute;top:0;left:0;color:#333}
  .print-card .art{width:100%;object-fit:contain;border:0;border-radius:0}
  #preview .print-heading{font-size:3cqw;line-height:3.8cqw;margin-bottom:1.43cqw;padding-bottom:.48cqw}
  #preview .sheet-cards{gap:1.43cqw}
  #preview .print-card .art{height:22.86cqw}
  #preview .print-card .serial{font-size:2cqw}
  #print-output{display:none}
  @media(max-width:520px){header{padding:20px 0 16px}.panel{padding:12px}.panel .spread{align-items:flex-start}.tile .open{grid-template-columns:45px minmax(0,1fr)}nav{gap:5px}nav button{padding:.45rem .65rem}}
  @page{size:A4 portrait;margin:12mm}
  @media print{
    body{background:white;color:#111;font-size:11pt}
    body > :not(#print-output){display:none!important}
    #print-output{display:block}
    #print-output .sheet{break-after:page}
    #print-output .sheet:last-child{break-after:auto}
    .print-heading{font-size:13pt;line-height:8mm;margin-bottom:3mm;padding-bottom:1mm}
    .sheet-cards{gap:3mm}
    .print-card{break-inside:avoid}
    .print-card .serial{font-size:9pt}
    .print-card .art{height:48mm}
  }
</style>
<body>
<header><div class="wrap">
  <h1>まんがと ゴロかんじ</h1>
</div></header>
<main class="wrap">
  <div class="controls">
  <nav aria-label="がめんを えらぶ">
    <button type="button" data-tab="search" aria-pressed="true">さがす</button>
    <button type="button" data-tab="saved" aria-pressed="false">☆ ほぞんした かんじ <span id="saved-count">0</span></button>
    <button type="button" data-tab="sets" aria-pressed="false">がくしゅうセット</button>
  </nav>
  <label class="grade-picker" for="grade">がくねん
    <select id="grade">
      <option value="all">ぜんぶ</option>
      <option value="1">1ねんせい</option>
      <option value="2">2ねんせい</option>
      <option value="3">3ねんせい</option>
      <option value="4">4ねんせい</option>
      <option value="5">5ねんせい</option>
      <option value="6">6ねんせい</option>
    </select>
  </label>
  </div>
  <section id="search">
    <div class="panel">
      <label class="label" for="query">かんじ・おんよみ・くんよみ</label>
      <input id="query" type="search" placeholder="光、コウ、ひかる" autocomplete="off">
    </div>
    <div class="row spread results">
      <p id="result-count" class="muted" aria-live="polite"></p>
      <label>ならべかた
        <select id="sort">
          <option value="textbook">きょうかしょの じゅん</option>
          <option value="on">おんよみの あいうえおじゅん</option>
        </select>
      </label>
    </div>
    <div id="search-list" class="grid"></div>
  </section>
  <section id="saved" hidden>
    <div class="panel row spread">
      <h2>☆ ほぞんした かんじ</h2>
      <div class="row">
        <button id="saved-print" data-action="print-saved">いんさつ・PDF</button>
      </div>
    </div>
    <div id="saved-list" class="grid"></div>
  </section>
  <section id="review" hidden></section>
  <section id="sets" hidden>
    <div class="panel">
      <div class="row spread">
        <div class="row">
          <label>せいと <select id="student-select"></select></label>
          <button data-action="student-new">せいとを とうろく</button>
          <button id="student-delete" data-action="student-delete">せいとを けす</button>
        </div>
        <div class="row">
          <button id="set-new" class="primary" data-action="set-new">セットを つくる</button>
          <button id="sets-export" data-action="sets-export">せいとの データを ほぞん</button>
          <button data-action="sets-import">ファイルを よみこむ</button>
          <input type="file" id="sets-file" accept=".json,application/json" hidden>
        </div>
      </div>
      <p id="set-status" role="status"></p>
    </div>
    <div id="sets-list" class="sets-grid"></div>
  </section>
  <p id="storage-note" class="muted" role="status" hidden>ほぞんできません。</p>
</main>
<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-head row spread">
    <h2 id="dialog-title"></h2>
    <button data-action="close">とじる</button>
  </div>
  <div id="dialog-body" class="dialog-body"></div>
</dialog>
<dialog id="card-zoom" aria-labelledby="card-zoom-title">
  <div class="dialog-head row spread">
    <h2 id="card-zoom-title"></h2>
    <button data-action="zoom-close" autofocus>とじる</button>
  </div>
  <div id="card-zoom-body" class="dialog-body"></div>
</dialog>
<section id="print-output" aria-hidden="true"></section>
<script>globalThis.cardImageData = Object.create(null);</script>

const storageKey = "manga-goro-grade2-prototype-saved-v1";

function storeData(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch {
    get("storage-note").hidden = false;
  }
}

function cleanMode(mode) {
  return mode === "mainOn" ? "mainOn" : "all";
}

function validSet(set) {
  return set && typeof set.id === "string" && /^[a-z0-9-]{1,80}$/i.test(set.id) && typeof set.name === "string" &&
    set.name.trim() && set.name.length <= 60 && Array.isArray(set.ids) && set.ids.length &&
    set.ids.length <= cards.length && new Set(set.ids).size === set.ids.length &&
    set.ids.every(id => byId.has(id)) && ["all", "mainOn"].includes(set.mode) &&
    (set.order === undefined || ["textbook", "kana"].includes(set.order)) &&
    (set.remember === undefined || (Array.isArray(set.remember) &&
      new Set(set.remember).size === set.remember.length &&
      set.remember.every(id => rememberIds.has(id) && set.ids.includes(id)))) &&
    (set.shuffle === undefined || typeof set.shuffle === "boolean");
}

function validStudent(student) {
  return student && typeof student.id === "string" && /^[a-z0-9_-]{1,100}$/i.test(student.id) &&
    typeof student.name === "string" && student.name.trim() && student.name.length <= 100;
}

function persistWorkspace() {
  storeData(workspaceKey, {students, studySets, studentId});
}

try {
  const storedVariants = JSON.parse(localStorage.getItem(variantKey) || "[]");
  if (Array.isArray(storedVariants)) variants = new Set(storedVariants.filter(id => rememberIds.has(id)));
  const workspace = JSON.parse(localStorage.getItem(workspaceKey) || "null");
  if (workspace && Array.isArray(workspace.students) && Array.isArray(workspace.studySets)) {
    students = workspace.students.filter(validStudent);
    studySets = workspace.studySets.filter(set => validSet(set) && students.some(student => student.id === set.studentId));
    studentId = students.some(student => student.id === workspace.studentId) ? workspace.studentId : students[0]?.id || "";
  } else {
    const storedSets = JSON.parse(localStorage.getItem(setsKey) || "[]");
    if (Array.isArray(storedSets) && storedSets.some(validSet)) {
      studentId = "legacy-sets";
      students = [{id:studentId, name:"これまでの セット"}];
      studySets = storedSets.filter(validSet).map(set => ({...set, studentId}));
      persistWorkspace();
    }
  }
  reviewMode = cleanMode(JSON.parse(localStorage.getItem(modeKey) || '"all"'));
} catch {
  get("storage-note").hidden = false;
}

function normalize(value) {
  return value.normalize("NFKC").trim().replace(/[()‐]/g, "").replace(/[ァ-ヶ]/g, char =>
    String.fromCharCode(char.charCodeAt(0) - 0x60)
  );
}

function readingLines(card, mode = "all") {
  return mode === "mainOn" ? [mainReadings[card.kanji]] : exampleReadings[card.kanji];
}

function readings(card, mode) {
  return readingLines(card, mode).join("、");
}

function modeOptions(mode) {
  return `<option value="mainOn"${mode === "mainOn" ? " selected" : ""}>おもな おんよみ</option>
    <option value="all"${mode === "all" ? " selected" : ""}>ぜんぶ よむ</option>`;
}

const imageUrls = new Map();

function imageUrl(id) {
  if (!imageUrls.has(id)) {
    const encoded = globalThis.cardImageData[id];
    const bytes = Uint8Array.from(atob(encoded), char => char.charCodeAt(0));
    imageUrls.set(id, URL.createObjectURL(new Blob([bytes], {type:"image/webp"})));
  }
  return imageUrls.get(id);
}

function picture(card, remember = variants.has(card.id)) {
  const id = remember ? "remember-" + card.id : card.id;
  return `<img class="art" src="${imageUrl(id)}" alt="${card.kanji}の ${remember ? "おぼえるカード" : "まんがと ゴロ"}">`;
}

function cardChoices(card, selected, scope) {
  if (!rememberIds.has(card.id)) return picture(card, false);
  const options = [
    {style:"manga", name:"まんがと ゴロ", remember:false},
    {style:"remember", name:"おぼえるカード", remember:true}
  ];
  return `<fieldset class="card-choice"><legend>${card.kanji}の カードを えらぶ</legend>
    ${options.map(({style, name, remember}) => `<div class="card-option">
      <label><input type="radio" name="${scope}-art" data-${scope}-id="${card.id}" value="${style}"${selected === remember ? " checked" : ""}>
        ${name}${picture(card, remember)}</label>
      <button data-action="zoom-card" data-id="${card.id}" data-style="${style}"
        aria-label="${name}を おおきく みる">おおきく みる</button>
    </div>`).join("")}</fieldset>`;
}

function showCardZoom(card, remember) {
  const zoom = get("card-zoom");
  get("card-zoom-title").textContent = `${card.kanji}　${remember ? "おぼえるカード" : "まんがと ゴロ"}`;
  const body = get("card-zoom-body");
  body.innerHTML = picture(card, remember);
  body.scrollLeft = 0;
  body.scrollTop = 0;
  zoom.showModal();
}

function cardNumber(card, order = get("sort").value) {
  const numbers = order === "on" ? onNumbers : order === "kana" ? kanaRanks : serials;
  return numbers.get(card.kanji);
}

function starText(card) {
  return saved.has(card.id) ? "★ ほぞんずみ" : "☆ ほぞん";
}

function star(card) {
  return `<button class="star" data-action="star" data-id="${card.id}" aria-pressed="${saved.has(card.id)}" aria-label="${card.kanji}を ほぞん">${starText(card)}</button>`;
}

function tile(card) {
  return `<article class="tile">
    <button class="open" data-action="card" data-id="${card.id}" aria-label="${card.kanji}の カードを ひらく">
      <span class="tile-glyph"><span class="glyph">${card.kanji}</span>
      <small class="serial">${cardNumber(card)}</small></span>
      <span class="readings"><span>${readings(card)}</span>
      ${get("grade").value === "all" ? `<small>${card.grade}ねんせい</small>` : ""}</span>
    </button>${star(card)}</article>`;
}

function inGrade(card) {
  const grade = get("grade").value;
  return grade === "all" || Number(grade) === card.grade;
}

function compareTextbook(first, second) {
  return first.grade - second.grade || serials.get(first.kanji) - serials.get(second.kanji);
}

function compareOn(first, second) {
  const left = first.on[0];
  const right = second.on[0];
  if (!left || !right) return Number(!left) - Number(!right) || compareTextbook(first, second);
  return normalize(left).localeCompare(normalize(right), "ja") || compareTextbook(first, second);
}

function orderCards(matching) {
  return matching.sort(get("sort").value === "on" ? compareOn : compareTextbook);
}

function renderSearch() {
  const query = normalize(get("query").value);
  const found = orderCards(cards.filter(card => inGrade(card) && matchesCard(card, query)));
  get("result-count").textContent = `${found.length} もじ`;
  get("search-list").innerHTML = found.map(tile).join("") ||
    '<p class="empty">みつかりませんでした。</p>';
}

function matchesCard(card, query) {
  return !query || card.kanji === query ||
    [...card.on, ...card.kun, ...(card.alt || []), ...exampleReadings[card.kanji]]
      .some(value => normalize(value).startsWith(query));
}

function savedCards() {
  return orderCards(cards.filter(card => inGrade(card) && saved.has(card.id)));
}

function renderSaved() {
  const matching = savedCards();
  get("saved-count").textContent = matching.length;
  get("saved-print").disabled = !matching.length;
  get("saved-list").innerHTML = matching.map(tile).join("") ||
    '<p class="empty">まだ ☆が ありません。</p>';
}

function toggleStar(button, card) {
  if (saved.has(card.id)) saved.delete(card.id);
  else saved.add(card.id);
  try {
    localStorage.setItem(storageKey, JSON.stringify([...saved]));
  } catch {
    get("storage-note").hidden = false;
  }
  const restoreFocus = button.closest("#search-list");
  renderSearch();
  renderSaved();
  if (button.isConnected) {
    button.setAttribute("aria-pressed", saved.has(card.id));
    button.textContent = starText(card);
  } else if (restoreFocus) {
    get("search-list").querySelector(`[data-action="star"][data-id="${card.id}"]`)?.focus();
  } else {
    document.querySelector('nav [data-tab="saved"]').focus();
  }
}

function showTab(name) {

    get(tab).hidden = tab !== name;
    document.querySelector(`nav [data-tab="${tab}"]`).setAttribute("aria-pressed", tab === name);

  if (name === "sets") renderSets();
  if (name !== "search") document.querySelector(`nav [data-tab="${name}"]`).focus();

    <div class="row center actions">
      <button data-action="listen">🔊 もういちど きく</button>
      ${quiz.revealed ? "" : '<button data-action="reading" aria-expanded="false" aria-controls="question-reading">よみかたを みる</button>'}
    </div>
    <p id="speech-status" class="muted" role="status"></p>
    ${quiz.revealed ? `<div class="answer"><p>${readings(card, quiz.mode)}</p>
      <small class="serial">${cardNumber(card, quiz.order)}</small>${picture(card, quiz.remember?.has(card.id))}</div>
      <button class="primary" data-action="next">${quiz.index + 1 === quiz.cards.length ? "おわる" : "つぎへ"}</button>` :
      `<p id="question-reading" class="question-reading" hidden>${readings(card, quiz.mode)}</p>
      <button class="primary actions" data-action="reveal">こたえを みる</button>`}
    </div>`;
}

function stopSpeech() {
  if (!activeSpeech) return;
  activeSpeech = null;
  globalThis.speechSynthesis?.cancel();
}

function showQuestionReading(button, visible) {
  get("question-reading").hidden = !visible;
  button?.setAttribute("aria-expanded", visible);
  if (button) button.textContent = visible ? "よみかたを とじる" : "よみかたを みる";
}

function speakQuestion() {
  const card = quiz?.cards[quiz.index];
  if (!card) return;
  const status = get("speech-status");
  const fallback = () => {
    status.textContent = "おんせいを さいせいできません。";
    if (!quiz.revealed) showQuestionReading(get("review").querySelector('[data-action="reading"]'), true);
  };
  const engine = globalThis.speechSynthesis;
  if (!engine || typeof globalThis.SpeechSynthesisUtterance !== "function") {
    fallback();
    return;
  }
  stopSpeech();
  const voices = engine.getVoices();
  const japanese = voices.filter(voice => /^ja(?:[-_]|$)/i.test(voice.lang));
  if (voices.length && !japanese.length) {
    fallback();
    return;
  }
  const speech = new SpeechSynthesisUtterance(readingLines(card, quiz.mode).join("。").replaceAll("‐", ""));
  speech.lang = "ja-JP";
  speech.rate = .85;
  const voice = japanese.find(item => item.localService) || japanese[0];
  if (voice) speech.voice = voice;
  speech.onend = () => {
    if (activeSpeech === speech) activeSpeech = null;
  };
  speech.onerror = event => {
    if (activeSpeech !== speech) return;
    activeSpeech = null;
    if (event.error !== "canceled" && event.error !== "interrupted") fallback();
  };
  status.textContent = "";
  activeSpeech = speech;
  try {
    engine.speak(speech);
  } catch {
    activeSpeech = null;
    fallback();
  }
}

function beginReview(order, mode, shuffle = false, remember, numberingOrder) {
  if (shuffle) {
    for (let index = order.length - 1; index > 0; index--) {
      const other = Math.floor(Math.random() * (index + 1));
      [order[index], order[other]] = [order[other], order[index]];
    }
  }
  if (!order.length) return;
  quiz = {cards:order, index:0, revealed:false, mode, remember, order:numberingOrder};
  advanceReviewFocus();
  speakQuestion();
}

function advanceReviewFocus() {
  renderReview();
  get("review").querySelector(".primary")?.focus();
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
}

function newSetId() {
  return globalThis.crypto?.randomUUID?.() || `set-${Date.now()}-${Math.random().toString(36).slice(2)}`;
}

function activeStudent() {
  return students.find(student => student.id === studentId);
}

function activeSets() {
  return studySets.filter(set => set.studentId === studentId);
}

function showStudentEditor() {
  showDialog("せいとを とうろく", `
    <div class="row"><label>なまえ <input id="student-name" type="text" maxlength="100"></label>
    <button class="primary" data-action="student-save">ほぞん</button></div>`);
  get("student-name").focus();
}

function saveStudent() {
  const name = get("student-name").value.trim();
  if (!name) {
    get("student-name").focus();
    return;
  }
  studentId = newSetId();
  students.push({id:studentId, name});
  persistWorkspace();
  dialog.close();
  renderSets();
}

function deleteStudent() {
  const student = activeStudent();
  if (!student || !globalThis.confirm(`${student.name} さんと、この せいとの セットを けしますか？`)) return;
  students = students.filter(item => item.id !== student.id);
  studySets = studySets.filter(set => set.studentId !== student.id);
  studentId = students[0]?.id || "";
  persistWorkspace();
  renderSets();
  get("set-status").textContent = "せいとを けしました。";
}

function renderSets() {
  const student = activeStudent();
  get("student-select").innerHTML = students.map(item =>
    `<option value="${item.id}">${escapeHtml(item.name)}</option>`
  ).join("") || '<option value="">まだ いません</option>';
  get("student-select").value = student?.id || "";
  get("student-select").disabled = !student;
  get("student-delete").disabled = !student;
  get("set-new").disabled = !student;
  get("sets-export").disabled = !student;
  get("sets-list").innerHTML = activeSets().map(set => `<article class="panel">
    <div class="row spread"><h2>${escapeHtml(set.name)}</h2>
      <span class="muted">${set.ids.length} もじ　${set.mode === "mainOn" ? "おもな おんよみ" : "ぜんぶ よむ"}</span>
    </div>
    <p class="actions">${set.ids.map(id => byId.get(id).kanji).join("・")}</p>
    <div class="row actions">
      <button class="primary" data-action="set-start" data-id="${set.id}">はじめる</button>
      <button data-action="set-edit" data-id="${set.id}">セットを へんしゅう</button>
      <button data-action="set-copy" data-id="${set.id}">コピー</button>
      <button data-action="set-print" data-id="${set.id}">いんさつ・PDF</button>
    </div></article>`).join("") || (student ?
    '<p class="empty">まだ セットが ありません。</p>' :
    '<p class="empty">せいとを とうろくして ください。</p>');
}

function showSetEditor(set) {
  if (!activeStudent()) return;
  setDraft = {id:set?.id || newSetId(), studentId, mode:set?.mode || reviewMode,
    order:set?.order || "kana", ids:set ? [...set.ids] : [],
    remember:new Set(set?.remember ?? set?.ids.filter(id => variants.has(id))), previewId:""};
  showDialog(set ? "セットを へんしゅう" : "セットを つくる", `
    <div class="row">
      <label>セットの なまえ <input id="set-name" type="text" maxlength="60" value="${escapeHtml(set?.name || "")}"></label>
      <label>よみかた <select id="set-mode">${modeOptions(setDraft.mode)}</select></label>
      <label class="pick"><input id="set-shuffle" type="checkbox"${set?.shuffle ? " checked" : ""}> まぜて はじめる</label>
    </div>
    <div class="set-editor-grid">
      <section aria-labelledby="set-picker-title">
        <h3 id="set-picker-title">かんじを えらぶ</h3>
        <div class="row">
          <label>がくねん <select id="set-grade">${get("grade").innerHTML}</select></label>
          <label>ならべかた <select id="set-sort">
            <option value="kana">50おんじゅん</option>
            <option value="textbook">きょうかしょの じゅん</option>
          </select></label>
          <label>さがす <input id="set-query" type="search" autocomplete="off"></label>
        </div>
        <div id="set-picker" class="row actions set-picker"></div>
      </section>
      <section aria-labelledby="set-count">
        <h3 id="set-count" aria-live="polite"></h3>
        <ol id="set-order" class="set-order"></ol>
      </section>
    </div>
    <div id="set-card-preview"></div>
    <div class="row actions">
      <button id="set-save" class="primary" data-action="set-save">ほぞん</button>
      ${set ? '<button data-action="set-delete">セットを けす</button>' : ""}
    </div>`);
  get("set-grade").value = get("grade").value;
  get("set-sort").value = setDraft.order;
  get("set-grade").addEventListener("change", renderSetCandidates);
  get("set-query").addEventListener("input", renderSetCandidates);
  get("set-sort").addEventListener("change", () => {
    setDraft.order = get("set-sort").value;
    renderSetCandidates();
    renderSetOrder();
  });
  get("set-name").addEventListener("input", updateSetSaveButton);
  renderSetCandidates();
  renderSetOrder();
}

function compareSetCards(first, second) {
  if (setDraft.order === "textbook") return compareTextbook(first, second);
  return first.grade - second.grade || kanaRanks.get(first.kanji) - kanaRanks.get(second.kanji);
}

function renderSetCandidates() {
  const grade = get("set-grade").value;
  const query = normalize(get("set-query").value);
  const matching = cards.filter(card => (grade === "all" || card.grade === Number(grade)) &&
    matchesCard(card, query)).sort(compareSetCards);
  get("set-picker").innerHTML = matching.map(card =>
    `<label class="pick"><input type="checkbox" data-set-card="${card.id}"${setDraft.ids.includes(card.id) ? " checked" : ""}>
    <small class="serial">${cardNumber(card, setDraft.order)}</small> ${card.kanji}</label>`
  ).join("") || '<p>みつかりませんでした。</p>';
}

function updateSetSaveButton() {
  get("set-save").disabled = !get("set-name").value.trim() || !setDraft.ids.length;
}

function renderSetOrder() {
  get("set-count").textContent = `えらんだ かんじ　${setDraft.ids.length} もじ`;
  get("set-order").innerHTML = setDraft.ids.map((id, index) => `<li><div class="row">
    <small class="serial">${cardNumber(byId.get(id), setDraft.order)}</small>
    <button data-action="set-preview" data-id="${id}" aria-controls="set-card-preview" aria-pressed="${id === setDraft.previewId}"
      aria-label="${byId.get(id).kanji}の カードを えらぶ">${byId.get(id).kanji} · ${setDraft.remember.has(id) ? "おぼえるカード" : "まんが"}</button>
    <button data-action="set-up" data-id="${id}" aria-label="まえへ"${index === 0 ? " disabled" : ""}>↑</button>
    <button data-action="set-down" data-id="${id}" aria-label="うしろへ"${index === setDraft.ids.length - 1 ? " disabled" : ""}>↓</button>
    <button data-action="set-remove" data-id="${id}">はずす</button>
  </div></li>`).join("");
  updateSetSaveButton();
}

function renderSetPreview() {
  const card = byId.get(setDraft.previewId);
  get("set-card-preview").innerHTML = card ? cardChoices(card, setDraft.remember.has(card.id), "set-style") : "";
}

function removeDraftCard(id) {
  setDraft.ids = setDraft.ids.filter(item => item !== id);
  setDraft.remember.delete(id);
  if (setDraft.previewId === id) {
    setDraft.previewId = "";
    renderSetPreview();
  }
}

function saveSet() {
  const set = {id:setDraft.id, studentId:setDraft.studentId, name:get("set-name").value.trim(),
    ids:[...setDraft.ids], mode:cleanMode(get("set-mode").value), order:setDraft.order,
    shuffle:get("set-shuffle").checked, remember:[...setDraft.remember]};
  if (!validSet(set) || set.studentId !== studentId) return;
  const index = studySets.findIndex(item => item.id === set.id);
  if (index < 0) studySets.push(set);
  else studySets[index] = set;
  persistWorkspace();
  dialog.close();
  renderSets();
}

function deleteSet() {
  if (!globalThis.confirm("この セットを けしますか？")) return;
  studySets = studySets.filter(set => set.studentId !== studentId || set.id !== setDraft.id);
  persistWorkspace();
  dialog.close();
  renderSets();
}

function copySet(id) {
  const set = activeSets().find(item => item.id === id);
  if (!set) return;
  studySets.push({...set, id:newSetId(), name:`${set.name.slice(0,54)} のコピー`, ids:[...set.ids]});
  persistWorkspace();
  renderSets();
  get("set-status").textContent = "セットを コピーしました。";
}

function studyBackup() {
  const sets = activeSets();
  const usedIds = new Set(sets.flatMap(set => set.ids));
  return {format:"manga-goro-student", version:2, student:activeStudent(), sets,
    remember:[...variants].filter(id => usedIds.has(id))};
}

function exportSets() {
  const data = studyBackup();
  if (!data.student) return;
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:"application/json"}));
  const link = document.createElement("a");
  link.href = url;
  link.download = `${data.student.name.replace(/[\\/:*?"<>|]/g, "_")}_かんじの がくしゅうセット.json`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

function importSets(data) {
  let incomingStudents;
  let incomingSets;
  let remembered = [];
  if (data?.schemaVersion === 1 && Array.isArray(data.students) && Array.isArray(data.sets)) {
    incomingStudents = data.students;
    incomingSets = data.sets.map(set => ({
      id:newSetId(), studentId:set?.studentId, name:set?.name, ids:Array.isArray(set?.chars) ?
        set.chars.map(char => byKanji.get(char)?.id) : [], mode:cleanMode(set?.readingMode)
    }));
  } else if (data?.format === "manga-goro-student" && data.version === 2) {
    incomingStudents = [data.student];
    incomingSets = data.sets;
    remembered = data.remember;
  } else if (data?.format === "manga-goro-study-sets" && data.version === 1 && Array.isArray(data.sets)) {
    incomingStudents = [{id:"legacy-backup", name:"よみこんだ セット"}];
    incomingSets = data.sets.map(set => ({...set, studentId:"legacy-backup"}));
    remembered = data.remember;
  }
  if (!incomingStudents?.length || !incomingStudents.every(validStudent) ||
      new Set(incomingStudents.map(student => student.id)).size !== incomingStudents.length ||
      !Array.isArray(incomingSets) || !incomingSets.every(set =>
        validSet(set) && incomingStudents.some(student => student.id === set.studentId)) ||
      !Array.isArray(remembered) || !remembered.every(id => rememberIds.has(id))) {
    throw new Error("Invalid study-set file");
  }
  const newIds = new Map(incomingStudents.map(student => [student.id, newSetId()]));
  for (const student of incomingStudents) {
    students.push({id:newIds.get(student.id), name:student.name});
  }
  for (const set of incomingSets) {
    studySets.push({id:newSetId(), studentId:newIds.get(set.studentId), name:set.name,
      ids:[...set.ids], mode:set.mode, order:set.order || "textbook", shuffle:set.shuffle === true,
      remember:set.remember});
  }
  studentId = newIds.get(incomingStudents[0].id);
  for (const id of remembered) variants.add(id);
  persistWorkspace();
  storeData(variantKey, [...variants]);
  renderSets();
  return incomingStudents.length;
}

function showPrint(options, remember, order) {
  printCards = options;
  printRemember = remember;
  printOrder = order;
  printSelection = new Set(options.map(card => card.id));
  showDialog("いんさつ・PDF", `
    ${options.length > cardsPerSheet ? `<div class="row">
      <button data-action="pick-all">ぜんぶ えらぶ</button>
      <button data-action="pick-none">ぜんぶ はずす</button>
    </div>` : ""}
    <div class="row actions print-picks">${options.map(card => `
      <label class="pick"><input type="checkbox" data-print-id="${card.id}" checked>
      <small class="serial">${cardNumber(card, printOrder)}</small> ${card.kanji}</label>`).join("")}</div>
    <div class="row actions">
      <button class="primary" id="print-button" data-action="print">いんさつ・PDFへ</button>
      <span id="print-count" class="muted" aria-live="polite"></span>
    </div>
    <h3 class="preview-title">いんさつの みほん</h3><div id="preview"></div>`);
  renderPrint();
}

function setPrintSelection(checked) {
  printSelection = new Set(checked ? printCards.map(card => card.id) : []);
  for (const input of dialog.querySelectorAll("[data-print-id]")) input.checked = checked;
  renderPrint();
}

function renderPrint() {
  const selected = printCards.filter(card => printSelection.has(card.id));
  const pageCount = Math.ceil(selected.length / cardsPerSheet);
  const pages = [];
  for (let index = 0; index < selected.length; index += cardsPerSheet) {
    const items = selected.slice(index, index + cardsPerSheet).map(card =>
      `<article class="print-card"><small class="serial">${cardNumber(card, printOrder)}</small>${picture(card, printRemember?.has(card.id))}</article>`
    ).join("");
    pages.push(`<section class="sheet">
      <div class="print-heading">かんじの ふくしゅう</div>
      <div class="sheet-cards">${items}</div></section>`);
  }
  get("print-button").disabled = !selected.length;
  get("print-count").textContent = `A4・${selected.length} もじ・${pageCount} ページ`;
  get("preview").innerHTML = pages.map(page => `<div class="preview-page">${page}</div>`).join("") ||
    '<p class="empty">いんさつする かんじを えらんでね。</p>';
  get("print-output").innerHTML = pages.join("");
}

get("query").addEventListener("input", renderSearch);
get("sort").addEventListener("change", () => {
  renderSearch();
  renderSaved();
});
get("grade").addEventListener("change", () => {
  renderSearch();
  renderSaved();
});
get("student-select").addEventListener("change", event => {
  studentId = event.target.value;
  persistWorkspace();
  renderSets();
});
get("sets-file").addEventListener("change", async event => {
  const file = event.target.files[0];
  if (!file) return;
  const status = get("set-status");
  try {
    if (file.size > 5_000_000) throw new Error("File too large");
    const added = importSets(JSON.parse(await file.text()));
    status.textContent = `${added} にん ついかしました。`;
  } catch {
    status.textContent = "セットの ファイルを よみこめません。";
  } finally {
    event.target.value = "";
  }
});
dialog.addEventListener("change", event => {
  const {printId, variantId, setCard, setStyleId} = event.target.dataset;
  if (variantId && rememberIds.has(variantId) && event.target.checked) {
    if (event.target.value === "remember") variants.add(variantId);
    else variants.delete(variantId);
    storeData(variantKey, [...variants]);
    return;
  }
  if (setStyleId && setDraft.ids.includes(setStyleId) && event.target.checked) {
    if (event.target.value === "remember") setDraft.remember.add(setStyleId);
    else setDraft.remember.delete(setStyleId);
    renderSetOrder();
    return;
  }
  if (setCard) {
    if (event.target.checked) setDraft.ids.push(setCard);
    else removeDraftCard(setCard);
    renderSetOrder();
    return;
  }
  if (!printId) return;
  if (event.target.checked) printSelection.add(printId);
  else printSelection.delete(printId);
  renderPrint();
});
dialog.addEventListener("close", () => {
  if (dialog.open) return;
  get("print-output").replaceChildren();
});

document.addEventListener("click", async event => {
  const button = event.target.closest("button");
  if (!button) return;
  const {action, id, tab} = button.dataset;
  if (tab) showTab(tab);
  const card = byId.get(id);
  switch (action) {
    case "star": toggleStar(button, card); break;
    case "card": showCard(card); break;
    case "original":
      showDialog(`もとの ページ　｜　${card.page} ページ`, `
        <button data-action="card" data-id="${card.id}">${card.kanji}の カードに もどる</button>
        <img class="art original actions" src="${imageUrl("page-" + card.page)}" alt="${card.page} ページ">`);
      break;
    case "close": dialog.close(); break;
    case "listen": speakQuestion(); break;
    case "reading": showQuestionReading(button, get("question-reading").hidden); break;
    case "reveal": stopSpeech(); quiz.revealed = true; advanceReviewFocus(); break;
    case "next":
      stopSpeech();
      quiz.index++;
      quiz.revealed = false;
      advanceReviewFocus();
      speakQuestion();
      break;
    case "set-new": showSetEditor(); break;
    case "student-new": showStudentEditor(); break;
    case "student-delete": deleteStudent(); break;
    case "student-save": saveStudent(); break;
    case "set-edit": showSetEditor(activeSets().find(set => set.id === id)); break;
    case "set-copy": copySet(id); break;
    case "set-save": saveSet(); break;
    case "set-delete": deleteSet(); break;
    case "sets-export": exportSets(); break;
    case "sets-import": get("sets-file").click(); break;
    case "set-preview": {
      setDraft.previewId = id;
      renderSetOrder();
      renderSetPreview();
      get("set-card-preview").querySelector("input:checked")?.focus();
      break;
    }
    case "zoom-card": showCardZoom(card, button.dataset.style === "remember"); break;
    case "zoom-close": get("card-zoom").close(); break;
    case "set-remove":
      removeDraftCard(id);
      renderSetCandidates();
      renderSetOrder();
      break;
    case "set-up":
    case "set-down": {
      const index = setDraft.ids.indexOf(id);
      const neighbor = index + (action === "set-up" ? -1 : 1);
      if (index < 0 || neighbor < 0 || neighbor >= setDraft.ids.length) break;
      [setDraft.ids[index], setDraft.ids[neighbor]] = [setDraft.ids[neighbor], setDraft.ids[index]];
      renderSetOrder();
      get("set-order").querySelector(`[data-id="${id}"]:enabled`)?.focus();
      break;
    }
    case "set-print":
    case "set-start": {
      const set = activeSets().find(item => item.id === id);
      if (!set) break;
      const order = set.ids.map(item => byId.get(item));
      const remember = set.remember ? new Set(set.remember) : undefined;
      if (action === "set-print") {
        showPrint(order, remember, set.order || "textbook");
        break;
      }
      showTab("sets");
      get("sets").hidden = true;
      get("review").hidden = false;
      beginReview(order, set.mode, set.shuffle, remember, set.order || "textbook");
      break;
    }
    case "print-saved": showPrint(savedCards()); break;
    case "print-one": showPrint([card]); break;
    case "pick-all": setPrintSelection(true); break;
    case "pick-none": setPrintSelection(false); break;
    case "print":
      await Promise.allSettled([...get("print-output").querySelectorAll("img")].map(img => img.decode()));
      if (dialog.open && get("print-button") && printSelection.size) window.print();
      break;
  }
});

renderSearch();
renderSaved();
</script>
