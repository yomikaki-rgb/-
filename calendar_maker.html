<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スタンプカレンダー（2ヶ月 / A4縦）</title>
<style>
:root{ --line:1px; --ink:#000; }
html,body{ margin:0; padding:0; }
body{
  font-family:
    "UD デジタル 教科書体 N",
    "UD デジタル 教科書体 NK",
    "UD デジタル 教科書体 NK-R",
    "BIZ UDゴシック",
    "Noto Sans JP",
    sans-serif;
  color:#000;
}

/* 編集UI（見やすさ改善：横幅いっぱいにしない） */
#editor{ padding:16px; max-width: 980px; margin: 0 auto; }
.field{ margin:10px 0; }
label{ display:inline-block; min-width:140px; }
input[type="month"]{ padding:6px 8px; }
textarea{
  width:100%;
  max-width:900px;
  height:6.2em; /* 4行程度 */
  padding:8px;
  box-sizing:border-box;
}
small{ color:#444; }
.controls{ display:block; margin-top:12px; }
button{ padding:8px 14px; font-size:14px; cursor:pointer; }

/* プレビュー枠（中央寄せ・固定幅） */
#previewWrap{
  max-width: 860px;
  margin: 16px auto 24px auto;
  border:1px solid #ccc;
  padding:12px;
  box-sizing:border-box;
}

/* 印刷 */
@page{ size:A4 portrait; margin:2cm; }
@media print{
  #editor{ display:none; }
  #previewWrap{ border:none; padding:0; margin:0; max-width:none; }
}

/* ページ分割を起こしにくくする（印刷DOM内で折り返さない） */
@media print{
  #print, .print-page, table{ break-inside: avoid; page-break-inside: avoid; }
}

/* 印刷DOM（tableベース） */
.print-page{ width:100%; }

/* コメント欄：14pt固定・最大4行想定（高さを詰めて1ページに収める） */
.comment-box{
  font-size:14pt;
  line-height:1.35;
  border:1px solid var(--ink);
  padding:1mm;      /* 整数mm */
  box-sizing:border-box;
  min-height:22mm;  /* 4行相当＋最小余白（詰める） */
  white-space:pre-wrap;
}

/* セクション間の最小余白 */
.spacer{ height:2mm; } /* 整数mm */

.month-title{
  font-size:14pt;
  margin:0;
  height:5mm;       /* 整数mm */
  line-height:5mm;
}

/* カレンダー本体（厳守：table + collapse、線幅1pxのみ） */
.cal{
  width:100%;
  border-collapse:collapse;
  border:var(--line) solid var(--ink);
  table-layout:fixed;
}
.cal th, .cal td{
  border-right:var(--line) solid var(--ink);
  border-bottom:var(--line) solid var(--ink);
  vertical-align:top;
  padding:1mm;      /* 整数mm */
}
/* 方式A：右端の二重線防止 */
.cal th:last-child, .cal td:last-child{ border-right:none; }
/* 最終行の下線は外枠に任せる */
.cal tr:last-child td{ border-bottom:none; }

.weekday{
  text-align:center;
  font-size:10pt;
  height:5mm;       /* 整数mm */
  line-height:5mm;
  padding:0;
}

.daynum{ font-size:12pt; line-height:1.05; }
.hname{ font-size:9pt; line-height:1.05; }
.is-holiday .daynum, .is-holiday .hname{ color:#c00; }
.hide-hname .hname{ display:none; }
.hide-holiday-color .is-holiday .daynum,
.hide-holiday-color .is-holiday .hname{ color:#000; }

ruby rt{ font-size:60%; }

@media print{
  body.hira-mode .hname{ font-size:7pt !important; }
}

</style>
</head>
<body>

<div id="editor" aria-label="編集画面">
  <h2>スタンプカレンダー（2ヶ月 / A4縦）</h2>

  <div class="field">
    <label for="startMonth">開始月（1ヶ月目）</label>
    <select id="startMonth"></select>
    <small>月曜始まりで自動生成します。</small>
  </div>

  <div class="field">
    <label><input id="toggleHolidays" type="checkbox" checked> 祝日を表示</label>
    <label style="margin-left:12px;"><input id="toggleHolidayNames" type="checkbox" checked> 祝日名を表示</label>
    <span style="margin-left:12px;">
      祝日名の表記：
      <select id="holidayNameStyle" aria-label="祝日名の表記">
        <option value="kanji">漢字</option>
        <option value="hira">ひらがな</option>
      </select>
    </span>
  </div>

  <div class="field">
    <label for="topComment">上のコメント（最大4行想定）</label>
    <textarea id="topComment"></textarea>
  </div>

  <div class="field">
    <label for="bottomComment">下のコメント（最大4行想定）</label>
    <textarea id="bottomComment"></textarea>
  </div>

  <div class="controls">
    <button id="btnUpdate" type="button">プレビュー更新</button>
    <button id="btnPrint" type="button" style="margin-left:10px;">印刷</button>
  </div>
</div>

<div id="previewWrap" aria-label="プレビュー（印刷DOM）">
  <div id="print"></div>
</div>

<script>
(function(){
  "use strict";

  const WEEKDAYS = [
    {k:"月", r:"げつ"},{k:"火", r:"か"},{k:"水", r:"すい"},
    {k:"木", r:"もく"},{k:"金", r:"きん"},{k:"土", r:"ど"},{k:"日", r:"にち"}
  ];

  const elStartMonth = document.getElementById("startMonth");
  const elTop = document.getElementById("topComment");
  const elBottom = document.getElementById("bottomComment");
  const elToggleH = document.getElementById("toggleHolidays");
  const elToggleHN = document.getElementById("toggleHolidayNames");
  const elHolidayNameStyle = document.getElementById("holidayNameStyle");
  const elPrint = document.getElementById("print");
  const btnUpdate = document.getElementById("btnUpdate");
  const btnPrint = document.getElementById("btnPrint");

  // ---- 開始月ドロップダウン（YYYY-MM） ----
  function populateMonthOptions(){
    // 開始月は 2026-01 固定。過去分を無くす代わりに後ろ（未来）を伸ばす。
    // 49ヶ月分（2026-01 〜 2030-01）を用意（操作性重視、印刷仕様には影響しない）
    const start = new Date(2026, 0, 1); // 2026-01-01
    const end = new Date(2040, 11, 1);   // 2030-01-01（含む）

    // 既存オプションをクリア
    while(elStartMonth.firstChild) elStartMonth.removeChild(elStartMonth.firstChild);

    for(let d = new Date(start); d <= end; d.setMonth(d.getMonth() + 1)){
      const y = d.getFullYear();
      const m = d.getMonth() + 1;
      const opt = document.createElement("option");
      opt.value = y + "-" + (m < 10 ? "0"+m : ""+m);
      opt.textContent = y + "年 " + m + "月";
      elStartMonth.appendChild(opt);
    }
  }

  function pad2(n){ return (n<10 ? "0"+n : ""+n); }
  function ymd(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function addMonths(year, monthIndex, add){
    const d = new Date(year, monthIndex, 1);
    d.setMonth(d.getMonth()+add);
    return {y:d.getFullYear(), m:d.getMonth()};
  }
  function lastDayOfMonth(year, monthIndex){ return new Date(year, monthIndex+1, 0).getDate(); }
  function mondayIndex(jsDay){ return (jsDay + 6) % 7; } // 0=月..6=日
  function weeksInMonth(year, monthIndex){
    const first = new Date(year, monthIndex, 1);
    const firstCol = mondayIndex(first.getDay());
    const days = lastDayOfMonth(year, monthIndex);
    return Math.ceil((firstCol + days)/7); // 4..6
  }

  // ---- 祝日（オフライン計算） ----
  function nthMonday(year, monthIndex, nth){
    const first = new Date(year, monthIndex, 1);
    const firstMonOffset = (8 - first.getDay()) % 7;
    const day = 1 + firstMonOffset + (nth-1)*7;
    return new Date(year, monthIndex, day);
  }
  function springEquinoxDay(year){
    const y = year - 1980;
    return Math.floor(20.8431 + 0.242194*y - Math.floor(y/4));
  }
  function autumnEquinoxDay(year){
    const y = year - 1980;
    return Math.floor(23.2488 + 0.242194*y - Math.floor(y/4));
  }
  function computeHolidaysJP(year){
    const hol = {};
    function set(d, kanji, hira){ hol[ymd(d)] = {kanji: kanji, hira: hira}; }
    function has(d){ return Object.prototype.hasOwnProperty.call(hol, ymd(d)); }

    set(new Date(year,0,1),  "元日", "がんじつ");
    set(new Date(year,1,11), "建国記念の日", "けんこくきねんび");
    set(new Date(year,1,23), "天皇誕生日", "てんのうたんじょうび");
    set(new Date(year,3,29), "昭和の日", "しょうわのひ");
    set(new Date(year,4,3),  "憲法記念日", "けんぽうきねんび");
    set(new Date(year,4,4),  "みどりの日", "みどりのひ");
    set(new Date(year,4,5),  "こどもの日", "こどものひ");
    set(new Date(year,7,11), "山の日", "やまのひ");
    set(new Date(year,10,3), "文化の日", "ぶんかのひ");
    set(new Date(year,10,23),"勤労感謝の日", "きんろうかんしゃのひ");

    set(nthMonday(year,0,2), "成人の日", "せいじんのひ");
    set(nthMonday(year,6,3), "海の日", "うみのひ");
    set(nthMonday(year,8,3), "敬老の日", "けいろうのひ");
    set(nthMonday(year,9,2), "スポーツの日", "すぽーつのひ");

    set(new Date(year,2,springEquinoxDay(year)), "春分の日", "しゅんぶんのひ");
    set(new Date(year,8,autumnEquinoxDay(year)), "秋分の日", "しゅうぶんのひ");

    // 振替休日
    const keys = Object.keys(hol).sort();
    for(const k of keys){
      const d = new Date(k+"T00:00:00");
      if(d.getDay() === 0){
        let sub = new Date(d); sub.setDate(sub.getDate()+1);
        while(has(sub)){ sub.setDate(sub.getDate()+1); }
        hol[ymd(sub)] = {kanji:"振替休日", hira:"ふりかえきゅうじつ"};
      }
    }

    // 国民の休日（祝日に挟まれた平日）
    const start = new Date(year,0,1);
    const end = new Date(year,11,31);
    for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
      const key = ymd(d);
      if(Object.prototype.hasOwnProperty.call(hol,key)) continue;
      const prev = new Date(d); prev.setDate(prev.getDate()-1);
      const next = new Date(d); next.setDate(next.getDate()+1);
      if(has(prev) && has(next)) hol[key] = {kanji:"国民の休日", hira:"こくみんのきゅうじつ"};
    }
    return hol;
  }
  function holidaysForYears(y1,y2){
    const map = {};
    const h1 = computeHolidaysJP(y1);
    for(const k in h1){ if(Object.prototype.hasOwnProperty.call(h1,k)) map[k]=h1[k]; }
    if(y2 !== y1){
      const h2 = computeHolidaysJP(y2);
      for(const k in h2){ if(Object.prototype.hasOwnProperty.call(h2,k)) map[k]=h2[k]; }
    }
    return map;
  }

  // ---- 高さ配分（1ページ厳守：整数mmのみ） ----
  // A4縦：297mm、上下マージン2cm=40mm → 印刷可能高さ 257mm
  const H = {
    page: 257,
    comment: 22,
    spacer: 2,
    title: 5,
    weekday: 5
  };

  function distributeHeights(totalMm, parts){
    const base = Math.floor(totalMm / parts);
    let rem = totalMm - base * parts;
    const arr = [];
    for(let i=0;i<parts;i++){
      let h = base;
      if(rem>0){ h += 1; rem -= 1; }
      arr.push(h);
    }
    return arr;
  }

  function buildWeekdayHeaderRow(){
    const tr = document.createElement("tr");
    for(const w of WEEKDAYS){
      const th = document.createElement("th");
      th.className = "weekday";
      th.innerHTML = "<ruby>"+w.k+"<rt>"+w.r+"</rt></ruby>";
      th.style.height = H.weekday + "mm";
      tr.appendChild(th);
    }
    return tr;
  }

  function buildMonthTable(year, monthIndex, holidays, holidayNameStyle, dayRowsTotalMm){
    const table = document.createElement("table");
    table.className = "cal";

    const thead = document.createElement("thead");
    thead.appendChild(buildWeekdayHeaderRow());
    table.appendChild(thead);

    const weeks = weeksInMonth(year, monthIndex);
    const rowHeights = distributeHeights(dayRowsTotalMm, weeks);

    const tbody = document.createElement("tbody");
    const first = new Date(year, monthIndex, 1);
    const firstCol = mondayIndex(first.getDay());
    const days = lastDayOfMonth(year, monthIndex);

    let cellIndex = 0;
    for(let w=0; w<weeks; w++){
      const tr = document.createElement("tr");
      tr.style.height = rowHeights[w] + "mm";

      for(let c=0; c<7; c++){
        const td = document.createElement("td");
        const dayNum = cellIndex - firstCol + 1;

        if(dayNum >= 1 && dayNum <= days){
          const d = new Date(year, monthIndex, dayNum);
          const key = ymd(d);
          const hobj = holidays[key];

          const dn = document.createElement("div");
          dn.className = "daynum";
          dn.textContent = String(dayNum);
          td.appendChild(dn);

          if(hobj){
            td.classList.add("is-holiday");
            const hn = document.createElement("div");
            hn.className = "hname";
            hn.textContent = (holidayNameStyle === "hira" ? hobj.hira : hobj.kanji);
            td.appendChild(hn);
          }
        }else{
          const dn = document.createElement("div");
          dn.className = "daynum";
          dn.textContent = "";
          td.appendChild(dn);
        }

        tr.appendChild(td);
        cellIndex++;
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    return table;
  }

  function monthTitleText(year, monthIndex){
    return year + "年 " + (monthIndex+1) + "月";
  }
  function makeSpacer(){
    const s = document.createElement("div");
    s.className = "spacer";
    return s;
  }

  function restore(){
    try{
      const s = localStorage.getItem("seal_calendar_state_v4");
      if(!s) return;
      const o = JSON.parse(s);
      if(o && typeof o === "object"){
        if(o.startMonth) elStartMonth.value = o.startMonth;
        if(typeof o.top === "string") elTop.value = o.top;
        if(typeof o.bottom === "string") elBottom.value = o.bottom;
        if(typeof o.showH === "boolean") elToggleH.checked = o.showH;
        if(typeof o.showHN === "boolean") elToggleHN.checked = o.showHN;
        if(o.holidayNameStyle && elHolidayNameStyle) elHolidayNameStyle.value = o.holidayNameStyle;
      }
    }catch(e){}
  }

  async function render(){
    if(!elStartMonth.value){
      elStartMonth.value = "2026-01";
    }
    if(elHolidayNameStyle && !elHolidayNameStyle.value){
      elHolidayNameStyle.value = "hira";
    }

    const showH = !!elToggleH.checked;
    const showHN = !!elToggleHN.checked;
    const holidayNameStyle = (elHolidayNameStyle && elHolidayNameStyle.value) ? elHolidayNameStyle.value : "kanji";

    const [yStr, mStr] = elStartMonth.value.split("-");
    const y1 = Number(yStr);
    const m1 = Number(mStr) - 1;
    const m2 = addMonths(y1, m1, 1);
    const y2 = m2.y, mo2 = m2.m;

    const holidays = showH ? holidaysForYears(y1, y2) : {};

    // 固定部分合計（2ヶ月＋上下コメント）
    const fixed =
      H.comment + H.spacer +
      H.title + H.weekday +
      H.spacer +
      H.title + H.weekday +
      H.spacer +
      H.comment;

    // 誤差吸収の安全余白（整数mm）
    const safety = 14;
    let remaining = H.page - fixed - safety;
    if(remaining < 50) remaining = 50;

    const perMonthDayRows = Math.floor(remaining / 2);

    // 状態保存
    try{
      localStorage.setItem("seal_calendar_state_v4", JSON.stringify({
        startMonth: elStartMonth.value,
        top: elTop.value,
        bottom: elBottom.value,
        showH: showH,
        showHN: showHN,
        holidayNameStyle: holidayNameStyle
      }));
    }catch(e){}

    const page = document.createElement("div");
    page.className = "print-page";
    if(!showHN) page.classList.add("hide-hname");
    if(!showH) page.classList.add("hide-holiday-color");

    const top = document.createElement("div");
    top.className = "comment-box";
    top.textContent = elTop.value || "";
    page.appendChild(top);
    page.appendChild(makeSpacer());

    const t1 = document.createElement("div");
    t1.className = "month-title";
    t1.textContent = monthTitleText(y1, m1);
    page.appendChild(t1);
    page.appendChild(buildMonthTable(y1, m1, holidays, holidayNameStyle, perMonthDayRows));
    page.appendChild(makeSpacer());

    const t2 = document.createElement("div");
    t2.className = "month-title";
    t2.textContent = monthTitleText(y2, mo2);
    page.appendChild(t2);
    page.appendChild(buildMonthTable(y2, mo2, holidays, holidayNameStyle, perMonthDayRows));
    page.appendChild(makeSpacer());

    const bottom = document.createElement("div");
    bottom.className = "comment-box";
    bottom.textContent = elBottom.value || "";
    page.appendChild(bottom);

    while(elPrint.firstChild) elPrint.removeChild(elPrint.firstChild);
    elPrint.appendChild(page);
  }

  btnUpdate.addEventListener("click", function(){ render(); });
  elToggleH.addEventListener("change", function(){ render(); });
  elToggleHN.addEventListener("change", function(){ render(); });
  if(elHolidayNameStyle) elHolidayNameStyle.addEventListener("change", function(){ render(); });
  btnPrint.addEventListener("click", function(){ render().then(function(){ window.print(); }); });

  populateMonthOptions();
  restore();
  // restore後も未選択なら 2026-01 を選択
  if(!elStartMonth.value){
    elStartMonth.value = "2026-01";
  }
  if(elHolidayNameStyle && !elHolidayNameStyle.value){
    elHolidayNameStyle.value = "hira";
  }
  render();
})();
</script>

<script>
(function(){
  const selects = document.querySelectorAll("select");
  if(!selects.length) return;

  function isHiragana(val){
    return val === "hiragana" || val === "hira" || val === "ひらがな";
  }

  function applyMode(){
    let hira = false;
    selects.forEach(sel=>{
      if(isHiragana(sel.value)) hira = true;
    });
    if(hira){
      document.body.classList.add("hira-mode");
    }else{
      document.body.classList.remove("hira-mode");
    }
  }

  selects.forEach(sel=>{
    sel.addEventListener("change", applyMode);
  });

  applyMode();
})();
</script>

</body>
</html>
